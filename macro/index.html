function viewCards(pre){
  const sel = new Set(pre && CH[pre] ? [pre] : COURSE.map(c => c.id));
  const root = h("div", { class: "mod", html: `${mhead("Macroeconomics", "Flashcards", "Say the answer out loud, then flip. Cards you know leave the pile; the others come back.")}
    <div class="drillbar"><div class="mchips">${COURSE.map(c => chipCh(c, sel.has(c.id))).join("")}</div><div class="seg"><button type="button" data-shuffle>Shuffle</button><button type="button" data-resetk>Reset known</button></div></div>
    <div class="mprog"><div class="mbar"><i data-fbar></i></div><span data-fcount></span></div>
    <div class="fstage"></div>` });
  const stage = root.querySelector(".fstage");
  let deck = [];
  const known = () => MS.get("cards", {});
  const build = (mix) => { const k = known(); deck = CARDS.map((c, i) => ({ i, ch: c[0], f: c[1], b: c[2] })).filter(c => sel.has(c.ch) && !k[c.i]); if (mix) deck = shuffle(deck); paint(); };
  function paint(){
    const k = known(), total = CARDS.filter(c => sel.has(c[0])).length, kn = CARDS.filter((c, i) => sel.has(c[0]) && k[i]).length;
    root.querySelector("[data-fbar]").style.width = (total ? kn / total * 100 : 0) + "%"; root.querySelector("[data-fcount]").textContent = `${kn} of ${total} known · ${deck.length} left in the pile`;
    if (!deck.length){ stage.innerHTML = `<div class="sprintend"><span class="kicker">Pile empty</span><h2>You know all ${total} cards</h2><div class="row"><button class="btn primary" type="button" data-resetk>Start over</button><a class="btn glassy" href="#quiz">Take a quiz</a></div></div>`; return; }
    const c = deck[0], C = CH[c.ch];
    stage.innerHTML = `<div class="fdeck" data-n="${Math.min(2, deck.length - 1)}"><button class="flip enter" type="button" aria-label="Flip the card" style="--c:${C.c}"><span class="face front"><em>${C.short}</em><b>${c.f}</b><small>Click or press Space to flip</small></span><span class="face back"><em>${c.f}</em><b>${c.b}</b></span></button></div>
      <div class="fact"><button class="btn glassy big" type="button" data-again>Again <kbd>←</kbd></button><button class="btn primary big" type="button" data-know>I knew it <kbd>→</kbd></button></div>`;
  }
  const flip = () => { const f = stage.querySelector(".flip"); if (f) f.classList.toggle("on"); };
  /* the card leaves the deck: to the right when known, to the back when it comes again */
  let busy = false;
  const leave = (dir, fn) => { const f = stage.querySelector(".flip"); if (busy) return; if (!f || matchMedia("(prefers-reduced-motion: reduce)").matches){ fn(); return; } busy = true; f.classList.add("fly-" + dir); setTimeout(() => { busy = false; fn(); }, 260); };
  const again = () => { if (!deck.length) return; leave("l", () => { deck.push(deck.shift()); paint(); }); };
  const got = () => { if (!deck.length) return; burst(stage.querySelector("[data-know]"), ["--ok", "--flow", "--inj"]); leave("r", () => { const k = known(); k[deck[0].i] = 1; MS.set("cards", k); deck.shift(); paint(); }); };
  root.addEventListener("click", e => {
    const cb = e.target.closest("[data-ch]"); if (cb){ const k = cb.dataset.ch; if (sel.has(k) && sel.size > 1) sel.delete(k); else sel.add(k); cb.classList.toggle("on", sel.has(k)); cb.setAttribute("aria-pressed", String(sel.has(k))); build(true); }
    if (e.target.closest(".flip")) flip();
    if (e.target.closest("[data-again]")) again();
    if (e.target.closest("[data-know]")) got();
    if (e.target.closest("[data-shuffle]")) build(true);
    if (e.target.closest("[data-resetk]")){ const k = known(); CARDS.forEach((c, i) => { if (sel.has(c[0])) delete k[i]; }); MS.set("cards", k); build(true); }
  });
  const onKey = e => { if (!root.isConnected){ document.removeEventListener("keydown", onKey); return; } if (e.target.matches && e.target.matches("input,textarea")) return;
    if (e.key === " "){ e.preventDefault(); flip(); } if (e.key === "ArrowLeft") again(); if (e.key === "ArrowRight") got(); };
  document.addEventListener("keydown", onKey);
  build(true);
  return root;
}

        { n: "2b", kind: "explain", text: "What happens if W > J? And if W < J?", points: ["W > J: part of income leaks out without being offset", "W > J: demand falls, unsold inventories build up, output falls (slowdown, recession)", "W < J: more income enters the circuit than leaves it", "W < J: demand rises, inventories fall, output rises (expansion)", "Equilibrium requires W = J"],
          model: ["If W > J, part of national income leaks out of the circular flow without being offset by an equal injection. Aggregate demand falls, unsold inventories accumulate and firms cut output: the economy slows down, possibly into recession.", "If W < J, more income enters the circuit than leaves it. Demand rises, inventories fall and firms raise output: the economy expands.", "In short: if W > J output falls, if W < J output rises. Equilibrium requires W = J."] },
        { n: "3", kind: "mcq", text: "Which economic policy would help restore equilibrium?", opts: pol.opts, right: pol.right, why: over ? "To close W > J, raise injections (G, I, X) or reduce leakages (T, M)." : "To close W < J, reduce injections or raise leakages, for example by cutting G or raising T." }
      ] };
  },
  kc(){
    const c = PICK([0.6, 0.7, 0.75, 0.8, 0.85, 0.9]), C0 = RI(20, 300, 10), Yd = RI(6, 40) * 100, C = c * Yd + C0, S = Yd - C, apc = C / Yd, s = 1 - c, YR = C0 / s;
    const mean = tdShuffle([`Out of each extra euro of disposable income, the household consumes €${c} and saves €${fmt(s, 2)}.`, `The household consumes ${Math.round(c * 100)}% of its total disposable income.`, `The household saves ${Math.round(c * 100)}% of each extra euro.`, `Consumption grows ${c} times faster than income.`], 0);
    const below = tdShuffle(["Saving is negative: the household dissaves, borrowing or using past savings to consume.", "Saving is zero: the household spends all its income.", "Saving is positive but small.", "Consumption is zero."], 0);
    return { title: "Consumption and saving (Keynesian approach)",
      data: `<ul><li>Consumption function: <span class="mono">C = ${c}Yd + ${C0}</span></li><li>Disposable income: <span class="mono">Yd = ${fmt(Yd)}</span></li></ul>`,
      parts: [
        { n: "1a", kind: "num", text: "Calculate consumption C.", ans: C, unit: "€", tol: 0.5, calc: `C = ${c} × ${fmt(Yd)} + ${C0} = ${eur(C, 2)}`, why: "Plug Yd into the consumption function." },
        { n: "1b", kind: "num", text: "Calculate saving S.", ans: S, unit: "€", tol: 0.5, calc: `S = Yd − C = ${fmt(Yd)} − ${fmt(C, 2)} = ${eur(S, 2)}`, why: "Saving is the residual: what is left after consumption." },
        { n: "1c", kind: "explain", text: "Interpret these results.", points: ["Consumption has an income-dependent part (c·Yd) and an autonomous part (C₀)", "Autonomous consumption happens even with zero income", "Saving is the residual: income left after consumption", "Keynes: consumption depends directly on disposable income"],
          model: [`Out of a disposable income of €${fmt(Yd)}, the household consumes €${fmt(C, 2)} and saves €${fmt(S, 2)}. Consumption has two parts: one that depends on income (${c} × Yd) and an autonomous part (€${C0}) that is spent even with zero income.`, "Saving is what is left once consumption has taken place: in the Keynesian model, consumption depends directly on disposable income and saving is residual."] },
        { n: "2a", kind: "num", text: "Calculate the APC. Two decimals.", ans: apc, unit: "", tol: 0.006, calc: `APC = C / Yd = ${fmt(C, 2)} / ${fmt(Yd)} = ${fmt(apc, 3)}`, why: "The share of disposable income that is consumed." },
        { n: "2b", kind: "num", text: "Calculate the APS. Two decimals.", ans: 1 - apc, unit: "", tol: 0.006, calc: `APS = 1 − APC = ${fmt(1 - apc, 3)}`, why: "APC + APS = 1: the share of disposable income that is saved." },
        { n: "3", kind: "mcq", text: `Explain the meaning of c = ${c}.`, opts: mean.opts, right: mean.right, why: `c is the marginal propensity to consume: it applies to each additional euro. MPC + MPS = 1, so the MPS is ${fmt(s, 2)}. The higher the MPC, the stronger the multiplier.` },
        { n: "4a", kind: "num", text: "Determine the income level at which S = 0.", ans: YR, unit: "€", tol: 0.5, calc: `S = Yd − (${c}Yd + ${C0}) = ${fmt(s, 2)}Yd − ${C0} = 0 → Yd = ${C0} / ${fmt(s, 2)} = ${eur(YR, 2)}`, why: "Write the saving function, set S = 0 and solve." },
        { n: "4b", kind: "mcq", text: "What happens when disposable income is below this level?", opts: below.opts, right: below.right, why: "Below break-even income, consumption exceeds income. At break-even S = 0; above it, the household starts to save. Saving is strongly constrained by income." }
      ] };
  },
  nc(){
    const inc = RI(10, 40) * 100, r = PICK([2, 3, 4, 5, 6, 8, 10]), sav = RI(2, 6) * 100, fv = sav * (1 + r / 100), r2 = r * 2;
    const eff = tdShuffle(["Saving becomes more attractive: households consume less today and more in the future.", "Saving becomes less attractive: households consume more today.", "Nothing changes: only current income matters.", "Households stop saving because prices rise."], 0);
    return { title: "Consumption vs saving (Neoclassical approach)",
      data: `<p>An individual has a current income of €${fmt(inc)}. They may consume it or save it at an annual interest rate of ${r}%.</p>`,
      parts: [
        { n: "1", kind: "num", text: `If the individual saves €${sav}, how much will these savings be worth after one year?`, ans: fv, unit: "€", tol: 0.5, calc: `${sav} × (1 + ${r / 100}) = ${eur(fv, 2)}`, why: "Future value = savings × (1 + interest rate). Saving transfers purchasing power through time." },
        { n: "2", kind: "explain", text: "Explain how the interest rate influences saving and consumption decisions.", points: ["The interest rate is the return on saving", "It is also the opportunity cost of consuming today", "It is the reward for postponing consumption", "High rate: save more, consume less now", "Low rate: less incentive to save, more current spending"],
          model: [`By saving €${sav}, the individual gives up consumption today to consume more tomorrow: the savings earn €${fmt(fv - sav, 2)} of interest over the year. The interest rate is the reward for postponing consumption.`, "It is both the return on saving and the opportunity cost of consuming now. When it is high, saving is more attractive, so households save more and consume less today. When it is low, there is less incentive to postpone consumption, so current spending rises."] },
        { n: "3", kind: "mcq", text: `The interest rate rises to ${r2}%. How does this change saving and consumption decisions?`, opts: eff.opts, right: eff.right, why: "Each euro saved earns more, so households shift consumption from the present towards the future." },
        { n: "4", kind: "explain", text: "Explain the main determinants of the consumption–saving trade-off.", points: ["Preferences for present versus future consumption", "Income: low-income households can hardly save", "Wealth (accumulated savings, assets) and expected future income", "The interest rate: return on saving and opportunity cost of consuming now"],
          model: ["Three factors decide how income is split between consumption and saving. First, preferences: people with a strong preference for the present consume more and save little, while those who value the future save more.", "Second, income and wealth: low-income households spend most of their income on essentials, while higher incomes and accumulated wealth allow more saving.", "Third, the interest rate: as the return on saving and the opportunity cost of consuming today, a higher rate encourages saving and a lower rate encourages current consumption."] }
      ] };
  },
  mu(){
    const c = PICK([0.6, 0.7, 0.75, 0.8, 0.85, 0.9]), dI = RI(2, 20) * 10, k = 1 / (1 - c), dY = k * dI;
    const rate = tdShuffle(["A lower rate cuts the cost of financing (and the opportunity cost of own funds), so more projects are profitable and investment rises.", "A lower rate raises the cost of financing, so investment falls.", "The interest rate only affects households, not firms.", "Investment depends only on current sales, not on the interest rate."], 0);
    return { title: "Investment and the investment multiplier",
      data: `<ul><li>Marginal propensity to consume: <span class="mono">c = ${c}</span></li><li>Change in investment: <span class="mono">ΔI = ${dI}</span></li></ul>`,
      parts: [
        { n: "1", kind: "num", text: "Calculate the investment multiplier k. Two decimals.", ans: k, unit: "", tol: 0.011, calc: `k = 1 / (1 − ${c}) = 1 / ${fmt(1 - c, 2)} = ${fmt(k, 2)}`, why: `An initial increase in demand is amplified ${fmt(k, 2)} times in the economy.` },
        { n: "2", kind: "num", text: "Calculate ΔY.", ans: dY, unit: "", tol: 0.3, calc: `ΔY = k × ΔI = ${fmt(k, 2)} × ${dI} = ${fmt(dY, 2)}`, why: "The rise in investment leads to a larger rise in income through chain effects." },
        { n: "3", kind: "explain", text: "Explain why ΔY > ΔI.", points: ["The extra investment is a first injection", "It becomes income for other agents", `A share c (${Math.round(c * 100)}%) of that income is consumed`, "That consumption becomes income again: the process repeats", "Each round is smaller, but the total adds up to k × ΔI"],
          model: [`The initial investment of ${dI} is a first injection into the economy. It becomes income for other agents, who consume ${Math.round(c * 100)}% of it (c = ${c}). That consumption becomes income for others, who spend part of it again, and so on.`, `At each round only part of income is spent again, but the rounds add up: the total rise in income is ΔY = k × ΔI = ${fmt(dY, 1)}, greater than the initial ${dI}.`] },
        { n: "4", kind: "mcq", text: "Explain the relationship between the interest rate and investment.", opts: rate.opts, right: rate.right, why: "The interest rate is the cost of financing; even with own funds, the firm gives up an alternative return. A fall in the rate stimulates investment and, through the multiplier, growth." }
      ] };
  }
};

function viewTD(){
  const st = MS.get("td", {});
  return h("div", { class: "mod", html: `${mhead("Macroeconomics", "Tutorials", "The exercises of the tutorial sheets, with new numbers every time. Calculate first, then explain: that is how the exam exercise is written.")}
    <a class="tdfull" href="#td-all"><span><b>Full tutorial sheet</b><span>All five exercises in a row, like Tutorial 1. About 45 minutes.</span></span>${ICO.arrow}</a>
    <div class="tdlist">${TD_TYPES.map((t, i) => `<a class="tdcard" href="#td-${t.id}"><span class="tdn">Exercise ${i + 1}</span><b>${t.title}</b><span>${t.what}</span>${st[t.id] ? `<em>Done ${st[t.id]}×</em>` : ""}</a>`).join("")}</div>
    <p class="muted small">Based on Tutorial 1: the circular flow of income and the fundamental determinants of economic activity.</p>
    ${creditHtml()}` });
}
function tdPart(p, key){
  const L = "ABCD";
  let body = "";
  if (p.kind === "num") body = `<div class="ans"><label class="field"><input inputmode="decimal" autocomplete="off" aria-label="Your answer">${p.unit ? `<span class="unit">${p.unit}</span>` : ""}</label><button class="check" type="button" data-tdcheck>Check</button></div>`;
  if (p.kind === "mcq") body = `<div class="opts">${p.opts.map((o, j) => `<button class="opt" type="button" data-tdopt="${j}"><span class="k">${L[j]}</span><span>${o}</span></button>`).join("")}</div>`;
  if (p.kind === "explain") body = `<textarea class="tdta" placeholder="Write your explanation as in the exam."></textarea><div class="row"><button class="btn quiet small" type="button" data-tdmodel>Compare with the model answer</button></div>`;
  return `<article class="card tdpart" data-key="${key}"><div class="qhead"><span class="qn">${p.n}</span><span class="qtag">${p.kind === "explain" ? "Explain" : p.kind === "mcq" ? "Choose" : "Calculate"}</span></div><p class="qtext">${p.text}</p>${body}<div class="tdout"></div></article>`;
}
function viewTDEx(which){
  const ids = which === "all" ? TD_TYPES.map(t => t.id) : [TD_TYPES.some(t => t.id === which) ? which : "eq"];
  const ex = ids.map(id => ({ id, ...TD_GEN[id]() }));
  const parts = [];
  const root = h("div", { class: "mod tdpage", html: `<a class="tocback" href="#td">${ICO.back}All tutorial exercises</a>
    ${mhead("Tutorial", which === "all" ? "Full tutorial sheet" : ex[0].title, which === "all" ? "Five exercises, as in Tutorial 1. Calculate, then explain." : "New numbers every time you open it.")}
    ${ex.map((e, i) => `<section class="tdex"><div class="tdstate"><span class="tdn">${which === "all" ? `Exercise ${i + 1}` : "The data"}</span>${which === "all" ? `<h2>${e.title}</h2>` : ""}${e.data}</div>${e.parts.map((p, j) => { parts.push(p); return tdPart(p, i + "-" + j); }).join("")}</section>`).join("")}
    <section class="tdsum"></section>` });
  const P = {}; ex.forEach((e, i) => e.parts.forEach((p, j) => P[i + "-" + j] = p));
  const done = {}; let counted = false;
  function summary(){
    const auto = parts.filter(p => p.kind !== "explain"), right = auto.filter(p => done[keyOf(p)] === true).length, answered = auto.filter(p => done[keyOf(p)] !== undefined).length;
    const ex2 = parts.filter(p => p.kind === "explain"), pts = ex2.reduce((a, p) => a + (p.ticked || 0), 0), totPts = ex2.reduce((a, p) => a + p.points.length, 0);
    root.querySelector(".tdsum").innerHTML = `<div><b>${right}/${auto.length}</b><span>calculations and choices right${answered < auto.length ? ` · ${auto.length - answered} to do` : ""}</span></div><div><b>${pts}/${totPts}</b><span>key points covered in your explanations</span></div><div class="row"><button class="btn primary" type="button" data-tdnew>New numbers</button><a class="btn glassy" href="#td">Other exercises</a></div>`;
    if (answered === auto.length && !counted){ counted = true; const s = MS.get("td", {}); ids.forEach(id => { s[id] = (s[id] || 0) + 1; }); MS.set("td", s); }
  }
  const keyOf = p => Object.keys(P).find(k => P[k] === p);
  function verdict(card, p, good, extra){
    done[card.dataset.key] = good; card.classList.add(good ? "ok" : "bad");
    card.querySelector(".tdout").innerHTML = `<div class="verdict ${good ? "ok" : "bad"}"><div class="vh"><b>${good ? "Correct" : "Not quite"}</b>${extra || ""}</div>${p.calc ? `<div class="calc">${p.calc}</div>` : ""}<p>${p.why}</p></div>`;
    summary();
  }
  root.addEventListener("click", e => {
    const card = e.target.closest(".tdpart");
    if (e.target.closest("[data-tdnew]")){ render(); return; }
    if (!card) return;
    const p = P[card.dataset.key];
    if (e.target.closest("[data-tdcheck]") && done[card.dataset.key] === undefined){
      const inp = card.querySelector("input"), v = parseNum(inp.value); if (Number.isNaN(v)){ inp.focus(); return; }
      inp.disabled = true; card.querySelector("[data-tdcheck]").remove();
      const good = Math.abs(v - p.ans) <= Math.max(p.tol, Math.abs(p.ans) * 0.002), d = p.unit === "" ? 2 : Number.isInteger(Math.round(p.ans * 100) / 100) ? 0 : 2;
      verdict(card, p, good, good ? "" : `<span>The answer is <span class="exp">${p.unit === "€" ? eur(p.ans, d) : fmt(p.ans, d)}</span></span>`);
    }
    const ob = e.target.closest("[data-tdopt]");
    if (ob && done[card.dataset.key] === undefined){ const j = +ob.dataset.tdopt; card.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if (i === p.right) b.classList.add("right"); else if (i === j) b.classList.add("wrong"); }); verdict(card, p, j === p.right); }
    if (e.target.closest("[data-tdmodel]")){
      e.target.closest("[data-tdmodel]").remove(); p.ticked = 0;
      card.querySelector(".tdout").innerHTML = `<div class="tdmodel"><div class="ochk"><h3>Key points <span data-sc>0/${p.points.length}</span></h3><ul>${p.points.map((x, k) => `<li><label><input type="checkbox" data-pt="${k}"><span>${x}</span></label></li>`).join("")}</ul></div><div class="oans"><h3>Model answer</h3>${p.model.map(m => `<p>${m}</p>`).join("")}</div></div>`;
      summary();
    }
  });
  root.addEventListener("change", e => { const cb = e.target.closest("[data-pt]"); if (!cb) return; const card = cb.closest(".tdpart"), p = P[card.dataset.key]; p.ticked = card.querySelectorAll("[data-pt]:checked").length; card.querySelector("[data-sc]").textContent = `${p.ticked}/${p.points.length}`; summary(); });
  root.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".tdpart input")){ e.preventDefault(); e.target.closest(".tdpart").querySelector("[data-tdcheck]")?.click(); } });
  requestAnimationFrame(summary);
  return root;
}

const MODVIEWS = { td: viewTD, tdex: viewTDEx, learn: viewLearn, chapter: viewChapter, drills: viewDrills, quiz: viewQuiz, cards: viewCards, open: viewOpen, openq: viewOpenQ };
const TITLES = { td: "Tutorials", tdex: "Tutorials", learn: "Learn", chapter: "Learn", drills: "Drills", quiz: "Quiz", cards: "Flashcards", open: "Open questions", openq: "Open questions" };
/* header height drives the layout of the case view */
new ResizeObserver(() => document.documentElement.style.setProperty("--hdr", document.querySelector(".hdr").offsetHeight + "px")).observe(document.querySelector(".hdr"));

/* ---------- render ---------- */
const STAGE = { stops: [], view: null };
/* module pages get a small 3D circuit in their header */
const MINI_VIEWS = new Set(["learn", "chapter", "td", "drills", "quiz", "cards", "open"]);
function render(){
  const r = route();
  STAGE.stops.forEach(f => f && f()); STAGE.stops = [];
  STAGE.view = r.view; AURA.set(r.view !== "case"); TINT();
  const NAVOF = { case: "cases", chapter: "learn", openq: "open", tdex: "td" };
  document.querySelectorAll(".nav a").forEach(a => { const on = a.dataset.route === (NAVOF[r.view] || r.view); a.setAttribute("aria-current", on ? "page" : "false"); if (on) a.scrollIntoView({ block: "nearest", inline: "nearest" }); });
  const app = $("#app");
  if (r.view === "case"){
    const seed = r.seed >= 1 ? r.seed : 1;
    app.replaceChildren(viewCase(seed));
    document.title = `Case ${seed <= 10 ? seed : "practice"} · Macroeconomics`;
  } else if (MODVIEWS[r.view]){
    const view = MODVIEWS[r.view](r.id);
    app.replaceChildren(view);
    document.title = (TITLES[r.view] || "Macroeconomics") + " · Macroeconomics";
    window.scrollTo(0, 0);
    if (MINI_VIEWS.has(r.view) && view.classList.contains("mod")){
      const box = h("div", { class: "mini3d", "aria-hidden": "true" }, h("canvas"));
      view.prepend(box);
      STAGE.stops.push(mountFlow(box, { mini: true }));
    }
    STAGE.stops.push(mountReveal(app));
  } else {
    app.replaceChildren(r.view === "cases" ? viewCases() : viewHome());
    const fh = app.querySelector(".fhero"); if (fh) STAGE.stops.push(mountFlow(fh, { compact: r.view === "cases" }));
    app.querySelectorAll(".casecard").forEach(c => {
      c.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; const b = c.getBoundingClientRect(); c.style.setProperty("--ry", (((e.clientX - b.left) / b.width - .5) * 12).toFixed(1) + "deg"); c.style.setProperty("--rx", ((.5 - (e.clientY - b.top) / b.height) * 12).toFixed(1) + "deg"); });
      c.addEventListener("pointerleave", () => { c.style.removeProperty("--rx"); c.style.removeProperty("--ry"); });
    });
    const rs = app.querySelector("#reviews"); if (rs) mountReviewSection(rs);
    document.title = "Macroeconomics · Nexus";
    if (location.hash === "#reviews") setTimeout(() => { const s = $("#reviews"); if (s) s.scrollIntoView(); }, 60); else window.scrollTo(0, 0);
    STAGE.stops.push(mountReveal(app));
  }
}
/* blocks ease in as they enter the view, once */
function mountReveal(app){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return null;
  const els = [...app.querySelectorAll(".note,.widget,.page > .sec,.page > .exam,.page > .credit,.modt,.chtile,.tdcard,.oitem,.steps li,.casecard")];
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ const t = en.target; t.classList.add("rv-on"); io.unobserve(t); if (t.style.transitionDelay) setTimeout(() => { t.style.transitionDelay = ""; }, 900); } }), { rootMargin: "0px 0px -6% 0px" });
  els.forEach(e => {
    if (e.getBoundingClientRect().top < innerHeight * .92) return;
    e.classList.add("rv-in");
    const sib = e.parentElement ? [...e.parentElement.children].filter(x => x.matches(".modt,.chtile,.tdcard,.steps li,.casecard")) : [];
    const k = sib.indexOf(e); if (k > 0) e.style.transitionDelay = (k % 5) * 60 + "ms";
    io.observe(e);
  });
  return () => io.disconnect();
}
/* tiles lean toward the pointer, with a soft light under it */
(function tilt(){
  const SEL = ".modt,.chtile,.tdcard", fine = matchMedia("(hover: hover) and (pointer: fine)"), reduce = matchMedia("(prefers-reduced-motion: reduce)");
  let cur = null;
  const reset = t => { t.style.removeProperty("--rx"); t.style.removeProperty("--ry"); };
  document.addEventListener("pointermove", e => {
    if (!fine.matches || reduce.matches || e.pointerType !== "mouse") return;
    const t = e.target.closest ? e.target.closest(SEL) : null;
    if (cur && cur !== t) reset(cur);
    cur = t; if (!t) return;
    const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    t.style.setProperty("--ry", ((x - .5) * 8).toFixed(2) + "deg"); t.style.setProperty("--rx", ((.5 - y) * 8).toFixed(2) + "deg");
    t.style.setProperty("--gx", (x * 100).toFixed(1) + "%"); t.style.setProperty("--gy", (y * 100).toFixed(1) + "%");
  }, { passive: true });
  document.addEventListener("pointerleave", () => { if (cur){ reset(cur); cur = null; } });
})();
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act='random']"); if (!t) return;
  go("case" + (11 + Math.floor(Math.random() * 1e6)));
});
FS.bind($("#fsBtn"));
if (route().view !== "case") FS.invite($("#fsBtn"));
/* teal ink → amber dusk → deep coral, which stays (dark); mint paper → cream → blush, which stays (light) */
const TINT = scrollTint(dark => STAGE.view === "case" ? null : dark ? ["#0B1719", "#2B1D09", "#3D1218"] : ["#EEF6F4", "#FBEFD6", "#FCDCD5"], () => innerHeight * 0.55, 0.9);
/* page changes cross-fade where the browser can do it (the header stays still) */
const canVT = !!document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches;
window.addEventListener("hashchange", () => { if (canVT && route().view !== "case") document.startViewTransition(render); else render(); });
render();
</script>
