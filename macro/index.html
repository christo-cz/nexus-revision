<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macroeconomics · Nexus</title>
<meta name="description" content="Business Economics revision for EDHEC BBA1: full cases on GDP, the circular flow, consumption, the multiplier and growth. Every answer checked and explained.">
<meta name="theme-color" content="#0B7472">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<script>var t="dark";try{if(localStorage.getItem("nexus-theme")==="light")t="light";}catch(e){}document.documentElement.dataset.theme=t;</script>
<style>
/* Macroeconomics lab (internal name "flow"): a national-accounts workbook. Data on the left, questions on the right, snapping to the centre.
   Colour carries economics: teal = output and income, amber = injections (I, G, X), coral = leakages (S, T, M). */
:root{
  color-scheme:light;
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#EAEEE9; --line:#D8DFD8; --line-2:#C6CFC7; --fg:#152024; --muted:#55646A; --faint:#89969A;
  --flow:#0B7472; --flow-2:#095E5C; --flow-soft:#DCEFEC; --on-flow:#FFFFFF;
  --inj:#B06F07; --inj-soft:#F7EAD2; --leak:#C2493A; --leak-soft:#F8E1DD; --ch4:#3D63D1;
  --ok:#23794E; --ok-soft:#DFF2E6; --bad:#B4372E; --bad-soft:#F9E3E0;
  --shadow:0 1px 2px rgb(21 32 36 / .05),0 6px 20px rgb(21 32 36 / .06);
  --glass:rgb(255 255 255 / .6); --glass-line:rgb(21 32 36 / .1);
  --f-display:"Familjen Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hdr:56px; --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1416; --surface:#151F23; --sunk:#1C282D; --line:#26343A; --line-2:#33444B; --fg:#E7EFED; --muted:#A0B1B3; --faint:#6F8286;
  --flow:#4CC2BC; --flow-2:#6FD6D0; --flow-soft:#12302F; --on-flow:#05201F;
  --inj:#E9AE4C; --inj-soft:#33280F; --leak:#F08473; --leak-soft:#3A1F1B; --ch4:#86A6FF;
  --ok:#6FD39C; --ok-soft:#13301F; --bad:#F08A80; --bad-soft:#3A1D1A;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25); --glass:rgb(255 255 255 / .045); --glass-line:rgb(255 255 255 / .1); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1416; --surface:#151F23; --sunk:#1C282D; --line:#26343A; --line-2:#33444B; --fg:#E7EFED; --muted:#A0B1B3; --faint:#6F8286;
  --flow:#4CC2BC; --flow-2:#6FD6D0; --flow-soft:#12302F; --on-flow:#05201F;
  --inj:#E9AE4C; --inj-soft:#33280F; --leak:#F08473; --leak-soft:#3A1F1B; --ch4:#86A6FF;
  --ok:#6FD39C; --ok-soft:#13301F; --bad:#F08A80; --bad-soft:#3A1D1A;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25); --glass:rgb(255 255 255 / .045); --glass-line:rgb(255 255 255 / .1); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--flow);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 76%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--glass-line)}
.hdr-in{min-height:56px;display:flex;align-items:center;gap:16px;padding-left:var(--gut);padding-right:var(--gut-r)}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.12rem;white-space:nowrap;text-decoration:none}
.crumb .hub{color:var(--muted);font-weight:600;text-decoration:none}
.crumb .hub:hover{color:var(--fg)}
.crumb .sl{color:var(--line-2);font-weight:400}
.crumb b{color:var(--flow)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.92rem;text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--fg);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--sunk)}
.grow{flex:1}
.theme{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:.84rem;font-weight:600;color:var(--muted)}
.theme:hover{color:var(--fg);border-color:var(--line-2)}
.theme svg{width:16px;height:16px}
.crumb .here{text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crumb{min-width:0}
@media (max-width:480px){.nav a[data-route="home"]{display:none}.crumb{font-size:1.02rem}}
.hdr-in{gap:10px}
.hdr .theme{background:transparent}
@media (max-width:980px){#fsBtn .tl{display:none}}
@media (max-width:620px){.nav{margin-left:0}.nav a{padding:7px 9px}.theme .tl{display:none}.crumb .hub,.crumb .sl{display:none}}

/* ---------- shared page frame ---------- */
.page{max-width:1040px;margin:0 auto;padding-block:36px 72px;padding-left:var(--gut);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:48px}
@media (max-width:620px){.page{padding-block:24px 56px;gap:40px}}
.sec{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.35rem}
.sec-h p{color:var(--muted);font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:11px 18px;font-weight:700;font-size:.96rem;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--flow);color:var(--on-flow)}
.btn.primary:hover{background:var(--flow-2)}
.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.quiet:hover{border-color:var(--line-2)}
.btn.small{padding:7px 12px;font-size:.86rem;border-radius:9px}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- overview ---------- */
.hero{display:flex;flex-direction:column;gap:18px}
.eq{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,7vw,4rem);line-height:1.02;letter-spacing:-.03em}
.eq .i{color:var(--inj)} .eq .l{color:var(--leak)} .eq .y{color:var(--flow)}
.hero .lede{max-width:52ch;color:var(--muted);font-size:1.06rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat span{font-size:.84rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat b{font-size:1.3rem}}
.cases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.cases{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
.casecard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.casecard:hover{border-color:var(--flow);box-shadow:var(--shadow)}
.casecard .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.casecard b{font-family:var(--f-display);font-size:1.05rem}
.casecard .country{font-size:.84rem;color:var(--muted)}
.casecard .state{font-size:.78rem;font-weight:600;color:var(--muted)}
.casecard .state.done{color:var(--ok)}
.casecard .state.go{color:var(--flow)}
.mini{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.mini i{display:block;height:100%;background:var(--flow);border-radius:99px}
.exam{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
@media (max-width:760px){.exam{grid-template-columns:1fr;gap:18px}}
.exam h2{font-size:1.25rem}
.exam p{color:var(--muted);font-size:.95rem;margin-top:6px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.split i{display:block}
.legend{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.legend li{display:flex;gap:10px;align-items:baseline}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none;transform:translateY(1px)}
.legend b{font-family:var(--f-mono);font-size:.86rem;min-width:3ch}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{font-size:.86rem;padding:6px 12px;border-radius:99px;border:1px dashed var(--line-2);color:var(--muted)}
.pagetitle{font-size:clamp(1.05rem,2.4vw,1.25rem);font-weight:700;color:var(--flow);margin:-6px 0 -4px}
.credit{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px 20px}
.credit .who{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.credit .who b{font-family:var(--f-display);font-size:1.05rem}
.credit .who span{font-size:.86rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:.88rem;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,transform .15s}
.links a:hover,.links button:hover{border-color:var(--flow);transform:translateY(-1px)}
.links svg{width:17px;height:17px;flex:none}
.foot{border-top:1px solid var(--line);padding-top:18px;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ---------- case workbook ---------- */
.book{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px))}
.sheet{overflow-y:auto;overscroll-behavior:contain;background:color-mix(in srgb,var(--surface) 45%,var(--bg));border-right:1px solid var(--line);padding-block:22px 48px;padding-left:var(--gut);padding-right:22px;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;flex-direction:column;gap:4px}
.sheet-h h1{font-size:1.55rem}
.sheet-h p{font-size:.88rem;color:var(--muted)}
.blk{position:relative;border:1px solid transparent;background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 0 var(--line);transition:border-color .25s,background-color .25s,opacity .25s,transform .2s}
.blk:hover{border-color:var(--line-2)}
.blk .go{position:absolute;top:12px;right:14px;font-size:.74rem;font-weight:700;color:var(--flow);opacity:0;transition:opacity .2s}
.blk:hover .go,.blk:focus-visible .go{opacity:1}
.blk h2{font-size:.98rem;display:flex;gap:10px;align-items:center}
.blk h2 .tg{font-family:var(--f-mono);font-size:.74rem;font-weight:700;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk);color:var(--muted)}
.blk p{font-size:.92rem;line-height:1.55}
.blk.on{border-color:var(--flow);background:var(--flow-soft)}
.blk.on h2 .tg{background:var(--flow);color:var(--on-flow)}
.sheet.focus .blk:not(.on){opacity:.72}
.sheet.focus .blk:not(.on):hover{opacity:1}
.qmap{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.qmap-h{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.qrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.qrow .lt{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--faint);width:16px}
.qsq{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line-2);background:transparent;font-family:var(--f-mono);font-size:.74rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,background-color .2s,border-color .2s}
.qsq:hover{transform:translateY(-2px);border-color:var(--fg);color:var(--fg)}
.qsq.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.qsq.bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.qsq.cur{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--flow)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.k-inj{color:var(--inj);font-weight:700} .k-leak{color:var(--leak);font-weight:700}
.qs{overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scroll-padding-top:120px;scroll-padding-bottom:24px;padding-left:28px;padding-right:var(--gut-r);padding-bottom:42vh;display:flex;flex-direction:column;gap:20px;position:relative}
.bar{position:sticky;top:0;z-index:6;background:var(--bg);padding-block:14px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .chips{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px 5px 6px;font-size:.84rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip .tg{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk)}
.chip[aria-current="true"]{border-color:var(--flow);color:var(--fg)}
.chip[aria-current="true"] .tg{background:var(--flow);color:var(--on-flow)}
.chip .cnt{font-family:var(--f-mono);font-size:.74rem;color:var(--faint)}
.chip.full .cnt{color:var(--ok)}
.score{margin-left:auto;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.score b{font-family:var(--f-display);font-size:1.15rem}
.score span{font-size:.84rem;color:var(--muted)}
.prog{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.prog i{display:block;height:100%;transition:width .3s}
.prog .r{background:var(--ok)} .prog .w{background:var(--bad)}
.card{scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,box-shadow .2s,opacity .2s}
.qs.has-cur .card:not(.cur){opacity:.72}
.card.cur{border-color:var(--flow);box-shadow:0 0 0 3px var(--flow-soft),var(--shadow);opacity:1}
.qhead{display:flex;align-items:center;gap:10px}
.qn{font-family:var(--f-mono);font-size:.8rem;font-weight:700;min-width:30px;height:30px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;background:var(--sunk);color:var(--muted)}
.card.ok .qn{background:var(--ok);color:var(--bg)} .card.bad .qn{background:var(--bad);color:var(--bg)}
.card.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.card.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.card.ok.cur{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 28%,transparent),var(--shadow)}
.card.bad.cur{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 28%,transparent),var(--shadow)}
.card:is(.ok,.bad) .verdict{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.card:is(.ok,.bad) .field{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.restart{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.restart:hover{color:var(--fg);border-color:var(--line-2)}
.restart[data-armed]{color:var(--bad);border-color:var(--bad)}
.restart svg{width:14px;height:14px}
@media (max-width:620px){.restart .tl{display:none}}
.qtag{font-size:.8rem;font-weight:600;color:var(--muted)}
.qtext{font-size:1.06rem;font-weight:500;line-height:1.5;max-width:60ch}
.snip{display:none;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:9px;padding:8px 11px;line-height:1.5}
.ans{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.field{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:11px;background:var(--bg);overflow:hidden;flex:1 1 180px;max-width:320px;transition:border-color .15s}
.field:focus-within{border-color:var(--flow)}
.field input{border:0;background:transparent;padding:11px 13px;font-family:var(--f-mono);font-size:1.02rem;width:100%;min-width:0;outline:none}
.field input:disabled{opacity:.8}
.field .unit{padding:0 13px 0 4px;font-size:.86rem;color:var(--muted);white-space:nowrap}
.card.ok .field{border-color:var(--ok)} .card.bad .field{border-color:var(--bad)}
.check{border:0;border-radius:11px;padding:11px 18px;font-weight:700;background:var(--fg);color:var(--bg)}
.hintbtn{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;padding:8px 6px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.hintbtn:hover{color:var(--fg)}
.hint{font-size:.92rem;color:var(--muted);border-left:3px solid var(--inj);padding:2px 0 2px 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 13px;font-size:.96rem;line-height:1.45;transition:border-color .15s,background-color .15s}
.opt .k{font-family:var(--f-mono);font-weight:700;font-size:.82rem;color:var(--muted);min-width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk);flex:none;margin-top:1px}
.opt:hover:not(:disabled){border-color:var(--flow)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:var(--bg)}

.tagpick{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- overview & case list: the living circular flow ---------- */
#app{position:relative;z-index:1}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(640px circle at var(--ax,70%) var(--ay,40%),color-mix(in srgb,var(--ac,var(--flow)) 20%,transparent),transparent 70%);transition:opacity .4s}
:root[data-theme="light"] .aura{opacity:.8}
.ov{--surface:var(--glass)}
.ov :is(.casecard,.stat,.exam,.credit,.rv-form){backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border-color:var(--glass-line)}
.fhero{position:relative;overflow:hidden;isolation:isolate;min-height:calc(100svh - var(--hdr) - env(safe-area-inset-top,0px));display:flex;align-items:center}
.fhero.compact{min-height:min(62svh,560px)}
.fhero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;touch-action:pan-y}
.fl-labels{position:absolute;inset:0;z-index:1;pointer-events:none}
.fl{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:default;white-space:nowrap;font-size:.8rem;font-weight:600;color:var(--muted);padding:3px 9px;border-radius:99px;transition:color .25s,background-color .25s,transform .25s}
.fl b{font-family:var(--f-mono);font-weight:700}
.fl.node{font-family:var(--f-display);font-size:.98rem;font-weight:700;color:var(--fg);background:var(--glass);border:1px solid var(--glass-line);padding:8px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.fl.inj b{color:var(--inj)} .fl.leak b{color:var(--leak)}
.fl.arc{font-size:.74rem;color:var(--faint)}
.fl.lit{color:var(--fg);transform:translate(-50%,-50%) scale(1.12)}
.fl.inj.lit{background:var(--inj-soft)} .fl.leak.lit{background:var(--leak-soft)} .fl.node.lit{border-color:var(--flow)}
.fh-in{position:relative;z-index:2;width:100%;max-width:1240px;margin:0 auto;padding-block:48px 64px;padding-left:var(--gut);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:20px;pointer-events:none}
.fh-in > *{pointer-events:auto;max-width:560px}
.fh-in::before{content:"";position:absolute;z-index:-1;left:-10%;top:0;bottom:0;width:70%;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 30% 50%,color-mix(in srgb,var(--bg) 82%,transparent),transparent 75%)}
.kicker{font-size:.95rem;font-weight:600;color:var(--flow)}
.ov-title{font-size:clamp(3rem,8.4vw,6.6rem);font-weight:700;letter-spacing:-.05em;line-height:.92;max-width:none!important}

.ov-eq{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3.2vw,2.3rem);letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:0 .28em;align-items:baseline}
.ov-eq [data-hl]{cursor:default;border-radius:8px;padding:0 .08em;transition:background-color .2s,transform .2s;display:inline-block}
.ov-eq [data-hl]:hover{transform:translateY(-3px)}
.ov-eq .y{color:var(--flow)} .ov-eq .i{color:var(--inj)} .ov-eq .l{color:var(--leak)}
.ov-eq .i:hover{background:var(--inj-soft)} .ov-eq .l:hover{background:var(--leak-soft)} .ov-eq .y:hover,.ov-eq .c:hover{background:var(--flow-soft)}

.btn.big{padding:14px 22px;font-size:1.02rem;border-radius:13px}

.mystats{display:flex;flex-wrap:wrap;gap:8px 26px}

.mystats b{font-family:var(--f-display);font-size:1.5rem;line-height:1.1}

.ov .page{max-width:1180px;gap:96px;padding-block:24px 64px}

/* case cards: hover swaps the card for its numbers */
.ov .cases{gap:12px;perspective:1000px}
.casecard{position:relative;overflow:hidden;min-height:142px;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .3s,border-color .3s,opacity .3s,filter .3s,box-shadow .3s}
.casecard .cf{display:flex;flex-direction:column;gap:8px;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}

.mhead{display:flex;flex-direction:column;gap:14px}
.mtitle{font-size:clamp(2.6rem,7vw,5.2rem);font-weight:700;letter-spacing:-.05em;line-height:.95}

kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.6;font-weight:500}

<script>
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const k in attrs){ const v = attrs[k]; if (v == null || v === false) continue; if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); } kids.flat().forEach(c => c != null && e.append(c.nodeType ? c : String(c))); return e; };
const store = { get(){ try { return JSON.parse(localStorage.getItem("flow-v1")) || {}; } catch (e) { return {}; } }, set(v){ try { localStorage.setItem("flow-v1", JSON.stringify(v)); } catch (e) {} } };
const fmt = (n, d = 0) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = (n, d = 0) => (n < 0 ? "−€" : "€") + fmt(Math.abs(n), d);
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function parseNum(s){
  s = String(s || "").trim().replace(/[€$%\s]/g, "").replace(/−/g, "-");
  if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.replace(/,/g, "");
  else if (/^-?\d{1,3}(,\d{3})+$/.test(s)) s = s.replace(/,/g, "");
  else s = s.replace(",", ".");
  return Number(s);
}
const say = t => { const l = $("#live"); l.textContent = ""; setTimeout(() => l.textContent = t, 30); };
/* a small burst of dots in the lab colours, for a right answer */
const BURST = ["--flow", "--inj", "--leak"];
function burst(at, cols = BURST){
  if (!at || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = at.getBoundingClientRect(), cs = getComputedStyle(document.documentElement), C = cols.map(v => cs.getPropertyValue(v).trim());
  const layer = document.createElement("div"); layer.className = "burst"; layer.style.left = (r.left + Math.min(32, r.width / 2)) + "px"; layer.style.top = (r.top + r.height / 2) + "px";
  for (let i = 0; i < 16; i++){ const d = document.createElement("i"), a = Math.random() * Math.PI * 2, dist = 24 + Math.random() * 52; d.style.setProperty("--x", (Math.cos(a) * dist).toFixed(1) + "px"); d.style.setProperty("--y", (Math.sin(a) * dist).toFixed(1) + "px"); d.style.background = C[i % C.length]; d.style.animationDelay = Math.round(Math.random() * 70) + "ms"; layer.append(d); }
  document.body.append(layer); setTimeout(() => layer.remove(), 1000);
}
const bump = el => { if (!el) return; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); };

/* ---------- theme (shared with the Nexus hub) ---------- */
const ICON = {
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};
const THEME_LABEL = { light: "Light", dark: "Dark" };
/* Dark by default; light only if the visitor chose it. */
let theme = "dark"; try { if (localStorage.getItem("nexus-theme") === "light") theme = "light"; } catch (e) {}
function applyTheme(){ document.documentElement.dataset.theme = theme; const b = $("#themeBtn"); b.innerHTML = ICON[theme] + `<span class="tl">${THEME_LABEL[theme]}</span>`; const nx = theme === "dark" ? "light" : "dark"; b.setAttribute("aria-label", `Theme: ${THEME_LABEL[theme]}. Switch to ${nx}`); b.title = "Switch to " + nx; window.dispatchEvent(new Event("nexus-theme")); }
applyTheme();
$("#themeBtn").addEventListener("click", () => { theme = theme === "dark" ? "light" : "dark"; try { localStorage.setItem("nexus-theme", theme); } catch (e) {} applyTheme(); });

/* ---------- case generator: every answer is computed, never typed by hand ---------- */
const COUNTRIES = ["Norland", "Valdoria", "Kestria", "Marenia", "Sorvik", "Elbara", "Quarvia", "Lumeria", "Drevon", "Saltera", "Brevia", "Tarnis"];
const CHAINS = [
  ["A gold mine", "raw gold", "A jewellery maker", "gold bars", "A jeweller's shop", "necklaces"],
  ["A wheat farm", "wheat", "A flour mill", "flour", "A bakery", "bread"],
  ["A forestry firm", "timber", "A sawmill", "planks", "A furniture maker", "tables"],
  ["A cotton farm", "raw cotton", "A spinning mill", "yarn", "A clothing brand", "shirts"],
  ["A vineyard", "grapes", "A winery", "bulk wine", "A wine merchant", "bottled wine"],
  ["A lithium mine", "lithium ore", "A battery plant", "battery cells", "A bike maker", "e-bikes"]
];
const GOODS = [["Laptops", "Coffee"], ["Bicycles", "Haircuts"], ["Smartphones", "Bread"], ["Cars", "Cinema tickets"], ["Washing machines", "Train tickets"]];
const MPCS = [0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9];
const tolAbs = { eur: 0.5, bn: 0.5, ratio: 0.006, pct: 0.06, k: 0.011, per: 1 };

function makeCase(seed){
  const R = mulberry32(seed * 7919 + 17), int = (a, b, step = 1) => a + step * Math.floor(R() * ((b - a) / step + 1)), pick = a => a[Math.floor(R() * a.length)];
  const country = COUNTRIES[(seed - 1) % COUNTRIES.length] || pick(COUNTRIES);
  /* A. production chain, € thousand */
  const ch = pick(CHAINS);
  const s1 = int(60, 160, 5) * 1000, s2 = s1 + int(40, 180, 5) * 1000, s3 = s2 + int(120, 420, 10) * 1000;
  const va = [s1, s2 - s1, s3 - s2];
  const wages = va.map(v => Math.round(v * (0.35 + 0.4 * R()) / 1000) * 1000);
  const W = wages.reduce((a, b) => a + b, 0), P = s3 - W;
  /* B. national economy, € billion */
  const C = int(900, 1500, 10), I = int(220, 420, 5), G = int(260, 480, 5), X = int(260, 520, 5), M = int(250, 540, 5);
  const Y = C + I + G + X - M;
  const T = Math.min(int(240, 480, 5), Y - C - 40), S = Y - C - T;
  /* C. a household, € per month */
  const inc = int(2400, 4200, 50), tax = Math.round(inc * (0.12 + 0.1 * R()) / 10) * 10, Yd = inc - tax;
  const c = pick(MPCS), C0 = int(200, 600, 50), Cons = C0 + c * Yd, Sav = Yd - Cons, s = Math.round((1 - c) * 100) / 100, YR = C0 / s;
  /* D. multiplier */
  const dI = int(10, 45, 5), k = 1 / s, dY = k * dI;
  /* E. growth with two goods, base year n */
  const [g1, g2] = pick(GOODS);
  const p1 = int(400, 1400, 50), p2 = int(2, 30, 1), q1 = int(2, 9, 1), q2 = int(80, 400, 10);
  const pr1 = p1 * (1 + int(1, 9, 1) / 100), pr2 = p2 * (1 + int(0, 12, 1) / 100), qn1 = q1 + int(0, 2, 1), qn2 = Math.round(q2 * (1 + int(-3, 8, 1) / 100));
  const p1b = Math.round(pr1), p2b = Math.round(pr2 * 10) / 10;
  const NomN = p1 * q1 + p2 * q2, NomN1 = p1b * qn1 + p2b * qn2, RealN1 = p1 * qn1 + p2 * qn2;
  const gNom = (NomN1 - NomN) / NomN * 100, gReal = (RealN1 - NomN) / NomN * 100;
  const pop = int(4, 18, 1) / 2, perCap = NomN1 / pop, rec = int(20, 90, 5) / 10, paid = int(10, 70, 5) / 10, GNP = NomN1 + rec - paid;
  const quarters = pick([[0.6, 0.4, 0.2, 0.1], [0.4, -0.2, -0.3, 0.1], [0.5, 0.2, -0.1, 0.3], [-0.2, -0.4, -0.3, -0.1], [0.8, 0.5, 0.3, 0.1]]);
  const qPattern = quarters.filter(x => x < 0).length === 4 ? "recession" : quarters.some((x, i) => x < 0 && quarters[i + 1] < 0) ? "recession" : quarters.every(x => x > 0) && quarters[3] < quarters[0] ? "slowdown" : "none";
  return { seed, country, ch, s1, s2, s3, va, wages, W, P, C, I, G, X, M, Y, T, S, inc, tax, Yd, c, C0, Cons, Sav, s, YR, dI, k, dY, g1, g2, p1, p2, q1, q2, p1b, p2b, qn1, qn2, NomN, NomN1, RealN1, gNom, gReal, pop, perCap, rec, paid, GNP, quarters, qPattern };
}

function questions(K){
  const q = [];
  const num = (id, blk, text, ans, unit, tol, why, calc, snip) => q.push({ id, blk, kind: "num", text, ans, unit, tol, why, calc, snip });
  const mcq = (id, blk, text, opts, right, why, snip) => q.push({ id, blk, kind: "mcq", text, opts, right, why, snip });
  const [f1, , f2, , f3] = K.ch;
  /* A */
  num("a1", "A", `What is the value added of ${f2.toLowerCase()}?`, K.va[1], "€", tolAbs.eur, "Value added = sales − intermediate consumption bought from other firms.", `VA₂ = ${eur(K.s2)} − ${eur(K.s1)} = ${eur(K.va[1])}`, `Sales: ${eur(K.s1)} → ${eur(K.s2)} → ${eur(K.s3)}`);
  num("a2", "A", "What is GDP with the production approach?", K.s3, "€", tolAbs.eur, "GDP is the sum of the values added. It equals the value of the final good.", `${eur(K.va[0])} + ${eur(K.va[1])} + ${eur(K.va[2])} = ${eur(K.s3)}`, `Sales: ${eur(K.s1)} → ${eur(K.s2)} → ${eur(K.s3)}`);
  mcq("a3", "A", `A classmate adds up all the sales: ${eur(K.s1)} + ${eur(K.s2)} + ${eur(K.s3)} = ${eur(K.s1 + K.s2 + K.s3)}. What is wrong?`,
    ["The intermediate goods are counted several times (double counting).", "Imports are missing from the total.", "Wages should be subtracted from the sales.", "Nothing: GDP is the sum of all sales."], 0,
    "The value of the raw material is already included in the price of each later stage. Only value added, or the final good, is counted.");
  num("a4", "A", "Using the income approach, what are total profits in the chain?", K.P, "€", tolAbs.eur, "With the income approach, GDP = wages + profits. So profits = GDP − total wages.", `${eur(K.s3)} − (${K.wages.map(w => eur(w)).join(" + ")}) = ${eur(K.P)}`, `Wages: ${K.wages.map(w => eur(w)).join(", ")}`);
  num("a5", "A", "What share of GDP goes to labour income (wages)?", K.W / K.s3 * 100, "%", tolAbs.pct, "Share = total wages ÷ GDP × 100.", `${eur(K.W)} ÷ ${eur(K.s3)} × 100 = ${fmt(K.W / K.s3 * 100, 2)}%`, `Total wages ${eur(K.W)}`);
  /* B */
  const bn = n => eur(n) + " bn";
  num("b1", "B", "What is GDP with the expenditure approach?", K.Y, "€ bn", tolAbs.bn, "Y = C + I + G + (X − M).", `${K.C} + ${K.I} + ${K.G} + (${K.X} − ${K.M}) = ${fmt(K.Y)}`, `C ${K.C} · I ${K.I} · G ${K.G} · X ${K.X} · M ${K.M}`);
  num("b2", "B", "What is net foreign demand?", K.X - K.M, "€ bn", tolAbs.bn, "Net foreign demand is the trade balance X − M. It can be negative.", `${K.X} − ${K.M} = ${fmt(K.X - K.M)}`, `X ${K.X} · M ${K.M}`);
  num("b3", "B", "What is aggregate domestic demand?", K.C + K.I + K.G, "€ bn", tolAbs.bn, "Domestic demand is C + I + G. It leaves out the external balance.", `${K.C} + ${K.I} + ${K.G} = ${fmt(K.C + K.I + K.G)}`, `C ${K.C} · I ${K.I} · G ${K.G}`);
  num("b4", "B", "What are total leakages W?", K.S + K.T + K.M, "€ bn", tolAbs.bn, "Leakages are the income that leaves the circuit: W = S + T + M.", `${K.S} + ${K.T} + ${K.M} = ${fmt(K.S + K.T + K.M)}`, `S ${K.S} · T ${K.T} · M ${K.M}`);
  num("b5", "B", "What are total injections J?", K.I + K.G + K.X, "€ bn", tolAbs.bn, "Injections are the demand that does not come from households: J = I + G + X.", `${K.I} + ${K.G} + ${K.X} = ${fmt(K.I + K.G + K.X)}`, `I ${K.I} · G ${K.G} · X ${K.X}`);
  mcq("b6", "B", "Compare your two answers: leakages and injections. What do you notice?",
    ["They are equal: the identity Y = C + I + G + X − M implies S + T + M = I + G + X.", "Leakages are larger, so the economy shrinks.", "Injections are larger, so the economy is in equilibrium only if G = T.", "They can never be equal in an open economy."], 0,
    "These are realised national accounts: Y = C + S + T and Y = C + I + G + X − M, so the totals always match. The pairs (S and I, T and G, M and X) usually differ. When planned W and J differ, output adjusts (Tutorial 1).");
  const gov = K.G > K.T ? 0 : K.G < K.T ? 1 : 2;
  mcq("b7", "B", `With G = ${K.G} and T = ${K.T}, what is the government's position?`,
    ["A budget deficit: it spends more than it collects (G > T).", "A budget surplus: it collects more than it spends (G < T).", "A balanced budget (G = T).", "We cannot tell without the interest rate."], gov,
    "Compare public spending G with taxes T. G > T means a deficit, which a Keynesian would accept in a recession.");
  /* C */
  num("c1", "C", "What is the household's disposable income?", K.Yd, "€", tolAbs.eur, "Yd = Y − T.", `${eur(K.inc)} − ${eur(K.tax)} = ${eur(K.Yd)}`, `Income ${eur(K.inc)} · taxes ${eur(K.tax)}`);
  num("c2", "C", "How much does it consume?", K.Cons, "€", tolAbs.eur, `Plug Yd into the Keynesian consumption function C = C₀ + cYd.`, `${K.C0} + ${K.c} × ${fmt(K.Yd)} = ${eur(K.Cons, 2)}`, `C = ${K.C0} + ${K.c}Yd`);
  num("c3", "C", "How much does it save?", K.Sav, "€", tolAbs.eur, "Saving is the residual: S = Yd − C.", `${fmt(K.Yd)} − ${fmt(K.Cons, 2)} = ${eur(K.Sav, 2)}`, `C = ${K.C0} + ${K.c}Yd`);
  num("c4", "C", "What is its average propensity to consume (APC)? Give two decimals.", K.Cons / K.Yd, "", tolAbs.ratio, "APC = C ÷ Yd: the share of disposable income that is consumed.", `${fmt(K.Cons, 2)} ÷ ${fmt(K.Yd)} = ${fmt(K.Cons / K.Yd, 3)}`, `C = ${K.C0} + ${K.c}Yd`);
  num("c5", "C", "What is its marginal propensity to save (MPS)?", K.s, "", tolAbs.ratio, "c + s = 1, so s = 1 − c.", `1 − ${K.c} = ${fmt(K.s, 2)}`, `MPC c = ${K.c}`);
  num("c6", "C", "At what disposable income does saving become positive (break-even income Y_R)?", K.YR, "€", tolAbs.eur, "At Y_R, C = Yd, so S = 0. Y_R = C₀ ÷ (1 − c) = C₀ ÷ s.", `${K.C0} ÷ ${fmt(K.s, 2)} = ${eur(K.YR, 2)}`, `C = ${K.C0} + ${K.c}Yd`);
  mcq("c7", "C", "This household's disposable income rises. According to Keynes, what happens to its APC?",
    ["It falls: consumption rises by less than income.", "It rises: richer households consume a larger share.", "It stays equal to the MPC.", "It does not change, because the interest rate is fixed."], 0,
    "Keynes' psychological law: 0 < ΔC < ΔY, so the APC falls as income grows. Kuznets: true in the short run, but the APC is stable in the long run.");
  /* D */
  num("d1", "D", `Firms invest ${eur(K.dI)} bn more. With the MPC c = ${K.c}, what is the Keynesian multiplier k? Give two decimals.`, K.k, "", tolAbs.k, "k = 1 ÷ (1 − c) = 1 ÷ s.", `1 ÷ (1 − ${K.c}) = 1 ÷ ${fmt(K.s, 2)} = ${fmt(K.k, 2)}`, `ΔI ${eur(K.dI)} bn · c = ${K.c}`);
  num("d2", "D", "By how much does national income rise?", K.dY, "€ bn", 0.3, "ΔY = k × ΔI.", `${fmt(K.k, 2)} × ${K.dI} = ${fmt(K.dY, 2)}`, `ΔI ${eur(K.dI)} bn · c = ${K.c}`);
  mcq("d3", "D", "In which situation would this multiplier effect be the weakest?",
    ["A very open economy where much of the extra income buys imports.", "An economy with high unemployment and idle factories.", "An economy where households save very little of extra income.", "An economy with a low degree of openness."], 0,
    "Imports are a leakage: extra spending flows abroad instead of creating income at home. The multiplier is strongest with a low MPS, a closed economy and idle capacity.");
  /* E */
  num("e1", "E", "What is nominal GDP in year n+1?", K.NomN1, "€ m", tolAbs.bn, "Nominal GDP uses each year's own (current) prices: Σ p(n+1) × q(n+1).", `${fmt(K.p1b)} × ${K.qn1} + ${fmt(K.p2b, 1)} × ${K.qn2} = ${fmt(K.NomN1, 1)}`, `${K.g1}: ${K.qn1} m units at €${fmt(K.p1b)} · ${K.g2}: ${K.qn2} m at €${fmt(K.p2b, 1)}`);
  num("e2", "E", "What is the nominal growth rate between year n and year n+1?", K.gNom, "%", tolAbs.pct, "Growth rate = (GDP n+1 − GDP n) ÷ GDP n × 100.", `(${fmt(K.NomN1, 1)} − ${fmt(K.NomN)}) ÷ ${fmt(K.NomN)} × 100 = ${fmt(K.gNom, 2)}%`, `GDP year n = ${fmt(K.NomN)} (€ m)`);
  num("e3", "E", "What is real GDP in year n+1, at year-n prices?", K.RealN1, "€ m", tolAbs.bn, "Real GDP values year n+1 quantities at the prices of the base year n. This removes the effect of inflation.", `${fmt(K.p1)} × ${K.qn1} + ${K.p2} × ${K.qn2} = ${fmt(K.RealN1)}`, `Base-year prices: €${fmt(K.p1)} and €${K.p2}`);
  num("e4", "E", "What is the real growth rate?", K.gReal, "%", tolAbs.pct, "Use real GDP n+1 against GDP n (in year n, real and nominal GDP are equal).", `(${fmt(K.RealN1)} − ${fmt(K.NomN)}) ÷ ${fmt(K.NomN)} × 100 = ${fmt(K.gReal, 2)}%`, `GDP year n = ${fmt(K.NomN)} (€ m)`);
  mcq("e5", "E", "Why is nominal growth higher than real growth here?",
    ["Prices rose between the two years, and nominal GDP counts those price increases.", "The population grew.", "Real GDP includes imports and nominal GDP does not.", "Real GDP is measured per inhabitant."], 0,
    "Nominal GDP mixes changes in prices and in quantities. Real GDP keeps prices fixed at the base year, so it shows only the change in production.");
  num("e6", "E", `With ${fmt(K.pop, 1)} million inhabitants, what is nominal GDP per capita in year n+1?`, K.perCap, "€", tolAbs.per, "GDP per capita = GDP ÷ population. Both are in millions here, so the result is in euros.", `${fmt(K.NomN1, 1)} ÷ ${fmt(K.pop, 1)} = ${eur(K.perCap, 2)}`, `Population ${fmt(K.pop, 1)} m`);
  num("e7", "E", `Residents earn €${fmt(K.rec, 1)} m from factors abroad and pay €${fmt(K.paid, 1)} m to foreign factors. What is GNP in year n+1?`, K.GNP, "€ m", 0.06, "GNP = GDP + income received from the rest of the world − income paid to the rest of the world. GDP is territorial, GNP follows nationality.", `${fmt(K.NomN1, 1)} + ${fmt(K.rec, 1)} − ${fmt(K.paid, 1)} = ${fmt(K.GNP, 1)}`, `Received ${fmt(K.rec, 1)} · paid ${fmt(K.paid, 1)}`);
  const qs = K.quarters.map(x => (x > 0 ? "+" : "") + fmt(x, 1) + "%").join(", ");
  const qi = { recession: 1, slowdown: 0, none: 2 }[K.qPattern];
  mcq("e8", "E", `Quarterly real GDP growth over the next year: ${qs}. How do economists describe this year?`,
    ["An economic slowdown: growth stays positive but weakens.", "A recession: at least two consecutive quarters of falling GDP.", "Neither: growth does not weaken steadily and never falls two quarters in a row.", "A depression."], qi,
    "Slowdown: growth falls but stays positive. Recession (INSEE): at least two consecutive quarters of falling GDP. Depression: a recession that lasts several years.");
  return q;
}

const BLOCKS = { A: "Production chain", B: "National accounts", C: "A household", D: "The multiplier", E: "Growth" };
const SHORT = { A: "Chain", B: "Accounts", C: "Household", D: "Multiplier", E: "Growth" };
const HINTS = {
  a1: "Value added = what the firm sells − what it buys from other firms.",
  a2: "Add up the three values added. Or think: what is the value of the final good?",
  a4: "Income approach: GDP = wages + profits.",
  a5: "Share = total wages ÷ GDP × 100.",
  b1: "Y = C + I + G + (X − M).",
  b2: "Net foreign demand is the trade balance.",
  b3: "Domestic demand leaves out trade with the rest of the world.",
  b4: "Leakages are the income that leaves the circuit.",
  b5: "Injections are the demand that does not come from households.",
  c1: "Disposable income = income − taxes.",
  c2: "Plug Yd into the consumption function.",
  c3: "Saving is what is left: Yd − C.",
  c4: "APC = C ÷ Yd.",

  d2: "ΔY = k × ΔI.",
  e1: "Use year n+1 prices and year n+1 quantities.",
  e2: "(new − old) ÷ old × 100.",
  e3: "Use year n prices with year n+1 quantities.",
  e4: "Compare real GDP n+1 with GDP n.",
  e6: "GDP ÷ population.",
  e7: "GDP + income received from abroad − income paid abroad."
};

/* ---------- case sheet (left) ---------- */
function sheetHtml(K){
  const [f1, g1, f2, g2, f3, g3] = K.ch;
  const row = (a, b, cls = "") => `<tr><td>${a}</td><td class="n ${cls}">${b}</td></tr>`;
  const tg = l => `<span class="tg">${l}</span>`;
  return `
  <div class="sheet-h"><span class="eyebrow">${K.seed <= 10 ? `Case ${K.seed} of 10` : "Practice case"}</span><h1>The economy of ${K.country}</h1>
    <p>Round to two decimals. Commas and dots both work.</p></div>

const TOTAL = 30;
function progress(seed){ const st = store.get(); const p = (st.cases || {})[seed]; return p && p.ans ? p : { ans: {} }; }
function saveProgress(seed, p){ const st = store.get(); st.cases = st.cases || {}; st.cases[seed] = p; st.last = seed; store.set(st); }
function caseStats(seed){ const p = progress(seed), a = Object.values(p.ans || {}); return { done: a.length, right: a.filter(x => x.ok).length, pct: p.pct }; }
function route(){
  const hs = location.hash.slice(1);
  if (/^case\d+$/.test(hs)) return { view: "case", seed: +hs.slice(4) };
  if (hs === "cases") return { view: "cases" };
  if (hs === "learn") return { view: "learn" };
  if (hs === "td") return { view: "td" };
  if (/^td-\w+$/.test(hs)) return { view: "tdex", id: hs.slice(3) };
  if (/^learn-\w+$/.test(hs)) return { view: "chapter", id: hs.slice(6) };
  if (hs === "drills") return { view: "drills" };
  if (hs === "quiz" || /^quiz-\w+$/.test(hs)) return { view: "quiz", id: hs.slice(5) };

  if (/^open-o\d+$/.test(hs)) return { view: "openq", id: hs.slice(5) };
  return { view: "home" };
}

function resumeTarget(){
  const st = store.get(); const last = st.last;
  if (last && caseStats(last).done > 0 && caseStats(last).done < TOTAL) return last;
  for (let i = 1; i <= 10; i++) if (caseStats(i).done < TOTAL) return i;

}
function overall(){
  let cases = 0, ans = 0, right = 0;
  for (let i = 1; i <= 10; i++){ const s = caseStats(i); if (s.done === TOTAL) cases++; ans += s.done; right += s.right; }
  return { cases, ans, right, acc: ans ? Math.round(right / ans * 100) : null };
}

/* ---------- case view ---------- */
function viewCase(seed){
  const K = makeCase(seed), Q = questions(K), P = progress(seed);
  const root = h("div", { class: "book" });
  const sheet = h("aside", { class: "sheet closed", "aria-label": "Case data", html: sheetHtml(K) });
  const qmap = h("nav", { class: "qmap", "aria-label": "Jump to a question" });
  qmap.innerHTML = `<div class="qmap-h"><span>Questions</span><span id="qmapInfo"></span></div>` + Object.keys(BLOCKS).map(b => `<div class="qrow"><span class="lt">${b}</span>${Q.map((q, i) => q.blk === b ? `<button class="qsq" type="button" data-act="goq" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>` : "").join("")}</div>`).join("");
  sheet.querySelector(".sheet-h").after(qmap);
  const qs = h("section", { class: "qs", "aria-label": "Questions" });
  const blocks = Object.keys(BLOCKS);
  const bar = h("div", { class: "bar" });
  bar.innerHTML = `<div class="bar-row"><nav class="chips" aria-label="Jump to a part">${blocks.map(b => `<button class="chip" type="button" data-act="jump" data-blk="${b}" title="${BLOCKS[b]}"><span class="tg">${b}</span>${SHORT[b]}<span class="cnt" data-cnt="${b}"></span></button>`).join("")}</nav>
    <div class="score"><b class="num" id="sc"></b><span id="sc2"></span></div><button class="restart" type="button" data-act="reset" data-label="Restart" title="Erase your answers and start this case again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="tl">Restart</span></button></div><div class="prog" aria-hidden="true"><i class="r" id="pr"></i><i class="w" id="pw"></i></div>`;
  qs.append(bar);
  const cards = Q.map((q, i) => cardFor(q, i, Q, P, seed));
  const end = h("section", { class: "end", "aria-label": "End of the case" });
  qs.append(...cards, end);
  root.append(sheet, qs);

  function refresh(){
    const done = Q.filter(q => P.ans[q.id]).length, right = Q.filter(q => P.ans[q.id] && P.ans[q.id].ok).length, wrong = done - right;
    $("#sc", root).textContent = `${done}/${TOTAL}`;
    qmap.querySelectorAll(".qsq").forEach(s => { const a = P.ans[Q[+s.dataset.i].id]; s.classList.toggle("ok", !!a && a.ok); s.classList.toggle("bad", !!a && !a.ok); });
    $("#qmapInfo", root).textContent = `${right} right, ${wrong} wrong`;
    $("#sc2", root).textContent = done ? `${right} right` : "answered";
    $("#pr", root).style.width = (right / TOTAL * 100) + "%"; $("#pw", root).style.width = (wrong / TOTAL * 100) + "%";
    blocks.forEach(b => { const qb = Q.filter(q => q.blk === b), d = qb.filter(q => P.ans[q.id]).length; const el = root.querySelector(`[data-cnt="${b}"]`); el.textContent = `${d}/${qb.length}`; el.parentElement.classList.toggle("full", d === qb.length); });
    if (done === TOTAL) P.pct = Math.round(right / TOTAL * 100); else delete P.pct;
    saveProgress(seed, P);
    end.innerHTML = done < TOTAL
      ? `<h2>${TOTAL - done} question${TOTAL - done > 1 ? "s" : ""} to go</h2><p class="muted">Your score so far: ${right} right out of ${done}.</p><div class="row"><button class="btn primary" type="button" data-act="first-open">Go to the next unanswered question</button></div>`
      : `<span class="eyebrow">Case finished</span><h2>${P.pct}% · ${right} of ${TOTAL} right</h2>
         <div class="blocks-sum">${blocks.map(b => { const qb = Q.filter(q => q.blk === b), r = qb.filter(q => P.ans[q.id] && P.ans[q.id].ok).length; return `<div class="bs"><b>${r}/${qb.length}</b><span>${b} · ${BLOCKS[b]}</span></div>`; }).join("")}</div>
         <div class="row">${wrong ? `<button class="btn quiet" type="button" data-act="first-wrong">Review my ${wrong} mistake${wrong > 1 ? "s" : ""}</button>` : ""}<a class="btn primary" href="#case${seed < 10 ? seed + 1 : 1}">Next case →</a><button class="btn quiet" type="button" data-act="reset" data-label="Restart this case">Restart this case</button></div><div data-rvslot></div>`;
    const slot = end.querySelector("[data-rvslot]"); if (slot) mountReviewSlot(slot);
  }
  root.addEventListener("answered", refresh);
  sheet.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("blk")){ e.preventDefault(); e.target.click(); } });
  root.addEventListener("click", e => {
    const t = e.target.closest("[data-act]"); if (!t) return;
    const a = t.dataset.act;
    if (a === "sheet"){ const open = sheet.classList.toggle("closed"); t.textContent = open ? "Show the case data" : "Hide the case data"; t.setAttribute("aria-expanded", String(!open)); }
    if (a === "next"){ const i = +t.dataset.i; focusCard(cards.slice(i + 1).find(c => !P.ans[c.dataset.id]) || cards[i + 1] || end); }
    if (a === "jump"){ focusCard(cards.find(c => c.dataset.blk === t.dataset.blk && !P.ans[c.dataset.id]) || cards.find(c => c.dataset.blk === t.dataset.blk)); }
    if (a === "first-open"){ focusCard(cards.find(c => !P.ans[c.dataset.id])); }
    if (a === "first-wrong"){ focusCard(cards.find(c => P.ans[c.dataset.id] && !P.ans[c.dataset.id].ok)); }
    if (a === "goq"){ focusCard(cards[+t.dataset.i]); }
    if (a === "reset"){ const lab = t.querySelector(".tl") || t; if (t.dataset.armed){ saveProgress(seed, { ans: {} }); render(); } else { t.dataset.armed = "1"; lab.textContent = "Tap again to erase"; setTimeout(() => { if (t.isConnected){ delete t.dataset.armed; lab.textContent = t.dataset.label || "Restart"; } }, 4000); } }
  });
  /* the question in the middle of the view drives the highlights */
  requestAnimationFrame(() => {
    const desk = matchMedia("(min-width: 981px)").matches;
    const setCur = card => {
      cards.forEach(c => c.classList.toggle("cur", c === card)); qs.classList.add("has-cur");
      qmap.querySelectorAll(".qsq").forEach(s => s.classList.toggle("cur", cards[+s.dataset.i] === card));
      const blk = card.dataset.blk;
      sheet.classList.add("focus");
      sheet.querySelectorAll(".blk").forEach(b => b.classList.toggle("on", b.dataset.blk === blk));
      bar.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-current", String(c.dataset.blk === blk)));
      if (desk){ const b = sheet.querySelector(`.blk[data-blk="${blk}"]`); if (b){ const top = b.getBoundingClientRect().top - sheet.getBoundingClientRect().top + sheet.scrollTop - 16; if (Math.abs(sheet.scrollTop - top) > 40) sheet.scrollTo({ top, behavior: "smooth" }); } }
      else { const chip = bar.querySelector(`.chip[data-blk="${blk}"]`); if (chip) chip.scrollIntoView({ block: "nearest", inline: "nearest" }); }
    };
    /* the current question is the card closest to the centre of the scrolling area (the snap point) */
    let lock = 0, raf = 0, last = null;
    const pick = () => {
      raf = 0; if (performance.now() < lock) return;
      let mid;
      if (desk){ const r = qs.getBoundingClientRect(); mid = r.top + 120 + (qs.clientHeight - 144) / 2; }
      else { const b = bar.getBoundingClientRect(); mid = b.bottom + (innerHeight - b.bottom) / 2; }
      let best = null, bd = 1e9;
      for (const c of cards){ const r = c.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid); if (d < bd){ bd = d; best = c; } }
      if (best && best !== last){ last = best; setCur(best); }
    };
    (desk ? qs : window).addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(pick); }, { passive: true });
    root.addEventListener("focuscard", e => { last = e.detail; setCur(e.detail); lock = performance.now() + 900; setTimeout(() => { lock = 0; pick(); }, 950); });
    const first = cards.find(c => !P.ans[c.dataset.id]);
    if (first && first !== cards[0]) focusCard(first, true); else setCur(cards[0]);
  });
  refresh();
  return root;
}
function focusCard(card, instant){
  if (!card) return;
  if (card.classList.contains("card")) card.dispatchEvent(new CustomEvent("focuscard", { bubbles: true, detail: card }));
  card.scrollIntoView({ block: "center", behavior: instant || matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  const target = card.querySelector("input:not([disabled]), .opt:not([disabled])") || card.querySelector("[data-act='next']");
  if (target) setTimeout(() => target.focus({ preventScroll: true }), instant ? 0 : 380);
}
function fmtAns(q){ const d = q.unit === "%" || q.unit === "" ? 2 : Number.isInteger(Math.round(q.ans * 100) / 100) ? 0 : 2; return (q.unit === "€" ? eur(q.ans, d) : fmt(q.ans, d)) + (q.unit && q.unit !== "€" ? " " + q.unit : ""); }
function cardFor(q, i, Q, P, seed){
  const prev = P.ans[q.id];
  const card = h("article", { class: "card" + (prev ? (prev.ok ? " ok" : " bad") : ""), "data-id": q.id, "data-blk": q.blk, "aria-labelledby": "qt-" + q.id });
  card.append(
    h("div", { class: "qhead" }, h("span", { class: "qn" }, String(i + 1)), h("span", { class: "qtag" }, `${q.blk} · ${BLOCKS[q.blk]}`)),
    h("p", { class: "qtext", id: "qt-" + q.id }, q.text)
  );
  if (q.snip) card.append(h("p", { class: "snip" }, q.snip));
  const out = h("div", { class: "stack" });
  out.style.cssText = "display:flex;flex-direction:column;gap:12px";
  const isLast = i === Q.length - 1;
  const show = (ok) => {
    out.replaceChildren();
    const v = h("div", { class: "verdict " + (ok ? "ok" : "bad"), role: "status" });
    const head = h("div", { class: "vh" }, h("b", {}, ok ? "Correct" : "Not quite"));
    if (q.kind === "num" && !ok) head.append(h("span", {}, "The answer is ", h("span", { class: "exp" }, fmtAns(q))));
    v.append(head);
    if (q.kind === "num") v.append(h("div", { class: "calc" }, q.calc));
    v.append(h("p", {}, q.why));
    const nb = h("button", { class: "btn quiet small next", type: "button", "data-act": "next", "data-i": String(i) }, isLast ? "See my result" : "Next question", h("kbd", {}, "Enter"));
    out.append(v, nb);
    card.classList.remove("ok", "bad"); card.classList.add(ok ? "ok" : "bad");

/* ---------- full screen that survives page changes ----------
   Browsers always leave full screen when the page changes. So while in full screen, links to another Nexus page

const FS = (() => {
  const framed = (() => { try { return window.top !== window && window.top.location.origin === location.origin; } catch (e) { return false; } })();

  const exit = () => { try { (d.exitFullscreen || d.webkitExitFullscreen).call(d); } catch (e) {} };

  const EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  function openShell(url){

      st.textContent = "html.shelled,html.shelled body{overflow:hidden!important}html.shelled body>:not(#nxShell){display:none!important}#nxShell{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483647;background:transparent}";
      document.head.append(st);
      f = document.createElement("iframe"); f.id = "nxShell"; f.title = "Nexus"; f.allow = "fullscreen";
      f.addEventListener("load", () => { try { document.title = f.contentDocument.title; } catch (e) {} });

    }

  }
  if (!framed){
    document.addEventListener("click", e => {
      if (!isOn() || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

    const paint = () => { const on = isOn(); btn.innerHTML = (on ? EXIT : ENTER) + `<span class="tl">${on ? "Exit full screen" : "Full screen"}</span>`; btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen (F)"); btn.title = on ? "Exit full screen (F or Esc)" : "Full screen (F)"; btn.setAttribute("aria-pressed", String(on)); };
    btn.addEventListener("click", toggle);
    d.addEventListener("fullscreenchange", paint); d.addEventListener("webkitfullscreenchange", paint);
    addEventListener("pagehide", () => { d.removeEventListener("fullscreenchange", paint); d.removeEventListener("webkitfullscreenchange", paint); });
    document.addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey && !(e.target.closest && e.target.closest("input,textarea,select,[contenteditable]"))){ e.preventDefault(); toggle(); } });

  }

    const done = () => { try { sessionStorage.setItem("nexus-fs-inv", "1"); } catch (e) {} };
    setTimeout(() => {
      if (isOn() || !btn.isConnected) return;
      const el = document.createElement("div"); el.className = "fsinv"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Full screen");
      el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><p><b>Revise better in full screen.</b> <span>No tabs, no distractions.</span></p><button class="go" type="button">Full screen<kbd>F</kbd></button><button class="x" type="button" aria-label="Close">×</button>`;

/* ---------- background colour that follows the scroll ----------
   Two or three colours, blended in OKLab so the fade looks even. The last colour is reached at `end` of the scroll
   and then stays. */
function scrollTint(getStops, getStart, end = 0.85, onTint = null){
  const root = document.documentElement;
  const dark = () => { const t = root.dataset.theme; return t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches); };
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const gam = c => { c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.round(Math.min(1, Math.max(0, c)) * 255); };
  const toLab = h => { const [r, g, b] = [1, 3, 5].map(i => lin(parseInt(h.slice(i, i + 2), 16)));
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s]; };
  const toRGB = ([L, A, B]) => { const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3, m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3, s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
    return [gam(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s), gam(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s), gam(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)]; };
  let raf = 0;
  function upd(){
    raf = 0;
    const stops = getStops(dark());
    if (!stops){ root.style.removeProperty("--bg"); root.style.removeProperty("--scrim"); if (onTint) onTint([0, 0, 0]); return; }
    const start = getStart(), span = Math.max(1, (root.scrollHeight - innerHeight) * end - start);
    const p = Math.min(1, Math.max(0, (scrollY - start) / span)), e = p * p * (3 - 2 * p);
    const x = e * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
    const a = toLab(stops[i]), b = toLab(stops[i + 1]), c = toRGB(a.map((v, k) => v + (b[k] - v) * f));
    root.style.setProperty("--bg", `rgb(${c.join(" ")})`); root.style.setProperty("--scrim", c.join(" "));
    if (onTint) onTint(c);
  }
  const q = () => { if (!raf) raf = requestAnimationFrame(upd); };
  addEventListener("scroll", q, { passive: true }); addEventListener("resize", q); addEventListener("nexus-theme", q);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", q);
  q(); return q;
}

/* ---------- the circular flow, live (WebGL points, no library) ----------
   Households ⇄ firms on an ellipse. Upper arc: spending (C) to firms. Lower arc: income (Y) back to households.
   Amber streams join the spending arc (I, G, X: injections). Coral streams leave the income arc (S, T, M: leakages).
   The pointer pushes particles aside; hovering a letter of the formula or a label lights up that stream. */

    void main(){ vec2 c = aP / uR * 2.0 - 1.0; gl_Position = vec4(c.x, -c.y, 0.0, 1.0); gl_PointSize = aS * uD; vC = aC; }`;

/* ---------- colour aura that follows the pointer (teal → amber → coral across the screen) ---------- */
const AURA = (() => {
  const el = document.createElement("div"); el.className = "aura"; el.setAttribute("aria-hidden", "true"); document.body.prepend(el);
  const st = { x: innerWidth * .7, y: innerHeight * .4, tx: innerWidth * .7, ty: innerHeight * .4 }; let raf = 0, on = false;
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const hx = h => [1, 3, 5].map(i => parseInt(h.trim().slice(i, i + 2), 16));
  function tick(){
    raf = 0; st.x += (st.tx - st.x) * .09; st.y += (st.ty - st.y) * .09;
    const cs = getComputedStyle(document.documentElement), f = Math.min(1, Math.max(0, st.x / innerWidth));
    const c = f < .5 ? mix(hx(cs.getPropertyValue("--flow")), hx(cs.getPropertyValue("--inj")), f * 2) : mix(hx(cs.getPropertyValue("--inj")), hx(cs.getPropertyValue("--leak")), f * 2 - 1);
    el.style.setProperty("--ax", st.x + "px"); el.style.setProperty("--ay", st.y + "px"); el.style.setProperty("--ac", `rgb(${c.join(" ")})`);
    if (on && (Math.abs(st.tx - st.x) > .5 || Math.abs(st.ty - st.y) > .5)) raf = requestAnimationFrame(tick);
  }
  addEventListener("pointermove", e => { if (!on || e.pointerType !== "mouse") return; st.tx = e.clientX; st.ty = e.clientY; if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });

  return { set(v){ on = v; el.hidden = !v; if (v && !raf) raf = requestAnimationFrame(tick); } };
})();

      formula: "GDP = wages + profits\nprofits = GDP − wages",
      example: "In the bread chain, wages total €120,000, so profits are €200,000 − €120,000 = €80,000. Labour gets 60% of GDP, capital 40%." },
    { id: "a-exp", title: "3. The expenditure approach",
      line: "GDP is the sum of final spending.",
      formula: "Y = C + I + G + (X − M)",
      example: "If households buy all the bread and there is no investment, State or trade: Y = C = €200,000.",
      trap: "Only final purchases count. The mill buying wheat is intermediate consumption, not investment." }
  ]},
  { title: "Aggregate demand", cards: [
    { id: "a-ad", title: "The four uses of output",
      line: "Demand comes from households (C), firms (I), the State (G) and abroad (X).",
      points: ["C: household consumption, which brings well-being.", "I: what firms buy to increase, improve or replace equipment. Investment is a flow over a period, added to the capital stock.", "G: State purchases of goods and services, and its staff.", "X: exports, demanded by the rest of the world."],
      trap: "The slides say exports make goods \"leak\" out of the country. In the circuit, though, X is an injection: foreign spending that brings income in." }
  ]},
  { title: "The economic circuit", widget: "circuit", cards: [
    { id: "a-simple", title: "The simplified circular flow",
      line: "Two agents only: households and firms. Nothing leaks out, nothing comes in.",
      points: ["Households spend all their income: no saving.", "Firms pay out all their revenue as income: no investment.", "Result: the economy is stationary, the same from one year to the next."] },
    { id: "a-ident", title: "The fundamental accounting identity",
      line: "Resources equal uses: what is produced or imported is consumed, invested, bought by the State or exported.",
      formula: "Y + M = C + I + G + X\nY = (C + I + G) + (X − M)",
      points: ["C + I + G: aggregate domestic demand.", "X − M: net foreign demand, the trade balance. Positive is a surplus, negative a deficit."] },
    { id: "a-open", title: "Leakages and injections",
      line: "Income that leaves the circuit is a leakage; demand that does not come from households is an injection.",
      formula: "Leakages  W = S + T + M\nInjections J = I + G + X",
      points: ["S: income households do not consume, deposited with banks.", "T: taxes paid by households and firms, net of transfers (transfers are negative taxes).", "I: investment, financed through banks. G: public spending. X: exports."] },
    { id: "a-wj", title: "W = J in the accounts, not pair by pair",
      line: "In the realised national accounts the totals always match, but each pair usually differs.",
      formula: "Y = C + S + T  and  Y = C + I + G + X − M\n⇒ S + T + M = I + G + X",
      points: ["S ≠ I: households and firms decide separately.", "G vs T: a deficit (G > T), for example in a recession, or a surplus (G < T).", "X ≠ M: trade is rarely balanced."],
      example: "S = 300, T = 400, M = 500 gives W = 1,200. I = 350, G = 450, X = 400 gives J = 1,200. Equal totals, unequal pairs.",
      trap: "W = J does not mean S = I." },
    { id: "a-wjeq", title: "When planned leakages and injections differ",
      line: "In the tutorial, W and J are what agents plan. If W > J output falls; if W < J output rises. Equilibrium requires W = J.",
      points: ["W > J: part of income leaks out without being offset. Demand falls, unsold inventories build up, firms cut output: slowdown or recession.", "W < J: more income enters the circuit than leaves it. Demand rises, inventories fall, firms raise output: expansion.", "To fix W > J: raise injections (more G or I, more exports X) or cut leakages (lower taxes T, fewer imports M)."],
      example: "S = 50, T = 70, M = 30 gives W = 150. I = 80, G = 40, X = 20 gives J = 140. W > J: the economy contracts. A policy answer: raise G or cut T.",
      exam: "Tutorial 1, exercise 2: compute W and J, say whether the economy is in equilibrium, what happens if W > J or W < J, and propose a policy." },
    { id: "a-eq", title: "Macroeconomic equilibrium: AD = AS",
      line: "Output is in equilibrium when aggregate demand equals what firms produce.",
      formula: "AD = a + b·Y   and   AS = Y\nY = a + bY  ⇒  Y* = a / (1 − b)",
      points: ["At Y*, firms sell exactly what they produce, inventories are stable, nobody wants to change output.", "Below Y*, demand exceeds output: inventories fall, firms produce more, jobs and income rise until Y*.", "Above Y*, output exceeds demand: unsold goods pile up, firms cut production until Y*.", "Households drive demand through consumption; firms adjust supply to it."],
      example: "AD = 200 + 0.8Y: Y* = 200 / 0.2 = 1,000. At Y = 900, AD = 200 + 720 = 920 > 900: excess demand of 20, so output rises towards 1,000.",
      exam: "Tutorial 1, exercise 1: compute Y*, interpret it, compare AD and AS at another output level, and describe the adjustment." }
  ]}
  ]
},
{ id: "determinants", n: 3, title: "Consumption, saving and investment", short: "Consumption & investment", c: "var(--inj)",
  intro: "What households do with their income, Keynes against Fisher, and why investment moves the whole economy through the multiplier.",
  sections: [
  { title: "Two views of saving", cards: [
    { id: "d-two", title: "Current income or a lifetime plan?",
      line: "Keynes looks at current income. Fisher looks at the long run, with wealth and the interest rate.",
      points: ["Keynes: short run, consumption depends on today's income, saving is what is left.", "Neoclassical (Fisher): households choose between consuming now and later; the interest rate matters."] }
  ]},
  { title: "Keynes: the current income hypothesis", widget: "consumption", cards: [
    { id: "d-yd", title: "Disposable income",
      line: "What households can spend or save after taxes.",
      formula: "Yd = Y − T\nYd = C + S" },
    { id: "d-cf", title: "The consumption function",
      line: "Consumption = a fixed part + a share of disposable income.",
      formula: "C = C₀ + c·Yd",
      points: ["C₀: autonomous consumption, spent even with no income (from past savings or borrowing).", "c: the marginal propensity to consume."],
      example: "C = 300 + 0.8·Yd. With Yd = 2,000: C = 300 + 1,600 = 1,900 and S = 100." },
    { id: "d-mpc", title: "Marginal propensity to consume (MPC)",
      line: "The share of each extra euro of income that is consumed.",
      formula: "c = ΔC / ΔYd     0 < c < 1",
      example: "Income rises by €100 and consumption by €80: c = 0.8. With c = 0.75, the household spends 75 cents of each extra euro and saves 25 (MPS = 0.25).",
      points: ["The higher the MPC, the stronger the multiplier and the bigger the role of consumption in demand."] },
    { id: "d-apc", title: "Average propensity to consume (APC)",
      line: "The share of total income that is consumed.",
      formula: "APC = C / Yd",
      example: "C = 1,900 and Yd = 2,000: APC = 0.95, while the MPC is 0.8.",
      trap: "MPC and APC are different. With C₀ > 0 the APC is above the MPC and falls as income rises." },
    { id: "d-sf", title: "The saving function",
      line: "Saving is what is left once consumption is decided.",
      formula: "S = Yd − C = −C₀ + s·Yd\ns = ΔS / ΔYd = 1 − c      APS = S / Yd\nc + s = 1      APC + APS = 1",
      points: ["Saving is residual: households do not really choose to save.", "Keynes leaves the interest rate out: in the short run income acts at once, the rate only slowly."] },
    { id: "d-be", title: "Break-even income",
      line: "The income at which saving is zero: below it, households dissave.",
      formula: "C = Yd  ⇒  Y_R = C₀ / (1 − c) = C₀ / s",
      example: "C = 0.75Yd + 50: S = 0.25Yd − 50 = 0 gives Yd = €200.",
      points: ["Below Y_R: saving is negative. The household dissaves, borrowing or using past savings.", "At Y_R: saving is zero, all income is consumed.", "Above Y_R: the household starts to save.", "Y_R depends on autonomous consumption, the spending needed for essentials. Low-income households can hardly save: saving is strongly constrained by income."],
      exam: "Tutorial 1 asks for the three cases (below, at, above) and their interpretation, not only the number." },
    { id: "d-law", title: "Keynes' psychological law and its limits",
      line: "When income rises, consumption rises too, but by less: the APC falls.",
      formula: "0 < ΔC < ΔYd",
      points: ["Richer households, and richer countries, should have a lower APC and a higher APS.", "As living standards rise, a country's APC should slowly fall.", "Kuznets (Nobel 1971), on US data: true in the short run, but in the long run the APC and APS are stable.", "So Keynes' view is static: it ignores the choice between consuming now and later."],
      exam: "A classic open question: state the psychological law, its implications, then Kuznets' test." }
  ]},
  { title: "Fisher: the intertemporal choice", cards: [
    { id: "d-fisher", title: "Saving as postponed consumption",
      line: "Saving is not a leftover: it finances future consumption.",
      points: ["Irving Fisher (1930).", "Saved money can be hoarded as cash (no interest) or lent to an agent who needs funds.", "Lending turns saving into a financial investment and gives the saver a financing capacity.", "A loan transfers purchasing power from the present to the future."] },
    { id: "d-fv", title: "What saved money is worth next year",
      line: "Savings grow with interest: saving transfers purchasing power through time.",
      formula: "Future value = S × (1 + r)",
      example: "Save €400 at 10%: 400 × 1.10 = €440 next year. Giving up €400 of consumption today buys €440 of consumption tomorrow.",
      exam: "Tutorial 1, exercise 4 starts with this calculation, then asks how the interest rate shapes the choice." },
    { id: "d-rate", title: "The interest rate is the reward for waiting",
      line: "The higher the interest rate, the stronger the incentive to save.",
      points: ["The rate compares the utility of consuming today with consuming later.", "It is both the return on saving and the opportunity cost of consuming now.", "A rise in the rate (say from 10% to 20%) shifts consumption from the present to the future.", "It measures how much households prefer the present."] },
    { id: "d-three", title: "Three factors decide consumption and saving",
      line: "Preferences, wealth and the interest rate.",
      points: ["Intertemporal preferences: now or later.", "Wealth: present and expected future income.", "Financial conditions, above all the interest rate, the price of moving purchasing power through time."],
      exam: "Keynes: current income decides. Neoclassicals: wealth, future income and the interest rate decide together." }
  ]},
  { title: "Investment", widget: "investment", cards: [
    { id: "d-inv", title: "What investment is",
      line: "A firm turns money into productive capital to earn more, or spend less, in the future.",
      points: ["Physical: machines, buildings, factories, equipment.", "Intangible: R&D, patents, licences, staff training, software, advertising and marketing.", "Buying shares or bonds is a financial investment, not a productive one."],
      trap: "A household buying shares is not \"investment I\" in the national accounts." },
    { id: "d-roles", title: "The two roles of investment",
      line: "Today it is demand; tomorrow it is capacity.",
      points: ["Part of aggregate demand: spending that supports activity right away.", "A factor of production: more capacity and productivity, so long-run growth."] },
    { id: "d-irate", title: "The interest rate, main determinant",
      line: "Both schools agree: a lower interest rate encourages investment.",
      formula: "I = f(i), decreasing",
      points: ["Projects are financed by own funds or by borrowing; either way the rate is the cost of investing.", "Lower rates make more projects profitable; higher rates make firms postpone or cancel."] },
    { id: "d-other", title: "Other determinants",
      line: "Firms invest when they expect demand and have reasons to add capacity.",
      points: ["Expectations: stronger demand, sales and profits ahead. Uncertainty holds investment back.", "Business confidence.", "Technological progress: higher productivity, lower costs, more competitiveness.", "Capacity utilisation: near full capacity, firms add equipment; with idle capacity they wait.", "Public policies: tax incentives, subsidies, infrastructure, cheap financing. Heavy taxation or regulatory doubt discourages."] }
  ]},
  { title: "The Keynesian multiplier", widget: "multiplier", cards: [
    { id: "d-mult", title: "How one euro of investment becomes several",
      line: "Extra investment becomes income, part of which is spent, which becomes income again, and so on.",
      formula: "k = 1 / (1 − c) = 1 / s\nΔY = k × ΔI",
      example: "c = 0.8, so k = 1 / 0.2 = 5. Firms invest €10 bn more: ΔY = 5 × 10 = €50 bn.",
      points: ["Round 1: ΔI is a first injection, which becomes income for other agents.", "Round 2: they consume c·ΔI, which becomes income again. Round 3: c²·ΔI…", "Each round is smaller, but the rounds add up to ΔI / (1 − c): that is why ΔY > ΔI."],
      exam: "Tutorial 1, exercise 5: compute k and ΔY, explain why ΔY > ΔI step by step, then link the interest rate to investment." },
    { id: "d-multc", title: "When the multiplier is strongest",
      line: "Low saving, little trade, idle capacity.",
      points: ["A low marginal propensity to save: more of each euro is spent again.", "A closed economy: less extra income leaks out as imports.", "Spare capacity and unemployment: firms can produce more instead of raising prices."],
      trap: "A higher MPS means a smaller multiplier, not a bigger one." },
    { id: "d-take", title: "Key takeaways",
      line: "Households decide how much to consume and save; firms decide how much to invest.",
      points: ["Keynes: consumption depends on current income, saving is residual, investment drives demand.", "Neoclassicals: households trade off present and future consumption; the interest rate is key; saving finances investment.", "These decisions set demand, growth, employment and long-run capacity."] }
  ]}
  ]
},
{ id: "growth", n: 4, title: "Economic growth", short: "Growth", c: "var(--ch4)",

    { id: "g-lim", title: "The limits of GDP",

    { id: "g-hdi", title: "The Human Development Index (HDI)",

  { title: "Growth in history", cards: [

}
