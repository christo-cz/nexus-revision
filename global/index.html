{ ch: "systems", q: "In a causal diagram, an arrow from A to B with a \"−\" sign means…", o: ["all else being equal, when A rises, B falls", "A is bad for B", "A and B are negatively correlated by chance", "B causes A to fall"], a: 0, why: "The sign says the two variables move in opposite directions, all else being equal. It is not a moral judgement." },
{ ch: "systems", q: "A loop contains three links: +, −, −. It is…", o: ["a positive (reinforcing) loop", "a negative (balancing) loop", "not a loop, because signs differ", "an unintended consequence"], a: 0, why: "Two minus signs is an even number: the loop is reinforcing." },
{ ch: "systems", q: "A loop contains four links: +, +, −, +. It is…", o: ["a negative (balancing) loop", "a positive (reinforcing) loop", "neutral", "impossible to tell without numbers"], a: 0, why: "One minus sign, an odd number: the loop is balancing." },
{ ch: "systems", q: "Electricity consumption → (+) electricity price → (−) electricity consumption is…", o: ["a balancing loop: a rise in consumption is dampened", "a reinforcing loop: consumption keeps rising", "an unintended consequence", "a tipping point"], a: 0, why: "One minus sign: the loop attenuates the initial change." },
{ ch: "systems", q: "Air conditioning cools homes, but its emissions feed global warming, which brings more heat. This is…", o: ["an unintended consequence", "a balancing loop only", "a tipping point", "resilience"], a: 0, why: "An undesirable, even counterproductive effect of a measure adopted to adapt to the problem." },
{ ch: "systems", q: "Which is the best variable for a causal diagram?", o: ["Air-conditioning use", "Air conditioners", "The government", "Summer"], a: 0, why: "A variable is a quantity that can rise or fall. Objects, actors and periods are not variables." },
{ ch: "systems", q: "\"All else being equal\" means a causal link is read…", o: ["assuming the other variables that influence B stay constant", "only when every variable is equal to zero", "only on average over the year", "only if A and B have the same unit"], a: 0, why: "Each link isolates one influence: the others are held constant." },
{ ch: "systems", q: "France's \"severe heatwave\" (canicule) requires…", o: ["at least 3 consecutive days of very high temperatures, day and night", "one day above 40°C", "48 hours above seasonal norms", "a national thermal indicator above 20°C"], a: 0, why: "Severe heatwave: at least 3 days, very hot day and night, with thresholds by department (Lille: max > 33°C, min > 18°C)." },

{ ch: "systems", q: "Why does the course call systems thinking an antidote?", o: ["It counters our habit of looking for a single cause and a single fix", "It replaces data with intuition", "It removes the need for measures", "It proves causal links with certainty"], a: 0, why: "Linear, single-cause reasoning is reassuring but inadequate, even counterproductive, for complex challenges." },

/* Exam prep: "define / explain this notion" questions, lessons from the empirical research shown in class, and
   causal-diagram questions (src: "diagram", cld: the diagram to draw in the studio). Model answers are ours,
   written from the slides. */
const OPEN = [
{ id: "x1", ch: "systems", src: "define", min: 6, q: "What is a causal diagram? Explain how to read a causal link and its sign.",
  points: ["A visual representation of the variables of a system and their cause-and-effect relationships", "System = a set of interacting elements", "An arrow A → B: A influences B", "+ = same direction, − = opposite directions", "Read \"all else being equal\"", "An example with its sign"],
  model: ["A causal diagram (or causal loop diagram) is a visual representation of the variables of a system, a set of interacting elements, and of the cause-and-effect relationships between them. Each variable is a quantity that can rise or fall.", "An arrow from A to B means that A influences B. Its sign says how: \"+\" when they move in the same direction (A rises, B rises), \"−\" when they move in opposite directions (A rises, B falls). Each link is read all else being equal, that is, holding constant the other variables that also influence B.", "Example: electricity price → (−) electricity consumption. All else being equal, when the price rises, households and firms consume less."] },
{ id: "x2", ch: "systems", src: "define", min: 7, q: "What is a feedback loop? Distinguish positive and negative loops, with an example of each.",
  points: ["The consequences of a phenomenon act on its cause", "Positive (reinforcing): amplifies the initial change", "Negative (balancing): attenuates the initial change", "Polarity rule: even number of − → positive; odd → negative", "Example of a reinforcing loop (temperature ↔ soil drying)", "Example of a balancing loop (electricity consumption ↔ price)"],
  model: ["A feedback loop is a mechanism through which the consequences of a phenomenon act on its cause: a change in A changes B, which in turn changes A.", "A positive or reinforcing loop amplifies the initial change: a rise in global average temperature dries soils, and dry soils push temperatures up further. A negative or balancing loop attenuates it: when electricity consumption rises, its price rises, which dampens consumption.", "The polarity rule: count the minus signs around the loop. None or an even number gives a positive loop; an odd number gives a negative loop. \"Positive\" is not \"good\": a reinforcing loop can amplify a disaster."] },
{ id: "x3", ch: "systems", src: "define", min: 6, q: "Define an unintended consequence (effet pervers) and illustrate it with the heatwave example.",
  points: ["Undesirable, problematic or counterproductive effect", "Of a behaviour or measure adopted to adapt to a problem or solve it", "Desired effect: AC lowers indoor temperatures (balancing loop)", "Unintended path: AC → electricity / emissions → GHG → warming → more heat", "The fix feeds the problem (reinforcing loop)", "Consequence for policy: subsidizing AC has a major drawback"],
  model: ["An unintended consequence is an undesirable, problematic or even counterproductive effect of a behaviour or a measure adopted to adapt to a problem or to solve it.", "With heatwaves, indoor temperatures rise, so people use air conditioning. The desired effect is that indoor temperatures fall: indoor temperature → (+) AC use → (−) indoor temperature, a balancing loop. But AC consumes electricity and adds CO₂ emissions, which raise GHG concentrations and the global average temperature, hence more heatwaves and more heat indoors: a reinforcing loop. The adaptation feeds the problem.", "This is why subsidizing air conditioners would have a major drawback, and why lower-emission alternatives (insulation, urban greening, shading) matter."] },
{ id: "x4", ch: "systems", src: "explain", min: 8, q: "Why is systems thinking useful to address a challenge such as heatwaves? Contrast it with linear thinking.",
  points: ["Heatwaves have environmental, social and economic causes and consequences", "They interact (soil drying → fires → CO₂ → warming)", "Linear thinking: one main cause, one solution", "Reassuring and fast, but inadequate or counterproductive for complex problems", "Systems thinking is holistic: the phenomenon as a whole", "It helps design combinations of measures and anticipate drawbacks"],
  model: ["Heatwaves are a complex challenge: their causes and consequences are environmental (soil drying, fires, biodiversity), social (health, energy poverty, working conditions) and economic (yields, productivity, prices), and they act on each other. Soil drying fuels forest fires, which emit CO₂, which feeds the warming behind the heatwaves.", "Linear thinking looks for one main cause and one solution to remove it. It is reassuring and allows quick action, but it is inadequate, even counterproductive, when the problem is complex: a single fix such as subsidizing air conditioning creates new problems.", "Systems thinking is holistic: it considers the phenomenon as a whole with its many causes and effects. Its tool, the causal diagram, shows loops and side effects, so we can design combinations of measures (insulation, help against energy poverty, decarbonized electricity) and anticipate their drawbacks."] },
{ id: "d1", ch: "systems", src: "diagram", cld: "heat", min: 15, q: "Draw a causal diagram of the causes and consequences of more frequent and severe heatwaves. Identify at least one reinforcing loop, one balancing loop and one unintended consequence.",
  points: ["GHG → (+) temperature → (+) heatwaves", "Environmental chain: soil drying, vegetation stress, fires, CO₂ absorption and emissions", "Social chain: indoor temperatures, AC use, health, energy poverty", "Economic chain: electricity consumption and price", "A reinforcing loop named with the polarity rule", "A balancing loop (AC ↔ indoor temperature or price ↔ consumption)", "The unintended consequence of AC"],
  model: ["Core: GHG concentration → (+) global average temperature → (+) heatwave frequency and severity. Environmental effects: heatwaves → (+) soil drying → (+) vegetation stress → (−) CO₂ absorption → (−) GHG; soil drying → (+) forest fires → (+) CO₂ emissions → (+) GHG. Social and economic effects: heatwaves → (+) indoor temperatures → (+) health problems and (+) energy poverty; indoor temperatures → (+) AC use → (+) electricity consumption → (+) CO₂ emissions; consumption → (+) electricity price → (+) energy poverty; monetary poverty → (+) energy poverty.", "Reinforcing loop: GHG → temperature → heatwaves → soil drying → forest fires → CO₂ emissions → GHG, all signs +. Another: through vegetation stress and CO₂ absorption, two minus signs, an even number. Balancing loops: indoor temperature → (+) AC → (−) indoor temperature (one minus); electricity consumption → (+) price → (−) consumption.", "Unintended consequence: AC cools homes (desired effect) but its electricity use and emissions raise GHG concentrations, hence more heatwaves."] },
{ id: "x5", ch: "sd", src: "define", min: 6, q: "Define maximum sustainable yield and explain what von Carlowitz contributed to sustainability thinking.",
  points: ["MSY: the largest quantity of a renewable resource extractable on a lasting basis", "Context: Saxony, timber shortage, silver mines, 18th century", "Sylvicultura oeconomica (1713): keep logging below a threshold", "Sustainable yield (nachhaltige Nutzung)", "Beyond MSY: overexploitation", "Three principles: long term, systems approach, limits"],
  model: ["Maximum sustainable yield is the largest quantity of a specific renewable natural resource that can be extracted from an ecosystem on a lasting basis. Beyond it, the resource is overexploited and shrinks.", "After the Thirty Years' War, Saxony logged its forests intensively to supply its silver mines. By the early 18th century timber was scarce: prices rose for the mining industry and the population lacked an essential good. In Sylvicultura oeconomica (1713), Hans Carl von Carlowitz recommended keeping logging below the threshold at which the forest regrows: sustainable yield (nachhaltige Nutzung).", "His treatise laid the foundations of sustainability thinking: a long-term perspective, a systems approach linking environmental, social and economic factors, and the recognition of limits not to exceed to preserve an ecosystem's capacity to regenerate. MSY is still central in forestry, fishing, hunting and aquaculture."] },
{ id: "d2", ch: "sd", src: "diagram", cld: "forest", min: 8, q: "Translate von Carlowitz's observations into a causal diagram, and say under which condition the dynamic applies.",
  points: ["Timber harvested → (−) timber available", "Timber available → (−) timber price", "Timber price → (−) profitability of the industry using timber", "Timber price → (−) population's ability to meet essential needs", "Variables typed environmental, social, economic", "Only beyond the forest's MSY"],
  model: ["Quantity of timber harvested → (−) timber available for harvesting → (−) timber price. A higher timber price then → (−) the profitability of the industries that use timber (the silver mines) and → (−) the population's ability to meet essential needs, since wood was essential for heating and building.", "This dynamic only appears beyond a harvesting threshold: the forest's maximum sustainable yield. Below it, the forest regrows what is cut and timber stays available."] },
{ id: "x6", ch: "sd", src: "explain", min: 10, q: "Present the Meadows report: its method, its conclusions, and why it remains a milestone despite its criticisms.",
  points: ["1972, Club of Rome, four MIT scientists", "Five interdependent variables", "Method: causal diagram (World3) → parameterization (form, strength, delays) → simulations", "Standard scenario: collapse in the 21st century", "Recommendations: stabilize population, halt growth", "Criticisms: resources overestimated, climate barely anticipated, too radical", "Legacy: modelling, feedback loops, carrying capacity, planetary boundaries debate"],
  model: ["The Limits to Growth (1972) was commissioned by the Club of Rome and carried out by four MIT scientists (Dennis and Donella Meadows, Jørgen Randers, William Behrens). It assessed the long-term global evolution of five interdependent variables: population, agricultural production, industrial production, non-renewable resources and pollution.", "Its method was new: a causal loop diagram (World3), parameterized with historical data (form, strength and delays of each relationship), then used to simulate scenarios. Under the standard scenario, resources fall and population and industrial output collapse in the 21st century. The authors recommended stabilizing population and halting economic growth.", "Critics noted inaccurate assumptions (resource depletion overestimated, climate change barely anticipated) and found the recommendations too radical. Still, the report opened increasingly sophisticated modelling of human impact, its method and premises (feedback loops, delays, carrying capacity) still guide research, and its collapse scenario after overshooting planetary boundaries is still considered plausible."] },
{ id: "x7", ch: "sd", src: "define", min: 5, q: "Define carrying capacity and explain how the two population loops determine whether population grows, stabilizes or declines.",
  points: ["Carrying capacity: maximum individuals an ecosystem can sustain over time", "For Meadows: humankind, the Earth system", "Positive loop: population → births → population", "Negative loop: population → deaths → (−) population", "(+) >> (−) growth; (+) ≈ (−) stable; (−) >> (+) decline", "Fertility and mortality set the strength of each loop"],
  model: ["Carrying capacity is the maximum number of individuals of a species that an ecosystem can sustain over time. For the Meadows team, the species is humankind and the ecosystem is the whole Earth system.", "Population depends on two loops. Through births: more people, more births, more people (a positive loop, driven by average fertility). Through deaths: more people, more deaths, fewer people (a negative loop, driven by average mortality). If the positive loop dominates, population grows exponentially; if both are about equal, it is stable; if the negative loop dominates, it declines. Near carrying capacity, a population can level off, oscillate, or overshoot and collapse."] },
{ id: "x8", ch: "sd", src: "define", min: 7, q: "Define sustainable development. Where does the concept come from, and how is it usually represented?",
  points: ["Brundtland (1987): needs of the present without compromising future generations", "First used in 1980 (World Conservation Strategy)", "WCED, \"Our Common Future\"", "A shift from Meadows: development, not end of growth; intra- and intergenerational justice", "Three pillars: environment, social, economy", "Bearable, viable, equitable, sustainable", "Institutionalized: Rio 1992, MDGs, SDGs 2015"],
  model: ["Sustainable development is \"development that meets the needs of the present without compromising the ability of future generations to meet their own needs\". The term was first used in 1980 (World Conservation Strategy) and popularized in 1987 by the World Commission on Environment and Development in \"Our Common Future\", the Brundtland Report.", "It marked a shift from the Meadows report: rather than ending growth, it calls for economic development that respects the environment and ensures intra- and intergenerational justice.", "It is usually drawn as three overlapping pillars: environment and social give \"bearable\", environment and economic \"viable\", social and economic \"equitable\", and all three \"sustainable\". It was institutionalized through conferences (Rio 1992, Johannesburg 2002, Rio+20), the MDGs (2000) and the 17 SDGs of the 2030 Agenda (2015)."] },
{ id: "x9", ch: "sd", src: "explain", min: 8, q: "Why has sustainable development not yet become a reality? Give obstacles at the macro, meso and micro levels.",
  points: ["Fact: only 15% of measurable SDG targets on track (UN, 2026)", "Macro: international competition", "Macro: weak commitments without enforcement", "Meso: business models based on volumes", "Meso: communication over action (greenwashing)", "Micro: budget and social constraints, no accessible alternative"],
  model: ["Despite its prominence, sustainable development is far off: of the 139 SDG targets with enough data, only 15% appear on track for 2030 (UN, 2026).", "At the macro level, international competition discourages ambition (a country with demanding environmental standards may become less attractive), and international commitments are weak because they lack enforcement. At the meso level, many business models depend on sales volumes, and some firms choose communication over action, which is greenwashing. At the micro level, individuals face budget and social constraints and often lack accessible alternatives, for example in transport.", "Because obstacles exist at every level and reinforce each other, measures must combine levels."] },
{ id: "x10", ch: "ecology", src: "define", min: 5, q: "Define ecology, ecosystem and biosphere in one connected answer.",
  points: ["Ecology: interactions among living beings and with their environment (Haeckel, 1866)", "Scientific, not political ecology", "Ecosystem: biocenosis + biotope (Tansley, 1935)", "Biosphere: ~20 km envelope, all ecosystems (Suess, 1875)", "A sentence linking the three"],
  model: ["Ecology, from oikos (habitat) and logos (science), is the branch of biology that studies the interactions among living beings and between them and their environment; Ernst Haeckel coined the term in 1866. The course deals with scientific ecology, not political ecology.", "An ecosystem (Tansley, 1935) is a biocenosis, living beings in reciprocal dependence, together with its biotope, the environment that hosts them: a forest, a river, a meadow. The biosphere (Suess, 1875) is the thin envelope of about 20 km where all life has developed, that is, the set of all ecosystems on Earth.", "In one sentence: ecology studies the interactions within ecosystems, and the biosphere is the largest ecosystem of all."] },
{ id: "x11", ch: "ecology", src: "define", min: 7, q: "Define resilience and tipping point. Why can a system be resilient up to a point, then tip?",
  points: ["Resilience: absorb a disturbance and return to the initial state", "Tipping point: beyond it, fast non-linear reorganization, no return", "Resilience rests on stabilizing feedback loops", "Beyond a threshold, the balance between amplifying and regulating loops breaks", "Some loops disappear; the system moves to a new equilibrium", "Example: climate tipping elements, cascades from 1.5–2°C"],
  model: ["Resilience is the capacity of an (eco)system to absorb a pressure or disturbance without a major change in structure, and to return to its initial state once the disturbance has gone. A tipping point is a level of pressure beyond which the system reorganizes, often fast and non-linearly, and does not return to its initial state even if the pressure is reduced.", "Resilience comes from feedback loops that stabilize the system's key variables. Beyond a critical threshold, the balance between amplifying and regulating mechanisms breaks, some loops may even disappear, and the system shifts quickly to a new equilibrium.", "Example: the climate system is resilient to warming only up to climate tipping points; tipping elements include the Greenland ice sheet, the Amazon rainforest and the Atlantic thermohaline circulation, and a cascade cannot be ruled out from 1.5–2°C."] },
{ id: "d3", ch: "ecology", src: "diagram", cld: "amazon", min: 12, q: "Using a causal diagram, show how the Amazon rainforest could pass a tipping point. Which loops make it fragile?",
  points: ["Demand for farmland → (+) deforestation → (−) forest cover", "Forest cover → (+) moisture recycling → (+) rainfall", "Rainfall → (−) drought → (+) fires → (−) forest cover", "A reinforcing dieback loop (two − signs)", "Forest cover → (+) CO₂ absorbed → (−) GHG → (+) temperature → (+) drought", "Tipping: beyond a threshold, the loops push the forest to a new state (savanna) without return"],
  model: ["Demand for farmland drives deforestation, which reduces forest cover. Trees recycle moisture: forest cover → (+) moisture → (+) rainfall. Less rainfall → more droughts → more fires → less forest cover. Counting signs around cover → moisture → rain → drought → fires → cover gives two minus signs: a reinforcing loop. Losing forest makes the forest lose more.", "A second reinforcing loop runs through the climate: forest cover → (+) CO₂ absorbed → (−) GHG concentration → (+) temperature → (+) droughts → (+) fires → (−) cover.", "While the forest is large, balancing processes keep it resilient. Past a level of deforestation and warming, the reinforcing loops dominate and the forest could tip into a drier state that does not come back even if clearing stops: a tipping point."] },
{ id: "x12", ch: "ecology", src: "explain", min: 7, q: "What are the Great Acceleration and the Anthropocene? Why does the Holocene matter for humanity?",
  points: ["Great Acceleration: sharp rise of human-driven processes, especially since 1950", "Socio-economic and Earth-system trends rise together", "Anthropocene: new epoch shaped by humans (Stoermer, Crutzen 2000)", "Not official for the stratigraphy commission, but widely used", "Holocene: ~11,700 years of stability, agriculture and civilizations", "Question: what limits keep a Holocene-like state → planetary boundaries"],
  model: ["The Great Acceleration is the sharp amplification, in the industrial age and especially since the mid-20th century, of human-driven processes that cause global environmental change. Socio-economic trends (population, GDP, energy, fertilizers, water use, transport) and Earth-system trends (CO₂ and methane concentrations, temperature, ocean acidification, forest loss) shoot up together after 1950.", "This growing human impact led to the hypothesis of the Anthropocene, a new geological epoch in which humans profoundly change the conditions of life on Earth. Coined by Eugene Stoermer in the 1980s and popularized by Paul Crutzen in 2000, it is not an official stratigraphic unit, but it is widely used by climate scientists and geologists.", "It would follow the Holocene, about 11,700 years of relative climatic stability that allowed agriculture and civilizations. Since a stable environment is a key factor of human development, scientists asked which limits keep the Earth in a Holocene-like state: the planetary boundaries."] },
{ id: "x13", ch: "bounds", src: "define", min: 8, q: "What are planetary boundaries? Where do they stand today, and why are two of them called \"core\"?",
  points: ["Rockström et al. 2009, Stockholm Resilience Centre", "Nine quantified limits; safe operating space", "Set upstream of tipping points: buffer for uncertainty and reaction", "Seven of nine crossed in 2025 (sequence 2009–2025)", "Ozone and aerosols still within", "Core: climate and biodiversity, linked to all others", "Every tenth of a degree counts"],
  model: ["Planetary boundaries are nine quantified limits on Earth-system processes, defined in 2009 by a team linked to the Stockholm Resilience Centre (Rockström et al.). Below them, humanity operates in a \"safe operating space\" that keeps the Earth in a Holocene-like state; the further a boundary is crossed, the higher the risk of lasting damage. A boundary is set upstream of the tipping point, leaving a buffer for uncertainty and time to react to warning signs.", "The nine: biodiversity loss, global warming, nitrogen and phosphorus cycles, ocean acidification, ozone depletion, freshwater, land-use change, aerosols, novel entities. Three were crossed in 2009 (biodiversity, climate, nitrogen), then land use (2015), novel entities (2022), freshwater (2023) and ocean acidification (2025): seven of nine. Only ozone and aerosols remain within.", "Global warming and biodiversity loss are \"core boundaries\" because they are connected to all the others: crossing them can threaten the whole framework. The scale of future change still depends on our pressures: every tenth of a degree counts."] },
{ id: "x14", ch: "bounds", src: "explain", min: 6, q: "Distinguish weather from climate, and give the key figures of current global warming.",
  points: ["Weather: state of the atmosphere at a given moment", "Climate: average state over a long period (30 years)", "Example: 5°C in a day versus 5°C on average", "+1.17 ± 0.13°C (2018–2022 vs 1850–1900)", "About +0.26°C per decade", "Cause: GHG from human economic activity"],
  model: ["Weather is the state of the atmosphere (temperature, pressure, rainfall, wind) at a given moment, which changes from one hour or day to the next. Climate is its average state over a long period, for example 30 years, which changes little. A 5°C drop during a day is nothing; a 5°C drop in the average temperature would mean a very different world.", "Over 2018–2022, the global average temperature was 1.17 ± 0.13°C above the pre-industrial period (1850–1900), and warming continues at about 0.26°C per decade. Its origin is human economic activity: GHG emissions raise atmospheric concentrations of CO₂, methane and nitrous oxide, which strengthens the greenhouse effect."] },
{ id: "x15", ch: "bounds", src: "explain", min: 6, q: "Describe biodiversity loss: its forms, its scale, its drivers and its consequences.",
  points: ["Three types: genetic, species, ecosystem", "Sixth mass extinction: tens to hundreds of times the background rate", "Five direct drivers (IPBES)", "Indirect drivers behind them", "Consequences: resilience, pollination, food, diseases"],
  model: ["Biodiversity has three levels: genetic diversity within species, diversity of species, and diversity of ecosystems. All three are declining because of human activity. The loss of species is described as a sixth mass extinction: the extinction rate is at least tens to hundreds of times higher than the average of the last 10 million years, and it is accelerating.", "IPBES identifies five direct drivers: land- and sea-use change, direct exploitation of organisms, climate change, pollution and invasive alien species, themselves driven by demographic, economic, technological and institutional factors.", "The consequences include less resilient ecosystems, disrupted pollination, fewer food resources and the spread of diseases."] },
{ id: "d4", ch: "bounds", src: "diagram", cld: "cocoa", min: 10, q: "Show with a causal diagram how global warming affects the chocolate industry, then suggest measures a company like Lindt can take.",
  points: ["Temperature → (+) extreme weather → (+) diseases and fungi → (−) cocoa production", "Age of cocoa trees → (−) production", "Production → (−) cocoa price → (+) chocolate price → (−) consumption", "Temperature → (+) summer heat in consuming countries → (−) consumption", "Measures: cut footprint, hedging, agroforestry, product innovation", "Mitigation versus adaptation"],
  model: ["About 60% of cocoa comes from Côte d'Ivoire and Ghana. Global average temperature → (+) frequency and intensity of extreme weather (torrential rains, droughts) → (+) spread of viral diseases and fungi → (−) cocoa production; older trees also → (−) production. Lower production → (−) means a higher cocoa price, which → (+) raises the chocolate price, which → (−) lowers consumption. Warming also → (+) raises summer temperatures in consuming countries, which → (−) lowers chocolate consumption.", "Lindt's 2025 Climate Transition Plan calls climate change a strategic risk. Its measures: reduce its carbon footprint (mitigation), hedge against sudden rises in cocoa prices, develop agroforestry and innovate in products (adaptation)."] },
{ id: "x16", ch: "social", src: "define", min: 8, q: "Present the Doughnut model. What does it add to the planetary boundaries, and what does it show in 2025?",
  points: ["Kate Raworth, 2012", "Ecological ceiling (planetary boundaries)", "Social foundation (12 dimensions, Rio+20)", "Safe and just space for humanity between them", "2025: 7/9 crossed, shortfalls on every social dimension, modest progress", "No country within; rich countries overshoot, poor countries bear shortfalls"],
  model: ["Developed by Kate Raworth in 2012, the Doughnut applies the idea of limits to the social dimension. Just as there is an ecological ceiling (the planetary boundaries) that economic activity must not exceed, there is a social foundation, levels of need satisfaction below which no one should fall. It had 11, then 12 dimensions (food, health, education, income and work, water, energy, housing, networks, peace and justice, political voice, social equity, gender equality), inspired by the priorities of Rio+20. Between the two lies the ring-shaped safe and just space for humanity.", "In 2025 (Doughnut 3.0), seven of nine planetary boundaries are crossed and there are shortfalls, sometimes large, on every social dimension, with only modest progress. No country lives within the doughnut: the richest 20% of countries (15% of people) cause over 40% of ecological overshoot, while the poorest 40% (42% of people) bear over 60% of social shortfalls. Our economic system has not solved the main social problems."] },
{ id: "x17", ch: "social", src: "define", min: 8, q: "Distinguish absolute and relative monetary poverty: definitions, thresholds, figures, limits.",
  points: ["Poverty: deprivation of the resources needed to live adequately", "Absolute: $3.00/day PPP (World Bank, since 2024), vital goods", "2025: 10.1%, 831 million", "Relative: below 60% of the national median standard of living", "France 2024: €1,337/month, 15.4%", "Limits: absolute ignores context; relative moves with the median", "Other views: Sen (multidimensional), Simmel"],
  model: ["Poverty is a state of deprivation in which a person lacks the resources needed to live adequately. Absolute monetary poverty measures the inability to buy vital goods regardless of context: the World Bank counts as extremely poor anyone living on less than $3.00 a day in PPP (raised from $2.15 in May 2024). In 2025 that is 10.1% of the world, about 831 million people.", "Relative monetary poverty measures the inability to buy the goods needed for a normal life in a given society: a person is poor if their standard of living is below the national poverty line, usually 60% of the median standard of living. It is used by Eurostat; in France in 2024 the line was €1,337 a month and the rate 15.4%.", "Limits: an absolute line ignores what a decent life costs in each society; a relative rate measures distance from the middle, so it can stay high when everyone gets richer. Other approaches exist, such as Sen's multidimensional poverty or Simmel's poverty as dependence on assistance."] },
{ id: "x18", ch: "social", src: "apply", min: 5, q: "A household has 2 adults, a 15-year-old and a 10-year-old. Its earnings are €3,600 a month, it receives €200 of family allowances and pays €400 of direct taxes. Is it below the French poverty line?",
  points: ["Disposable income = 3,600 + 200 − 400 = €3,400", "CU = 1 + 0.5 + 0.5 + 0.3 = 2.3", "Standard of living = 3,400 ÷ 2.3 ≈ €1,478", "Poverty line ≈ €1,337 (60% of €2,228)", "Above the line, but close"],
  model: ["Disposable income adds all income and subtracts mandatory payments: 3,600 + 200 − 400 = €3,400 a month. Consumption units: 1 for the first adult, 0.5 for the second adult, 0.5 for the 15-year-old (14 or over), 0.3 for the 10-year-old: 2.3 CU.", "Standard of living = 3,400 ÷ 2.3 ≈ €1,478 a month for each member. The French poverty line is 60% of the median standard of living (€2,228), about €1,337. The household is above the line, by about €141 per consumption unit."] },
{ id: "x19", ch: "social", src: "explain", min: 8, q: "What is the difference between poverty and inequality? How is income inequality measured, and why should we care about it?",
  points: ["Poverty: situation at the bottom; inequality: gaps across the distribution", "Palma: top 10% / bottom 40% (France 1.08, US 1.63)", "Gini: 0 to 1 (France 0.292, US 0.375)", "Gaps between groups: gender pay gap 24% / 15% / 4%", "Top 10% share rising since 1980", "Correlation with health and social problems (a correlation, not proof)"],
  model: ["Poverty concerns people at the bottom of the distribution; inequality concerns the gaps across the whole distribution. Poverty can fall while inequality rises.", "Income inequality can be measured by comparing the income of the richest with that of the poorest, as with the Palma index (income of the top 10% ÷ income of the bottom 40%: France 1.08 in 2019, US 1.63 in 2021); by the Gini coefficient, from 0 (perfect equality) to 1 (perfect inequality: France 0.292, US 0.375); or by gaps between groups, such as the gender pay gap in France's private sector (24% across all hours, 15% for the same hours, 4% for comparable hours and jobs). Since 1980, the top 10%'s income share has risen in most regions.", "We should care because, across rich countries, more unequal societies show worse health and social problems: life expectancy, infant mortality, homicides, imprisonment, trust, mental health, social mobility. This is a correlation: it corroborates a link but does not prove causation."] },
{ id: "x20", ch: "economy", src: "define", min: 8, q: "Distinguish economy, market, capitalism and market economy.",
  points: ["Economy: oikos + nomos; producing, storing, distributing goods; several models", "Market: place of exchange for money; differs from the abstract Market", "Markets predate capitalism; other ways: own production, gift", "Capitalism: market exchanges + investing money to make more (Fulcher)", "Merchant (17th c.) then industrial (19th c.) capitalism", "Market economy: supply and prices set by market forces (vs planned, mixed)"],
  model: ["The economy (oikos + nomos, \"household management\") covers all activities that produce, store and distribute goods and services. There are several ways to organize it: traditional, feudal, capitalist… Capitalism is one model among others.", "A market is a place, physical or virtual, where actors exchange goods, capital or labour for money. It differs from the abstract \"Market\", the idea that prices and quantities emerge from competitive supply and demand. Market exchanges predate capitalism and are only one way to obtain goods, beside production for one's own use and the gift economy.", "Capitalism is a system in which market exchanges coexist with the possibility of investing money to make more money (Fulcher, 2015): merchant capitalism from the 17th century, industrial capitalism from the early 19th. A market economy is one in which supply and prices are set by free market forces rather than by the state, as opposed to a planned economy; a mixed economy combines both."] },
{ id: "x21", ch: "economy", src: "explain", min: 10, q: "Can economic growth continue? Present the four positions of the debate and their foundations.",
  points: ["Context: growth, Great Acceleration, boundaries crossed, social shortfalls", "Meadows (equilibrium) vs Brundtland (new era of growth)", "Brown growth: as now, fossil fuels, techno-solutionism", "Green growth: decoupling, techno-optimism, weak sustainability (OECD)", "Selective growth: by country and sector, strong sustainability (Jackson)", "Degrowth: abandon growth as goal, techno-criticism (Latouche)", "Link with ADEME scenarios"],
  model: ["Our economic model is characterized by GDP growth, which some see as a growth imperative of capitalism. This growth has gone with the Great Acceleration and the crossing of seven planetary boundaries, without removing social shortfalls. Whether growth can or should continue has long divided sustainability thinkers: Meadows (1972) proposed a non-growing \"equilibrium\", while Brundtland (1987) called for a new, sustainable era of growth to relieve poverty.", "Four positions: brown growth continues as now on fossil fuels and a linear economy (climate scepticism, libertarianism, techno-solutionism). Green growth decouples growth from environmental pressure enough to stay within the boundaries (techno-optimism, liberalism, weak sustainability; OECD 2011). Selective growth differentiates growth by countries' wealth and by sectors (techno-scepticism, reformist environmentalism, strong sustainability; Jackson 2009). Degrowth abandons growth as a primary goal or deliberately reduces production and consumption (techno-criticism, anti-capitalism, strong sustainability; Latouche).", "ADEME's scenarios for 2050 illustrate the range, from S1 Frugal generation to S4 Restoration gamble."] },
{ id: "x22", ch: "economy", src: "explain", min: 8, q: "Compare ADEME's four scenarios for 2050.",
  points: ["S1 Frugal generation: frugality chosen and imposed, local, low-tech, meat ÷3", "S2 Regional cooperation: sharing, fairness, environmental tax, qualitative growth", "S3 Green technologies: technology over sobriety, green growth, targeted carbon tax", "S4 Restoration gamble: mass consumption, carbon capture, carbon-based growth", "Trade-off between sobriety and technology", "Barriers to behaviour change and ways to reduce friction"],
  model: ["ADEME, the French Agency for Ecological Transition, describes four paths to 2050. S1 Frugal generation: frugality chosen but also imposed, local sourcing, nature protected, meat consumption divided by three, mobility down by a third, low-tech and repair, regulation and quotas, new prosperity indicators. S2 Regional cooperation: sustainable lifestyle changes, a sharing economy, fairness, meat halved, managed mobility, massive investment in efficiency and renewables, environmental taxation, qualitative growth.", "S3 Green technologies: new technologies rather than less consumption, green consumerism for the well-off, meat down 30%, demolition and rebuilding, data centres using ten times more energy, a targeted carbon tax, green growth and globalized trade. S4 Restoration gamble: mass consumption kept, nature a resource, confidence in repairing ecosystems with carbon capture, mobility up 28%, carbon-based growth.", "They range from sobriety to technology. Whatever the path, people must change behaviours: barriers such as cost, habits and lack of alternatives must be reduced with infrastructure, prices, rules and norms."] },
{ id: "x23", ch: "method", src: "explain", min: 8, q: "How do you build, present and test a cause tree? Use the gender pay gap as an example.",
  points: ["Cause tree: explains a social fact; causes, not consequences", "Start from the phenomenon, go back to direct then indirect causes, with signs", "Present: summary first, independent of the visual, explain each link", "Corroborate or refute each link with evidence", "Reliable sources; trace to the primary source", "Example: working time and job segregation corroborated by Insee figures"],
  model: ["A cause tree is a causal diagram that explains a social phenomenon or empirical observation, such as the 21.8% gap between women's and men's average net wage income in the private sector (Insee, 2024). Put the phenomenon on the right and work back to the variables that influence it directly (share of women in part-time work, concentration in lower-paid jobs, share in senior positions, discrimination), then indirectly (care work, children, stereotypes), with a sign on each arrow.", "To present it, give the overview first (\"four main mechanisms\"), make the reasoning understandable without the sheet, and explain why each link is plausible.", "Then test each link with evidence from reliable sources, traced back to the primary source: mark it corroborated, refuted or uncertain. For example, the gap falls from 24% to 15% at equal working hours, which corroborates the part-time link, and to 4% at comparable jobs, which corroborates job segregation; the remaining 4% is compatible with discrimination but stays uncertain."] },
{ id: "d5", ch: "method", src: "diagram", cld: "homicide", min: 10, q: "Build a cause tree explaining why the US homicide rate is six times France's.",
  points: ["Unemployment and low-paid jobs → (+) poverty", "Welfare system → (−) poverty", "Poverty → (+) organised crime, drug addiction, homicides", "Drug addiction → (+) organised crime and homicides", "Gun legislation → (+) gun ownership → (+) homicides", "Direct and indirect causes"],
  model: ["The homicide rate (6.8 per 100,000 in 2021) has direct causes: the prevalence of organised crime, the drug addiction rate, the gun ownership rate and the poverty rate, all with + signs.", "Indirect causes act through them: unemployment → (+) poverty, share of low-paid jobs → (+) poverty, development of the welfare system → (−) poverty; poverty → (+) organised crime and (+) drug addiction; drug addiction → (+) organised crime; permissiveness of gun legislation → (+) gun ownership. Each link should then be corroborated or refuted with reliable evidence."] },
{ id: "d6", ch: "method", src: "diagram", cld: "paygap", min: 12, q: "Build a cause tree of the gender pay gap, and say which links the figures of the course corroborate.",
  points: ["Part-time work → (+) gap", "Care work and children → (+) part-time", "Stereotypes → (+) job segregation → (+) gap", "Share of women in senior positions → (−) gap", "Discrimination → (+) gap", "Evidence: 24% → 15% (hours) → 4% (jobs)"],
  model: ["Possible tree: number of children → (+) women's unpaid care work → (+) share of women working part time → (+) pay gap. Gender stereotypes → (+) care work and → (+) concentration of women in lower-paid jobs and sectors → (+) pay gap. Career breaks → (−) share of women in senior positions → (−) pay gap. Pay discrimination → (+) pay gap.", "Evidence from the course: in France's private sector, the gap is 24% across all hours, 15% at equal hours (corroborating the working-time link) and 4% at comparable hours and jobs (corroborating job segregation). The remaining 4% is compatible with discrimination but does not prove it: an uncertain link."] },
{ id: "d7", ch: "sd", src: "diagram", cld: "fish", min: 10, q: "Practice: draw the causal diagram of an overfished sea, find its loops, and explain where the maximum sustainable yield fits.",
  points: ["Fleet → (+) catch → (−) stock", "Stock ↔ reproduction: reinforcing loop", "Stock → (+) catch per boat → (+) profitability → (+) fleet", "Fleet loop: one − sign, balancing", "Quotas → (−) catch", "MSY: catch above regrowth makes the stock shrink"],
  model: ["Fleet size → (+) fish caught → (−) fish stock. The stock renews itself: stock → (+) new fish born → (+) stock, a reinforcing loop. The stock also drives profits: stock → (+) catch per boat → (+) profitability → (+) fleet size. Around fleet → catch → stock → catch per boat → profitability → fleet there is one minus sign: a balancing loop, which shrinks the fleet, but often only after the stock has collapsed.", "Quotas → (−) catch: they let a regulator keep the catch at or below the maximum sustainable yield, the largest catch that the stock's regrowth can replace every year. Above it, the stock is overexploited."] },
{ id: "d8", ch: "sd", src: "diagram", cld: "lez", min: 10, q: "Practice: a city bans older cars from its centre. Draw the desired effect and the unintended consequences.",
  points: ["Ban → (−) older vehicles → (+) air pollution → (+) respiratory problems", "Desired effect: cleaner air, better health", "Ban → (+) cost of getting around for low-income households → (+) exclusion", "Ban → (+) new car purchases → (+) manufacturing emissions", "Two unintended consequences: social and environmental", "Why it is \"not that simple\""],
  model: ["Desired effect: stricter ban → (−) older vehicles in the centre → (+) air pollution → (+) respiratory health problems; overall, cleaner air and fewer health problems.", "Unintended consequences: the ban → (+) the cost of getting around for low-income households, who cannot replace their car → (+) their social exclusion. And it → (+) purchases of new cars → (+) emissions from manufacturing them. This is why the practice in session 2 is \"not that simple\": a measure that looks sustainable can harm the social pillar and shift environmental pressure elsewhere."] }
];

/* ---------------- FLASHCARDS ---------------- */
function viewCards(pre){
  const sel = new Set(pre && CH[pre] ? [pre] : COURSE.map(c => c.id));
  const root = h("div", { class: "mod", html: `${mhead("Societal and Global Challenges", "Flashcards", "Say the answer out loud, then flip. Cards you know leave the pile; the others come back.")}
    <div class="drillbar"><div class="mchips">${COURSE.map(c => chipCh(c, sel.has(c.id))).join("")}</div><div class="seg"><button type="button" data-shuffle>Shuffle</button><button type="button" data-resetk>Reset known</button></div></div>
    <div class="mprog"><div class="mbar"><i data-fbar></i></div><span data-fcount></span></div>
    <div class="fstage"></div>` });
  const stage = root.querySelector(".fstage");
  let deck = [];
  const known = () => MS.get("cards", {});
  const build = (mix) => { const k = known(); deck = CARDS.map((c, i) => ({ i, ch: c[0], f: c[1], b: c[2] })).filter(c => sel.has(c.ch) && !k[c.i]); if (mix) deck = shuffle(deck); paint(); };
  function paint(){
    const k = known(), total = CARDS.filter(c => sel.has(c[0])).length, kn = CARDS.filter((c, i) => sel.has(c[0]) && k[i]).length;
    root.querySelector("[data-fbar]").style.width = (total ? kn / total * 100 : 0) + "%"; root.querySelector("[data-fcount]").textContent = `${kn} of ${total} known · ${deck.length} left in the pile`;
    if (!deck.length){ stage.innerHTML = `<div class="sprintend"><span class="kicker">Pile empty</span><h2>You know all ${total} cards</h2><div class="row"><button class="btn primary" type="button" data-resetk>Start over</button><a class="btn glassy" href="#quiz">Take a quiz</a></div></div>`; return; }
    const c = deck[0], C = CH[c.ch];
    stage.innerHTML = `<div class="fdeck" data-n="${Math.min(2, deck.length - 1)}"><button class="flip enter" type="button" aria-label="Flip the card" style="--c:${C.c}"><span class="face front"><em>${C.short}</em><b>${c.f}</b><small>Click or press Space to flip</small></span><span class="face back"><em>${c.f}</em><b>${c.b}</b></span></button></div>
      <div class="fact"><button class="btn glassy big" type="button" data-again>Again <kbd>←</kbd></button><button class="btn primary big" type="button" data-know>I knew it <kbd>→</kbd></button></div>`;
  }
  const flip = () => { const f = stage.querySelector(".flip"); if (f) f.classList.toggle("on"); };
  /* the card leaves the deck: to the right when known, to the back when it comes again */
  let busy = false;
  const leave = (dir, fn) => { const f = stage.querySelector(".flip"); if (busy) return; if (!f || matchMedia("(prefers-reduced-motion: reduce)").matches){ fn(); return; } busy = true; f.classList.add("fly-" + dir); setTimeout(() => { busy = false; fn(); }, 260); };
  const again = () => { if (!deck.length) return; leave("l", () => { deck.push(deck.shift()); paint(); }); };
  const got = () => { if (!deck.length) return; burst(stage.querySelector("[data-know]"), ["--ok", "--pri", "--c4"]); leave("r", () => { const k = known(); k[deck[0].i] = 1; MS.set("cards", k); deck.shift(); paint(); }); };
  root.addEventListener("click", e => {
    const cb = e.target.closest("[data-ch]"); if (cb){ const k = cb.dataset.ch; if (sel.has(k) && sel.size > 1) sel.delete(k); else sel.add(k); cb.classList.toggle("on", sel.has(k)); cb.setAttribute("aria-pressed", String(sel.has(k))); build(true); }
    if (e.target.closest(".flip")) flip();
    if (e.target.closest("[data-again]")) again();
    if (e.target.closest("[data-know]")) got();
    if (e.target.closest("[data-shuffle]")) build(true);
    if (e.target.closest("[data-resetk]")){ const k = known(); CARDS.forEach((c, i) => { if (sel.has(c[0])) delete k[i]; }); MS.set("cards", k); build(true); }
  });
  const onKey = e => { if (!root.isConnected){ document.removeEventListener("keydown", onKey); return; } if (e.target.matches && e.target.matches("input,textarea")) return;
    if (e.key === " "){ e.preventDefault(); flip(); } if (e.key === "ArrowLeft") again(); if (e.key === "ArrowRight") got(); };
  document.addEventListener("keydown", onKey);
  build(true);
  return root;
}


/* =====================================================================
   CAUSAL DIAGRAM ENGINE — models, loops, paths and effects (computed, never written by hand),
   and an SVG board shared by the Learn widgets, the Causal studio and the exam.
   ===================================================================== */
const BOARD = { W: 1000, H: 620 };
/* a diagram from the data file → { nodes: [{id,label,kind,x,y}], links: [{from,to,sign,why,via}] } */
function cldModel(d){
  return { id: d.id, nodes: d.nodes.map(n => Array.isArray(n) ? { id: n[0], label: n[1], kind: n[2], x: n[3], y: n[4] } : { ...n }),
    links: d.links.map(l => Array.isArray(l) ? { from: l[0], to: l[1], sign: l[2], why: l[3] || "", via: (l[4] || {}).via || null, at: (l[4] || {}).at } : { ...l }) };
}
const linkKey = l => l.from + ">" + l.to;
/* every elementary loop; polarity by the course's rule (count the minus signs) */
function findLoops(m, cap = 80){
  const ids = m.nodes.map(n => n.id), idx = Object.fromEntries(ids.map((id, i) => [id, i])), out = {};
  m.links.forEach(l => { if (idx[l.from] != null && idx[l.to] != null) (out[l.from] = out[l.from] || []).push(l); });
  const loops = [];
  ids.forEach((start, s) => {
    const seen = new Set([start]), path = [];
    const dfs = v => {
      if (loops.length >= cap) return;
      for (const l of out[v] || []){
        if (l.to === start){ loops.push(path.concat(l)); continue; }
        if (idx[l.to] > s && !seen.has(l.to)){ seen.add(l.to); path.push(l); dfs(l.to); path.pop(); seen.delete(l.to); }
      }
    };
    dfs(start);
  });
  return loops.map(ls => { const neg = ls.filter(l => l.sign < 0).length; return { links: ls, nodes: ls.map(l => l.from), neg, kind: neg % 2 ? "B" : "R" }; })
    .sort((a, b) => a.links.length - b.links.length);
}
/* every simple path from a to b, with the product of its signs */
function pathsBetween(m, a, b, cap = 60, maxLen = 10){
  const out = {}; m.links.forEach(l => (out[l.from] = out[l.from] || []).push(l));
  const res = [], seen = new Set([a]), path = [];
  const dfs = v => {
    if (res.length >= cap || path.length > maxLen) return;
    for (const l of out[v] || []){
      if (l.to === b){ const p = path.concat(l); res.push({ links: p, sign: p.reduce((s, x) => s * x.sign, 1) }); continue; }
      if (!seen.has(l.to)){ seen.add(l.to); path.push(l); dfs(l.to); path.pop(); seen.delete(l.to); }
    }
  };
  dfs(a);
  return res;
}
/* the effect of a rise in a on b, all else being equal: "up", "down", "mixed" or null (no path) */
function effectOf(m, a, b){
  const ps = pathsBetween(m, a, b); if (!ps.length) return { eff: null, paths: [] };
  const pos = ps.some(p => p.sign > 0), neg = ps.some(p => p.sign < 0);
  return { eff: pos && neg ? "mixed" : pos ? "up" : "down", paths: ps };
}
/* push a variable up: every variable it reaches, with the direction and the step at which it is reached */
function propagate(m, a){
  const res = {}, nodes = m.nodes.map(n => n.id);
  nodes.forEach(id => { if (id === a) return; const e = effectOf(m, a, id); if (e.eff) res[id] = { eff: e.eff, step: Math.min(...e.paths.map(p => p.links.length)) }; });
  return res;
}
const nodeLabel = (m, id) => (m.nodes.find(n => n.id === id) || { label: id }).label;
const signTxt = s => s > 0 ? "+" : s < 0 ? "−" : "?";
const loopName = (m, L) => L.nodes.map(id => nodeLabel(m, id)).concat(nodeLabel(m, L.nodes[0])).join(" → ");
const loopWhy = L => L.neg === 0 ? "only + signs" : `${L.neg} minus sign${L.neg > 1 ? "s" : ""}, an ${L.neg % 2 ? "odd" : "even"} number`;

/* ---------- drawing ---------- */
function wrapLabel(t, max = 19){
  const words = String(t).split(" "), lines = []; let cur = "";
  words.forEach(w => { if ((cur + " " + w).trim().length > max && cur){ lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
  if (cur) lines.push(cur);
  return lines;
}
function nodeBox(n){
  const lines = wrapLabel(n.label), w = Math.max(104, Math.min(186, Math.max(...lines.map(l => l.length)) * 7.4 + 26)), h = 18 + lines.length * 15;
  return { lines, w, h, x0: n.x - w / 2, y0: n.y - h / 2 };
}
function edgePoint(n, b, tx, ty, pad = 4){
  const dx = tx - n.x, dy = ty - n.y; if (!dx && !dy) return [n.x, n.y];
  const sx = (b.w / 2 + pad) / Math.abs(dx || 1e-9), sy = (b.h / 2 + pad) / Math.abs(dy || 1e-9), s = Math.min(sx, sy);
  return [n.x + dx * s, n.y + dy * s];
}
/* a path through the waypoints with rounded corners; returns the "d", and a point near the end for the sign */
function routePath(pts, bend, at){
  if (pts.length === 2){
    const [a, b] = pts;
    if (bend){ const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, cx = mx - dy / L * bend * L, cy = my + dx / L * bend * L;
      const t = .62, px = (1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * cx + t * t * b[0], py = (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * cy + t * t * b[1];
      return { d: `M${a[0].toFixed(1)},${a[1].toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`, sx: px, sy: py }; }
    const t = .66; return { d: `M${a[0].toFixed(1)},${a[1].toFixed(1)} L${b[0].toFixed(1)},${b[1].toFixed(1)}`, sx: a[0] + (b[0] - a[0]) * t, sy: a[1] + (b[1] - a[1]) * t };
  }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length - 1; i++){
    const p = pts[i], a = pts[i - 1], b = pts[i + 1], r = 14;
    const la = Math.hypot(p[0] - a[0], p[1] - a[1]) || 1, lb = Math.hypot(b[0] - p[0], b[1] - p[1]) || 1, ra = Math.min(r, la / 2), rb = Math.min(r, lb / 2);
    const p1 = [p[0] - (p[0] - a[0]) / la * ra, p[1] - (p[1] - a[1]) / la * ra], p2 = [p[0] + (b[0] - p[0]) / lb * rb, p[1] + (b[1] - p[1]) / lb * rb];
    d += ` L${p1[0].toFixed(1)},${p1[1].toFixed(1)} Q${p[0]},${p[1]} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const z = pts[pts.length - 1], y = pts[pts.length - 2];
  d += ` L${z[0].toFixed(1)},${z[1].toFixed(1)}`;
  const k = at == null ? .55 : at; return { d, sx: y[0] + (z[0] - y[0]) * k, sy: y[1] + (z[1] - y[1]) * k };
}
/* the board: o.links overrides the model's links (a student's diagram); o.cls(link) and o.ncls(node) add classes;
   o.sign(link) returns the sign to show (null hides it, 0 shows "?"); o.loops draws R/B markers */
function boardSVG(m, o = {}){
  const links = o.links || m.links, N = Object.fromEntries(m.nodes.map(n => [n.id, n])), B = Object.fromEntries(m.nodes.map(n => [n.id, nodeBox(n)]));
  const keys = new Set(links.map(linkKey)), uid = "b" + Math.random().toString(36).slice(2, 7);
  const marker = (id, c) => `<marker id="${uid}${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
  const kinds = ["n", "ok", "bad", "miss", "extra", "hot", "dim", "up", "down"];
  const COL = { n: "var(--muted)", ok: "var(--ok)", bad: "var(--bad)", miss: "var(--faint)", extra: "var(--c4)", hot: "var(--c4)", dim: "var(--line-2)", up: "var(--c4)", down: "var(--c1)" };
  let defs = `<defs>${kinds.map(k => marker(k, COL[k])).join("")}</defs>`;
  const linkSvg = links.map((l, i) => {
    const a = N[l.from], b = N[l.to]; if (!a || !b) return "";
    const via = !o.straight && l.via ? l.via : null, rev = keys.has(l.to + ">" + l.from);
    const first = via ? via[0] : [b.x, b.y], last = via ? via[via.length - 1] : [a.x, a.y];
    let s = edgePoint(a, B[l.from], first[0], first[1]), e = edgePoint(b, B[l.to], last[0], last[1], 7);
    const pts = via ? [s, ...via, e] : [s, e];
    const r = routePath(pts, !via && rev ? .16 : 0, via ? l.at : null);
    const cls = (o.cls && o.cls(l, i)) || "n", sg = o.sign ? o.sign(l, i) : l.sign;
    return `<g class="lk ${cls}" data-li="${i}"><path class="lkhit" d="${r.d}"/><path class="lkp" d="${r.d}" marker-end="url(#${uid}${kinds.includes(cls) ? cls : "n"})"/>${sg === null ? "" : `<g class="sgn ${sg > 0 ? "p" : sg < 0 ? "m" : "q"}" data-sl="${i}" transform="translate(${r.sx.toFixed(1)},${r.sy.toFixed(1)})"><circle r="11.5"/><text dy=".36em">${signTxt(sg)}</text></g>`}</g>`;
  }).join("");
  const nodeSvg = m.nodes.map(n => { const b = B[n.id], cls = (o.ncls && o.ncls(n)) || "";
    return `<g class="nd k-${n.kind} ${cls}" data-n="${n.id}" transform="translate(${b.x0.toFixed(1)},${b.y0.toFixed(1)})" tabindex="${o.focusable ? 0 : -1}" role="${o.focusable ? "button" : "img"}" aria-label="${esc(n.label)}"><rect width="${b.w.toFixed(1)}" height="${b.h}" rx="9"/>${b.lines.map((t, k) => `<text x="${(b.w / 2).toFixed(1)}" y="${(17 + k * 15).toFixed(1)}">${esc(t)}</text>`).join("")}</g>`; }).join("");
  let loopSvg = "";

const STUDIO_STEPS = [
  ["Name the key variable", "Start from the phenomenon you explain (heatwave frequency, the pay gap…), stated as a quantity that can rise or fall."],
  ["List causes and consequences", "Think environmental, social and economic. Each one is a variable: \"air-conditioning use\", not \"air conditioners\"."],
  ["Draw the arrows", "From cause to effect. Add intermediate variables when a link hides a mechanism."],
  ["Sign every arrow", "+ if they move together, − if they move in opposite directions, all else being equal."],
  ["Find the loops", "Follow arrows back to where you started. Even number of − (or none): reinforcing. Odd: balancing."],
  ["Look for side effects", "A measure with a desired effect can feed the problem elsewhere: an unintended consequence."]
];
const studioState = () => MS.get("studio", {});

  return h("div", { class: "mod studio", html: `${mhead("Societal and Global Challenges", "Causal studio", "A causal diagram is very likely in the exam. Draw the course's diagrams yourself, get each link checked, then build your own: the loops and effects are worked out by the code.")}
