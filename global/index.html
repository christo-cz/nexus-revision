/* Societal and Global Challenges lab: the Earth system and the societies that live on it.
   Colour carries the course and the slides' own legend: leaf --pri = environmental variables (and the lab),
   rose --c3 = social variables, blue --c1 = economic variables, ochre --c4 = loops and systems thinking,
   violet --c2 = sustainable development, cyan --c5 = ecology. Dark is the default; light only on request. */
:root{
  color-scheme:dark;
  --bg:#0B120F; --surface:#121B17; --sunk:#18241F; --line:#24332C; --line-2:#344A3F; --fg:#EEF4EE; --muted:#A9B9AF; --faint:#7A8C81;
  --pri:#8EE26B; --pri-2:#A8EC8C; --pri-soft:#1B3317; --on-pri:#0B1A08;
  --c1:#6FB4FF; --c1-soft:#10263F; --c2:#B79BFF; --c2-soft:#241D45; --c3:#FF7F96; --c3-soft:#3A1820; --c4:#F2C14E; --c4-soft:#36290C; --c5:#4FD6D0; --c5-soft:#0E2F2E;
  --ok:#6FD39C; --ok-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1B1A;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .28);
  --glass:rgb(255 255 255 / .045); --glass-line:rgb(255 255 255 / .1);
  --f-display:"Familjen Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hdr:56px; --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F4F7F1; --surface:#FFFFFF; --sunk:#E9EFE6; --line:#DAE3D5; --line-2:#C3D0BD; --fg:#14201A; --muted:#55665C; --faint:#87968C;
  --pri:#3B7A18; --pri-2:#2F6612; --pri-soft:#E3F1D9; --on-pri:#FFFFFF;
  --c1:#1E63B4; --c1-soft:#E1ECF9; --c2:#5B45C2; --c2-soft:#ECE8FB; --c3:#B83250; --c3-soft:#F9E2E7; --c4:#986800; --c4-soft:#F7EDD4; --c5:#0B7A75; --c5-soft:#DDF2F0;
  --ok:#23794E; --ok-soft:#DFF2E6; --bad:#B4372E; --bad-soft:#F9E3E0;
  --shadow:0 1px 2px rgb(20 32 26 / .05),0 6px 20px rgb(20 32 26 / .07);
  --glass:rgb(255 255 255 / .62); --glass-line:rgb(20 32 26 / .1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 76%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--glass-line)}
.hdr-in{min-height:56px;display:flex;align-items:center;gap:16px;padding-left:var(--gut);padding-right:var(--gut-r)}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.12rem;white-space:nowrap;text-decoration:none}
.crumb .hub{color:var(--muted);font-weight:600;text-decoration:none}
.crumb .hub:hover{color:var(--fg)}
.crumb .sl{color:var(--line-2);font-weight:400}
.crumb b{color:var(--pri)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.92rem;text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--fg);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--sunk)}
.grow{flex:1}
.theme{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:.84rem;font-weight:600;color:var(--muted)}
.theme:hover{color:var(--fg);border-color:var(--line-2)}
.theme svg{width:16px;height:16px}
.crumb .here{text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crumb{min-width:0}
@media (max-width:480px){.nav a[data-route="home"]{display:none}.crumb{font-size:1.02rem}}
.hdr-in{gap:10px}
.hdr .theme{background:transparent}
@media (max-width:980px){#fsBtn .tl{display:none}}
@media (max-width:620px){.nav{margin-left:0}.nav a{padding:7px 9px}.theme .tl{display:none}.crumb .hub,.crumb .sl{display:none}}

/* ---------- shared page frame ---------- */
.page{max-width:1040px;margin:0 auto;padding-block:36px 72px;padding-left:var(--gut);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:48px}
@media (max-width:620px){.page{padding-block:24px 56px;gap:40px}}
.sec{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.35rem}
.sec-h p{color:var(--muted);font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:11px 18px;font-weight:700;font-size:.96rem;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pri);color:var(--on-pri)}
.btn.primary:hover{background:var(--pri-2)}
.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.quiet:hover{border-color:var(--line-2)}
.btn.small{padding:7px 12px;font-size:.86rem;border-radius:9px}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- overview ---------- */
.hero{display:flex;flex-direction:column;gap:18px}
.eq{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,7vw,4rem);line-height:1.02;letter-spacing:-.03em}
.eq .i{color:var(--c4)} .eq .l{color:var(--c3)} .eq .y{color:var(--pri)}
.hero .lede{max-width:52ch;color:var(--muted);font-size:1.06rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat span{font-size:.84rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat b{font-size:1.3rem}}
.cases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.cases{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
.casecard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.casecard:hover{border-color:var(--pri);box-shadow:var(--shadow)}
.casecard .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.casecard b{font-family:var(--f-display);font-size:1.05rem}
.casecard .country{font-size:.84rem;color:var(--muted)}
.casecard .state{font-size:.78rem;font-weight:600;color:var(--muted)}
.casecard .state.done{color:var(--ok)}
.casecard .state.go{color:var(--pri)}
.mini{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.mini i{display:block;height:100%;background:var(--pri);border-radius:99px}
.exam{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
@media (max-width:760px){.exam{grid-template-columns:1fr;gap:18px}}
.exam h2{font-size:1.25rem}
.exam p{color:var(--muted);font-size:.95rem;margin-top:6px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.split i{display:block}
.legend{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.legend li{display:flex;gap:10px;align-items:baseline}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none;transform:translateY(1px)}
.legend b{font-family:var(--f-mono);font-size:.86rem;min-width:3ch}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{font-size:.86rem;padding:6px 12px;border-radius:99px;border:1px dashed var(--line-2);color:var(--muted)}
.pagetitle{font-size:clamp(1.05rem,2.4vw,1.25rem);font-weight:700;color:var(--pri);margin:-6px 0 -4px}
.credit{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px 20px}
.credit .who{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.credit .who b{font-family:var(--f-display);font-size:1.05rem}
.credit .who span{font-size:.86rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:.88rem;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,transform .15s}
.links a:hover,.links button:hover{border-color:var(--pri);transform:translateY(-1px)}
.links svg{width:17px;height:17px;flex:none}
.foot{border-top:1px solid var(--line);padding-top:18px;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ---------- case workbook ---------- */
.book{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px))}
.sheet{overflow-y:auto;overscroll-behavior:contain;background:color-mix(in srgb,var(--surface) 45%,var(--bg));border-right:1px solid var(--line);padding-block:22px 48px;padding-left:var(--gut);padding-right:22px;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;flex-direction:column;gap:4px}
.sheet-h h1{font-size:1.55rem}
.sheet-h p{font-size:.88rem;color:var(--muted)}
.blk{position:relative;border:1px solid transparent;background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 0 var(--line);transition:border-color .25s,background-color .25s,opacity .25s,transform .2s}
.blk:hover{border-color:var(--line-2)}
.blk .go{position:absolute;top:12px;right:14px;font-size:.74rem;font-weight:700;color:var(--pri);opacity:0;transition:opacity .2s}
.blk:hover .go,.blk:focus-visible .go{opacity:1}
.blk h2{font-size:.98rem;display:flex;gap:10px;align-items:center}
.blk h2 .tg{font-family:var(--f-mono);font-size:.74rem;font-weight:700;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk);color:var(--muted)}
.blk p{font-size:.92rem;line-height:1.55}
.blk.on{border-color:var(--pri);background:var(--pri-soft)}
.blk.on h2 .tg{background:var(--pri);color:var(--on-pri)}
.sheet.focus .blk:not(.on){opacity:.72}
.sheet.focus .blk:not(.on):hover{opacity:1}
.qmap{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.qmap-h{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.qrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.qrow .lt{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--faint);width:16px}
.qsq{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line-2);background:transparent;font-family:var(--f-mono);font-size:.74rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,background-color .2s,border-color .2s}
.qsq:hover{transform:translateY(-2px);border-color:var(--fg);color:var(--fg)}
.qsq.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.qsq.bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.qsq.cur{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--pri)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.k-inj{color:var(--c4);font-weight:700} .k-leak{color:var(--c3);font-weight:700}
.qs{overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scroll-padding-top:120px;scroll-padding-bottom:24px;padding-left:28px;padding-right:var(--gut-r);padding-bottom:42vh;display:flex;flex-direction:column;gap:20px;position:relative}
.bar{position:sticky;top:0;z-index:6;background:var(--bg);padding-block:14px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .chips{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px 5px 6px;font-size:.84rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip .tg{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk)}
.chip[aria-current="true"]{border-color:var(--pri);color:var(--fg)}
.chip[aria-current="true"] .tg{background:var(--pri);color:var(--on-pri)}
.chip .cnt{font-family:var(--f-mono);font-size:.74rem;color:var(--faint)}
.chip.full .cnt{color:var(--ok)}
.score{margin-left:auto;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.score b{font-family:var(--f-display);font-size:1.15rem}
.score span{font-size:.84rem;color:var(--muted)}
.prog{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.prog i{display:block;height:100%;transition:width .3s}
.prog .r{background:var(--ok)} .prog .w{background:var(--bad)}
.card{scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,box-shadow .2s,opacity .2s}
.qs.has-cur .card:not(.cur){opacity:.72}
.card.cur{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft),var(--shadow);opacity:1}
.qhead{display:flex;align-items:center;gap:10px}
.qn{font-family:var(--f-mono);font-size:.8rem;font-weight:700;min-width:30px;height:30px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;background:var(--sunk);color:var(--muted)}
.card.ok .qn{background:var(--ok);color:var(--bg)} .card.bad .qn{background:var(--bad);color:var(--bg)}
.card.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.card.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.card.ok.cur{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 28%,transparent),var(--shadow)}
.card.bad.cur{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 28%,transparent),var(--shadow)}
.card:is(.ok,.bad) .verdict{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.card:is(.ok,.bad) .field{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.restart{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.restart:hover{color:var(--fg);border-color:var(--line-2)}
.restart[data-armed]{color:var(--bad);border-color:var(--bad)}
.restart svg{width:14px;height:14px}
@media (max-width:620px){.restart .tl{display:none}}
.qtag{font-size:.8rem;font-weight:600;color:var(--muted)}
.qtext{font-size:1.06rem;font-weight:500;line-height:1.5;max-width:60ch}
.snip{display:none;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:9px;padding:8px 11px;line-height:1.5}
.ans{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.field{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:11px;background:var(--bg);overflow:hidden;flex:1 1 180px;max-width:320px;transition:border-color .15s}
.field:focus-within{border-color:var(--pri)}
.field input{border:0;background:transparent;padding:11px 13px;font-family:var(--f-mono);font-size:1.02rem;width:100%;min-width:0;outline:none}
.field input:disabled{opacity:.8}
.field .unit{padding:0 13px 0 4px;font-size:.86rem;color:var(--muted);white-space:nowrap}
.card.ok .field{border-color:var(--ok)} .card.bad .field{border-color:var(--bad)}
.check{border:0;border-radius:11px;padding:11px 18px;font-weight:700;background:var(--fg);color:var(--bg)}
.hintbtn{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;padding:8px 6px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.hintbtn:hover{color:var(--fg)}
.hint{font-size:.92rem;color:var(--muted);border-left:3px solid var(--c4);padding:2px 0 2px 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 13px;font-size:.96rem;line-height:1.45;transition:border-color .15s,background-color .15s}

/* ---------- reviews ---------- */
.rv-sum{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}

.rv-tags span i{font-style:normal;font-family:var(--f-mono);color:var(--fg);margin-left:4px}
.st{color:var(--c4);letter-spacing:1px;font-size:.95rem;white-space:nowrap}
.st .off{color:var(--line-2)}
.rv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rv{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-bottom:1px solid var(--line);max-width:68ch}
.rv-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:.88rem}

.rv-form{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:640px}

.rv-form h3{font-size:1.1rem}

.rv-form legend,.rv-form .lbl{font-size:.88rem;font-weight:700;padding:0;margin-bottom:8px}

.stars{display:flex;align-items:center;gap:2px}
.stars button{border:0;background:none;padding:4px;font-size:1.9rem;line-height:1;color:var(--line-2);transition:color .1s,transform .1s}

.stars output{margin-left:10px;font-size:.9rem;color:var(--muted);font-weight:600}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.tagpick button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.86rem;font-weight:600;color:var(--muted)}
.tagpick button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--fg)}
.rv-form textarea,.rv-form input[type=text]{width:100%;border:1.5px solid var(--line-2);border-radius:11px;background:var(--surface);padding:11px 13px;font:inherit;font-size:.96rem;line-height:1.5;outline:none;resize:vertical}
.rv-form textarea{min-height:96px}
.rv-form textarea:focus,.rv-form input[type=text]:focus{border-color:var(--pri)}
.rv-form .cnt{font-size:.78rem;color:var(--faint);align-self:flex-end;font-family:var(--f-mono)}
.rv-form .two{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}

.rv-form .msg{font-size:.9rem;font-weight:600}

.rv-thanks{display:flex;gap:10px;align-items:center;background:var(--ok-soft);border-radius:12px;padding:12px 16px;font-weight:600;font-size:.95rem}
/* ---------- overview & case list: the living circular flow ---------- */
#app{position:relative;z-index:1}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(640px circle at var(--ax,70%) var(--ay,40%),color-mix(in srgb,var(--ac,var(--pri)) 20%,transparent),transparent 70%);transition:opacity .4s}
:root[data-theme="light"] .aura{opacity:.8}
.ov{--surface:var(--glass)}
.ov :is(.casecard,.stat,.exam,.credit,.rv-form){backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);border-color:var(--glass-line)}
.fhero{position:relative;overflow:hidden;isolation:isolate;min-height:calc(100svh - var(--hdr) - env(safe-area-inset-top,0px));display:flex;align-items:center}

.fl.inj b{color:var(--c4)} .fl.leak b{color:var(--c3)}
.fl.arc{font-size:.74rem;color:var(--faint)}

.fl.inj.lit{background:var(--c4-soft)} .fl.leak.lit{background:var(--c3-soft)} .fl.node.lit{border-color:var(--pri)}
.fh-in{position:relative;z-index:2;width:100%;max-width:1240px;margin:0 auto;padding-block:48px 64px;padding-left:var(--gut);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:20px;pointer-events:none}
.fh-in > *{pointer-events:auto;max-width:560px}
.fh-in::before{content:"";position:absolute;z-index:-1;left:-10%;top:0;bottom:0;width:70%;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 30% 50%,color-mix(in srgb,var(--bg) 82%,transparent),transparent 75%)}
.kicker{font-size:.95rem;font-weight:600;color:var(--pri)}

.ov-eq [data-hl]:hover{transform:translateY(-3px)}
.ov-eq .y{color:var(--pri)} .ov-eq .i{color:var(--c4)} .ov-eq .l{color:var(--c3)}
.ov-eq .i:hover{background:var(--c4-soft)} .ov-eq .l:hover{background:var(--c3-soft)} .ov-eq .y:hover,.ov-eq .c:hover{background:var(--pri-soft)}

.seg button:hover{color:var(--fg)} .seg button[aria-pressed="true"]:hover{color:var(--bg)}
kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.6;font-weight:500}

.formula{margin:0;font-family:var(--f-mono);font-size:.95rem;line-height:1.7;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-radius:12px;padding:12px 16px;white-space:pre-wrap;overflow-x:auto}
.nbox{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.nb-h{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700}
.nb-h svg{width:15px;height:15px}
.nbox.ex{background:var(--pri-soft)} .nbox.ex .nb-h{color:var(--pri)}
.nbox.trap{background:var(--c3-soft)} .nbox.trap .nb-h{color:var(--c3)}
.nbox.exam{background:var(--c4-soft)} .nbox.exam .nb-h{color:var(--c4)}
.chnext{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}
.chnext .btn svg{width:16px;height:16px}
@media (max-width:980px){
  .chlay{grid-template-columns:minmax(0,1fr);gap:20px}
  .chlay > *{min-width:0}
  .mtitle{font-size:clamp(2.2rem,10vw,3.4rem)}
  .toc{position:static;max-height:none;overflow:visible}
  .toc-l{flex-direction:row;overflow-x:auto;border-left:0;gap:6px;scrollbar-width:none}
  .toc-l button{border:1px solid var(--glass-line);border-radius:99px;margin:0;white-space:nowrap;background:var(--glass)}
  .toc-l button.on{border-color:var(--c)}

}
/* widgets */
.widget{border:1px solid var(--glass-line);background:var(--glass);border-radius:18px;padding:18px;max-width:820px}
.widget:empty{display:none}
.wgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.wgrid{grid-template-columns:1fr}}
.plot{width:100%;height:auto;font-family:var(--f-body)}
.wctl{display:flex;flex-direction:column;gap:14px}
.wctl label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;font-weight:600;color:var(--muted)}
.wctl output{font-family:var(--f-mono);color:var(--fg);font-weight:700}
.wctl input[type=range]{accent-color:var(--c,var(--pri));width:100%}
.wout{margin:0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.wout div{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.wout dt{color:var(--muted)} .wout dd{margin:0;font-family:var(--f-mono);font-weight:700}
.wcap,.wnote{font-size:.86rem;color:var(--muted);margin-top:10px}
.tl{display:flex;gap:0;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:thin}
.tlb{position:relative;flex:1 0 96px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:0;background:none;padding:22px 8px 6px 0;text-align:left}
.tlb::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line-2)}
.tlb i{position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--bg);transition:transform .2s}
.tlb:hover i{transform:scale(1.35)}
.tlb b{font-family:var(--f-mono);font-size:.8rem;color:var(--c)}
.tlb span{font-size:.84rem;font-weight:600;line-height:1.3}
.cmp th[scope=row]{font-family:var(--f-display);font-weight:700;color:var(--fg);text-transform:none;letter-spacing:0;font-size:.9rem;white-space:nowrap}
.cmp td{vertical-align:top;font-size:.9rem}
.cmp thead th{font-size:.74rem}
.circ{width:100%;height:auto;max-width:640px}
/* drills */
.drillbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.drillstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:760px}
.drillstats div{display:flex;flex-direction:column}
.drillstats b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.drillstats span{font-size:.8rem;color:var(--muted)}
.timer{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;max-width:760px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c3),var(--c4),var(--pri))}
.dq,.qzq{max-width:760px;border:1px solid var(--glass-line);background:var(--glass);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;transition:background-color .3s,border-color .3s}
.dq.ok,.qzq.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.dq.bad,.qzq.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.dq :is(.ok,.bad).verdict,.qzq .verdict{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.dqt{font-size:1.15rem;font-weight:600;line-height:1.5;max-width:60ch}
.dq .field{max-width:320px}
.sprintend{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sprintend h2{font-size:2rem}
/* quiz */
.qzsetup,.qzend{max-width:760px;border:1px solid var(--glass-line);background:var(--glass);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.qzsetup h2,.qzend h2{font-size:1.6rem}
.small{font-size:.84rem}
.qzprog{display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--muted)}
.qzprog .mbar{flex:1}
.qzprog .tag{font-weight:700;color:var(--c)}
.qzend .blocks-sum{width:100%}
.qzend .bs{border-color:var(--glass-line)}
.qzend .bs b{color:var(--c)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;width:100%}
.review li{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.rq{font-weight:600}
.ra{display:flex;gap:6px;align-items:flex-start;color:var(--ok);font-weight:600}
.ra svg{width:18px;height:18px;flex:none;margin-top:3px}
/* flashcards */
.fstage{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
.flip{position:relative;width:min(560px,100%);aspect-ratio:16/10;border:0;background:none;padding:0;perspective:1400px;cursor:pointer}
.flip .face{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:28px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.3,.7,.2,1);border:1px solid var(--glass-line)}
.flip .front{background:var(--glass)}
.flip .back{background:var(--c);color:var(--bg);transform:rotateY(180deg)}
.flip.on .front{transform:rotateY(-180deg)} .flip.on .back{transform:rotateY(0)}
.flip em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--c);opacity:.9}
.flip .back em{color:var(--bg);opacity:.75}
.flip b{font-family:var(--f-display);font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.25;letter-spacing:-.01em}
.flip .back b{font-family:var(--f-body);font-weight:600;font-size:clamp(1rem,2.4vw,1.25rem);line-height:1.5}
.flip small{color:var(--faint);font-size:.78rem}
.fact{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* open questions */
.method{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border:1px solid var(--glass-line);background:var(--glass);border-radius:16px;padding:14px 16px;font-size:.9rem;max-width:900px}
.method b{font-family:var(--f-display);margin-right:6px}
.method span{border-radius:99px;padding:4px 11px;background:var(--sunk);counter-increment:m}
.method span::before{content:counter(m) ". ";font-family:var(--f-mono);font-weight:700;color:var(--pri)}
.method{counter-reset:m}
.olist{display:flex;flex-direction:column;gap:30px}
.ogrp{display:flex;flex-direction:column;gap:10px}
.ogrp h2{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.ogrp h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.oitem{display:flex;flex-direction:column;gap:6px;border:1px solid var(--glass-line);background:var(--glass);border-radius:16px;padding:16px 18px;text-decoration:none;max-width:900px;transition:border-color .2s,transform .2s,background-color .2s}
.oitem:hover{border-color:var(--c);transform:translateX(4px)}
.oq{font-weight:600;font-size:1.02rem}
.ometa{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.osc{color:var(--ok);font-weight:700}
.oq-page{max-width:980px}
.oqt{font-size:clamp(1.5rem,3.4vw,2.3rem);letter-spacing:-.02em;line-height:1.2}
.owrite{display:flex;flex-direction:column;gap:10px;border:1px solid var(--glass-line);background:var(--glass);border-radius:18px;padding:18px}
.lbl{font-weight:700;font-size:.9rem}
.owrite textarea{width:100%;min-height:240px;resize:vertical;border:1.5px solid var(--line-2);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;font-size:1rem;line-height:1.6;padding:14px;outline:none}
.owrite textarea:focus{border-color:var(--c)}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.omodel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;scroll-margin-top:calc(var(--hdr) + 20px)}
@media (max-width:820px){.omodel{grid-template-columns:1fr}}
.ochk,.oans{border:1px solid var(--glass-line);background:var(--glass);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ochk h2,.oans h2{font-size:1.2rem}
.ochk h2 span{font-family:var(--f-mono);color:var(--ok);margin-left:6px}
.ochk ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ochk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.94rem;line-height:1.45;padding:6px 8px;border-radius:10px}
.ochk label:hover{background:var(--sunk)}
.ochk input{accent-color:var(--ok);width:18px;height:18px;margin-top:2px;flex:none}
.oans p{line-height:1.65}
/* overview modules */
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.mods{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.mods{grid-template-columns:1fr 1fr}}
.modt{display:flex;flex-direction:column;gap:6px;border:1px solid var(--glass-line);background:var(--glass);border-radius:18px;padding:16px;text-decoration:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .3s,border-color .3s,color .3s,opacity .3s,filter .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modt .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);transition:background-color .3s,color .3s}
.modt .mi svg{width:22px;height:22px}
.modt b{font-family:var(--f-display);font-size:1.15rem;margin-top:4px}
.modt .md{font-size:.84rem;color:var(--muted);line-height:1.45;transition:color .3s}
.modt .ms{margin-top:auto;padding-top:6px;font-size:.78rem;font-weight:700;color:var(--c);font-family:var(--f-mono);transition:color .3s}
.modt:hover{background:var(--c);border-color:var(--c);color:var(--bg);transform:translateY(-5px)}
.modt:hover :is(.md,.ms){color:var(--bg)}
.modt:hover .mi{background:var(--bg);color:var(--c)}
.mods:has(.modt:hover) .modt:not(:hover){opacity:.5;filter:saturate(.3)}
/* header with many sections */
.nav{overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
@media (max-width:1180px){.hdr-in{flex-wrap:wrap;height:auto;padding-block:8px;row-gap:4px}.nav{order:5;width:100%;margin-left:0}.nav a{padding:6px 10px}}
@media (max-width:480px){.nav a[data-route="home"]{display:inline-block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.ov-title .w,.mtitle .w{transform:none}}
/* reveal on scroll (uses translate so it composes with the tilt transform) */
.rv-in{opacity:0;translate:0 22px;transition:opacity .7s cubic-bezier(.2,.8,.2,1),translate .8s cubic-bezier(.2,.8,.2,1),transform .35s cubic-bezier(.2,.8,.2,1),background-color .35s,border-color .35s,color .35s,filter .3s,box-shadow .35s}
.rv-in.rv-on{opacity:1;translate:none}
/* module headers: the circuit, in 3D, behind the title */
.mod{isolation:isolate}
.mod > .mini3d{position:absolute;top:0;right:0;width:min(56%,700px);height:min(470px,64vh);pointer-events:none;z-index:-1;-webkit-mask-image:radial-gradient(ellipse 72% 70% at 58% 50%,#000 50%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 58% 50%,#000 50%,transparent 100%)}
.mini3d canvas{display:block;width:100%;height:100%}
@media (max-width:700px){.mod > .mini3d{width:100%;height:280px;opacity:.45}}
/* tiles lean toward the pointer, with a light under it */
.mods{perspective:1200px}
.modt,.chtile,.tdcard{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.modt:hover{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-5px)}
.chtile:hover{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px)}
.tdcard:hover{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px)}
.modt,.tdcard{position:relative;overflow:hidden}
.tdlist{perspective:1200px}
:is(.modt,.chtile,.tdcard)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(340px circle at var(--gx,50%) var(--gy,50%),rgb(255 255 255 / .2),transparent 62%)}
:is(.modt,.chtile,.tdcard):hover::after{opacity:1}
/* search */
.srch{position:fixed;inset:0;z-index:95;display:flex;justify-content:center;align-items:flex-start;padding:max(10vh,24px) var(--gut-r) 24px var(--gut);background:rgb(0 0 0 / .42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:srIn .18s ease both}
.srch.out{animation:srOut .16s ease both}
@keyframes srIn{from{opacity:0}}
@keyframes srOut{to{opacity:0}}
.srch-panel{width:min(700px,100%);max-height:min(640px,78vh);display:flex;flex-direction:column;border-radius:20px;border:1px solid var(--glass-line);background:color-mix(in srgb,var(--bg) 94%,transparent);box-shadow:0 40px 100px -30px rgb(0 0 0 / .65);overflow:hidden;animation:srPop .26s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes srPop{from{transform:translateY(-10px) scale(.98);opacity:0}}
.srch-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.srch-in svg{width:22px;height:22px;color:var(--muted);flex:none}
.srch-in input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.12rem;color:var(--fg);outline:none}
.srch-in input::-webkit-search-cancel-button{display:none}
.srch-in kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--faint)}
.srch-res{list-style:none;margin:0;padding:8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.srch-res li[data-i]{display:grid;grid-template-columns:118px minmax(0,1fr);gap:0 14px;align-items:baseline;padding:10px 12px;border-radius:12px;cursor:pointer}
.srch-res li[aria-selected="true"]{background:color-mix(in srgb,var(--c) 15%,transparent)}
.srch-res .sk{grid-row:span 2;font-size:.72rem;font-weight:700;color:var(--c)}
.srch-res b{font-weight:600;line-height:1.35}
.srch-res .sw{font-size:.8rem;color:var(--muted)}
.srch-res mark{background:color-mix(in srgb,var(--c) 34%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.srch-none{padding:14px 12px;color:var(--muted);font-size:.95rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srch-none button{border:1px solid var(--line-2);background:transparent;border-radius:99px;padding:4px 11px;font-size:.86rem;font-weight:600;color:var(--fg)}
.srch-none button:hover{border-color:var(--fg)}
.srch-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0;padding:10px 18px;border-top:1px solid var(--line);font-size:.78rem;color:var(--faint)}
@media (max-width:560px){.srch{padding-top:12px}.srch-res li[data-i]{grid-template-columns:1fr}.srch-res .sk{grid-row:auto}.srch-panel{max-height:86vh}.srch-foot span:first-child{display:none}}
#srchBtn .sk2{font-family:var(--f-mono);font-size:.7rem;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.6;margin-left:2px}
@media (max-width:980px){#srchBtn .tl,#srchBtn .sk2{display:none}}
/* recap */
.recap{max-width:1320px}
.recap-tools{gap:8px}
.recap-f{max-width:440px;flex:1 1 260px;padding-left:12px;gap:4px}
.recap-f svg{width:18px;height:18px;color:var(--muted);flex:none}
.recap-f input{font-family:var(--f-body);font-size:.96rem}
.rc{display:flex;flex-direction:column;gap:44px}
.rc-ch h2{display:flex;align-items:baseline;gap:14px;font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.03em;margin-bottom:16px;border-bottom:2px solid var(--c);padding-bottom:10px}
.rc-ch h2 .num{font-family:var(--f-display);color:var(--c)}
.rc-cols{columns:3 300px;column-gap:22px}
.rc-sec{break-inside:avoid;margin-bottom:22px;display:flex;flex-direction:column;gap:6px}
.rc-sec h3{font-size:.82rem;font-weight:700;color:var(--c)}
.rc-it{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass);text-decoration:none;break-inside:avoid;transition:border-color .2s,transform .2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rc-it:hover{border-color:var(--c);transform:translateX(3px)}
.rc-it b{font-family:var(--f-display);font-size:1rem;line-height:1.25}
.rc-it span{font-size:.88rem;color:var(--muted);line-height:1.45}
.rc-it code{font-family:var(--f-mono);font-size:.76rem;white-space:pre-wrap;color:var(--fg);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:8px;padding:6px 8px;margin-top:4px}
@media print{
  .hdr,.aura,.mini3d,.recap-tools,.recap-n,.fsinv,.credit,.foot,#live{display:none!important}

  .mod{padding:0}
  .mhead .lede{display:none}

}
/* micro-interactions */
.burst{position:fixed;z-index:80;pointer-events:none;width:0;height:0}
.burst i{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;animation:burst .75s cubic-bezier(.15,.8,.25,1) both}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.9);opacity:0}}
.bump{display:inline-block;animation:bump .45s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{40%{transform:scale(1.35)}}
.fdeck{position:relative;width:min(560px,calc(100% - 24px));isolation:isolate}
.fdeck .flip{width:100%;display:block}
.fdeck::before,.fdeck::after{content:"";position:absolute;inset:0;border-radius:22px;border:1px solid var(--glass-line);background:var(--glass);z-index:-1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.fdeck::before{transform:translate(9px,10px) rotate(1.8deg)}
.fdeck::after{transform:translate(18px,20px) rotate(3.6deg);opacity:.55}
.fdeck[data-n="0"]::before,.fdeck[data-n="0"]::after,.fdeck[data-n="1"]::after{display:none}
@media (max-width:600px){.fdeck::before{transform:translate(6px,8px) rotate(1.4deg)}.fdeck::after{transform:translate(12px,15px) rotate(2.8deg)}}
.flip.enter{animation:cardIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{transform:translate(9px,10px) rotate(1.8deg) scale(.985);opacity:.4}}
.flip.fly-r{transition:transform .26s cubic-bezier(.5,0,.9,.5),opacity .26s;transform:translateX(75%) rotate(12deg);opacity:0}
.flip.fly-l{transition:transform .26s cubic-bezier(.5,0,.9,.5),opacity .26s;transform:translate(-35%,8px) rotate(-8deg) scale(.92);opacity:0}
/* page changes (also between pages: hub ⇄ labs) */
@view-transition{navigation:auto}
.hdr{view-transition-name:hdr}
::view-transition-old(root){animation:vtOut .18s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:vtIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(14px)}}
/* theme switch: circular reveal from the button */
html.theme-vt .hdr{view-transition-name:none}
html.theme-vt::view-transition-old(root){animation:none}
html.theme-vt::view-transition-new(root){animation:themeReveal .65s cubic-bezier(.45,0,.2,1)}
@keyframes themeReveal{from{clip-path:circle(0 at var(--tx,90%) var(--ty,30px))}to{clip-path:circle(150vmax at var(--tx,90%) var(--ty,30px))}}


/* full-screen invitation */
.fsinv{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:10px 10px 10px 16px;border-radius:16px;border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 18px 50px -20px rgb(0 0 0 / .45);color:var(--fg);transform:translate(-50%,140%);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.25,1.15),opacity .35s}
.fsinv.show{transform:translate(-50%,0);opacity:1}
.fsinv svg{width:20px;height:20px;flex:none}
.fsinv p{margin:0;font-size:.9rem;line-height:1.35}
.fsinv p b{font-weight:700}
.fsinv .go{border:0;border-radius:11px;padding:9px 14px;font:inherit;font-size:.88rem;font-weight:700;background:var(--fg);color:var(--bg);white-space:nowrap;cursor:pointer}
.fsinv .go kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid currentColor;border-radius:5px;padding:0 4px;margin-left:6px;opacity:.6}
.fsinv .x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 6px;cursor:pointer}
.fsinv .x:hover{color:var(--fg)}
@media (max-width:520px){.fsinv{left:16px;right:16px;max-width:none;transform:translateY(140%)}.fsinv.show{transform:none}.fsinv p{flex:1;min-width:0}.fsinv p span{display:none}.fsinv .go kbd{display:none}}
@keyframes fspulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fg) 0%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--fg) 22%,transparent)}}
.fs-pulse{animation:fspulse 1.1s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.fsinv{transition:none}.fs-pulse{animation:none}}

/* switching theme: the new colours spread from the button in a circle (where the browser can) */

const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- full screen that survives page changes ----------

const FS = (() => {

  const EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  function openShell(url){
    let f = document.getElementById("nxShell");
    if (!f){
      const st = document.createElement("style");
      st.textContent = "html.shelled,html.shelled body{overflow:hidden!important}html.shelled body>:not(#nxShell){display:none!important}#nxShell{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483647;background:transparent}";
      document.head.append(st);
      f = document.createElement("iframe"); f.id = "nxShell"; f.title = "Nexus"; f.allow = "fullscreen";
      f.addEventListener("load", () => { try { document.title = f.contentDocument.title; } catch (e) {} });
      document.body.append(f); document.documentElement.classList.add("shelled");
    }
    f.src = url;
  }
  if (!framed){
    document.addEventListener("click", e => {
      if (!isOn() || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest && e.target.closest("a[href]"); if (!a || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
      const u = new URL(a.href, location.href);
      if (u.origin !== location.origin || (u.pathname === location.pathname && u.search === location.search)) return;
      e.preventDefault(); openShell(u.href);

  }

    if (!can){ btn.hidden = true; return; }
    const paint = () => { const on = isOn(); btn.innerHTML = (on ? EXIT : ENTER) + `<span class="tl">${on ? "Exit full screen" : "Full screen"}</span>`; btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen (F)"); btn.title = on ? "Exit full screen (F or Esc)" : "Full screen (F)"; btn.setAttribute("aria-pressed", String(on)); };
    btn.addEventListener("click", toggle);
    d.addEventListener("fullscreenchange", paint); d.addEventListener("webkitfullscreenchange", paint);
    addEventListener("pagehide", () => { d.removeEventListener("fullscreenchange", paint); d.removeEventListener("webkitfullscreenchange", paint); });
    document.addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey && !(e.target.closest && e.target.closest("input,textarea,select,[contenteditable]"))){ e.preventDefault(); toggle(); } });
    paint();
  }

  /* a small invitation, once per session, on devices that allow full screen */
  function invite(btn, delay = 1400){
    if (!can || framed || isOn()) return;
    try { if (sessionStorage.getItem("nexus-fs-inv")) return; } catch (e) {}
    const done = () => { try { sessionStorage.setItem("nexus-fs-inv", "1"); } catch (e) {} };
    setTimeout(() => {
      if (isOn() || !btn.isConnected) return;

})();


/* ---------- background colour that follows the scroll ----------
   Two or three colours, blended in OKLab so the fade looks even. The last colour is reached at `end` of the scroll
   and then stays. */
function scrollTint(getStops, getStart, end = 0.85, onTint = null){
  const root = document.documentElement;
  const dark = () => { const t = root.dataset.theme; return t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches); };
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const gam = c => { c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.round(Math.min(1, Math.max(0, c)) * 255); };
  const toLab = h => { const [r, g, b] = [1, 3, 5].map(i => lin(parseInt(h.slice(i, i + 2), 16)));
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s]; };
  const toRGB = ([L, A, B]) => { const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3, m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3, s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
    return [gam(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s), gam(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s), gam(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)]; };
  let raf = 0;
  function upd(){
    raf = 0;
    const stops = getStops(dark());
    if (!stops){ root.style.removeProperty("--bg"); root.style.removeProperty("--scrim"); if (onTint) onTint([0, 0, 0]); return; }
    const start = getStart(), span = Math.max(1, (root.scrollHeight - innerHeight) * end - start);
    const p = Math.min(1, Math.max(0, (scrollY - start) / span)), e = p * p * (3 - 2 * p);
    const x = e * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
    const a = toLab(stops[i]), b = toLab(stops[i + 1]), c = toRGB(a.map((v, k) => v + (b[k] - v) * f));
    root.style.setProperty("--bg", `rgb(${c.join(" ")})`); root.style.setProperty("--scrim", c.join(" "));
    if (onTint) onTint(c);
  }
  const q = () => { if (!raf) raf = requestAnimationFrame(upd); };
  addEventListener("scroll", q, { passive: true }); addEventListener("resize", q); addEventListener("nexus-theme", q);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", q);
  q(); return q;
}


/* ---------- colour aura that follows the pointer (leaf → ochre → rose across the screen) ---------- */
const AURA = (() => {
  const el = document.createElement("div"); el.className = "aura"; el.setAttribute("aria-hidden", "true"); document.body.prepend(el);
  const st = { x: innerWidth * .7, y: innerHeight * .4, tx: innerWidth * .7, ty: innerHeight * .4 }; let raf = 0, on = false;
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const hx = h => [1, 3, 5].map(i => parseInt(h.trim().slice(i, i + 2), 16));
  function tick(){
    raf = 0; st.x += (st.tx - st.x) * .09; st.y += (st.ty - st.y) * .09;
    const cs = getComputedStyle(document.documentElement), f = Math.min(1, Math.max(0, st.x / innerWidth));
    const c = f < .5 ? mix(hx(cs.getPropertyValue("--pri")), hx(cs.getPropertyValue("--c4")), f * 2) : mix(hx(cs.getPropertyValue("--c4")), hx(cs.getPropertyValue("--c3")), f * 2 - 1);
    el.style.setProperty("--ax", st.x + "px"); el.style.setProperty("--ay", st.y + "px"); el.style.setProperty("--ac", `rgb(${c.join(" ")})`);
    if (on && (Math.abs(st.tx - st.x) > .5 || Math.abs(st.ty - st.y) > .5)) raf = requestAnimationFrame(tick);
  }
  addEventListener("pointermove", e => { if (!on || e.pointerType !== "mouse") return; st.tx = e.clientX; st.ty = e.clientY; if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });
  addEventListener("scroll", () => { if (!on || matchMedia("(hover: hover)").matches) return; const p = scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight); st.tx = innerWidth * (.15 + .7 * p); st.ty = innerHeight * (.3 + .4 * p); if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });
  return { set(v){ on = v; el.hidden = !v; if (v && !raf) raf = requestAnimationFrame(tick); } };
})();


const RI = (a, b, s = 1) => a + s * Math.floor(Math.random() * ((b - a) / s + 1));
const PICK = a => a[Math.floor(Math.random() * a.length)];

      line: "The capacity of an (eco)system to absorb a pressure or disturbance without a major change in its structure, and to return to its initial state once the disturbance has gone.",
      points: ["It depends on feedback loops that stabilize the system's key variables (balancing loops)."] },
    { id: "e-tipping", title: "Tipping point",
      line: "A level of pressure beyond which the (eco)system reorganizes, often fast and non-linearly, and does not return to its initial state even if the pressure is reduced.",
      points: ["Beyond a critical threshold, the balance between amplifying and regulating loops breaks (some loops may even disappear).", "The system shifts quickly to a new equilibrium state."],
      trap: "A tipping point is not just \"a lot of damage\": the defining feature is that removing the pressure does not bring the system back." },
    { id: "e-climate", title: "The climate system and its tipping elements",
      line: "Atmosphere, hydrosphere and cryosphere, lithosphere and biosphere, and their interactions, determine the climate. It is resilient to warming, but only up to climate tipping points.",
      points: ["Tipping elements can be ecosystems (Greenland ice sheet, Amazon rainforest) or climate phenomena (thermohaline circulation in the Atlantic, Indian summer monsoon).", "Identified by Lenton et al. (2008)."] },
    { id: "e-cascade", title: "Tipping cascades",
      line: "Tipping points are hard to locate precisely, and a domino effect cannot be ruled out from 1.5 to 2.0°C of warming.",
      example: "Greenland ice sheet melts → massive freshwater inflow into the North Atlantic → slowdown of the Atlantic thermohaline circulation (Wunderling et al., 2024).",
      exam: "The more warming, the higher the risk of several tipping events in quick succession." }
  ] },
  { title: "The Great Acceleration and the Anthropocene", widget: "accel", cards: [
    { id: "e-acceleration", title: "The Great Acceleration",
      line: "The sharp amplification of human-driven processes causing global environmental change in the industrial age, especially since the mid-20th century.",
      points: ["Socio-economic trends shoot up together after 1950: population, real GDP, energy use, fertilizers, water use, dams, transport, telecommunications, tourism…", "Earth system trends follow: CO₂, methane and nitrous oxide concentrations, surface temperature, ocean acidification, fish capture, tropical forest loss, domesticated land…"] },
    { id: "e-anthropocene", title: "The Anthropocene",
      line: "A proposed new geological epoch in which the processes and conditions of life on Earth are profoundly changed by human activities.",
      points: ["Coined in the 1980s by the biologist Eugene Stoermer, popularized in 2000 by the chemist Paul Crutzen.", "Not formally recognized as an official stratigraphic unit by the International Commission on Stratigraphy, but widely accepted and used by climate scientists and geologists."] },
    { id: "e-holocene", title: "The Holocene",
      line: "The geological epoch of relative climatic stability of the last ~11,700 years, which the Anthropocene would follow.",
      points: ["Without human disturbance it would have lasted several thousand more years.", "It allowed agriculture and great civilizations to develop: environmental stability is a key factor of human development.", "Hence the question: what level of human-driven change could take us out of a Holocene-like state? Answer: the planetary boundaries."] }
  ] }
  ] },

{ id: "bounds", n: 4, title: "Planetary boundaries, warming and biodiversity", short: "Planetary boundaries", c: "var(--pri)",
  intro: "The nine planetary boundaries and how many are crossed, the two core ones (global warming and biodiversity loss), and what warming means for a business, with the case of cocoa.",
  sections: [
  { title: "The planetary boundaries", widget: "pb", cards: [
    { id: "b-question", title: "Which limits keep the Earth Holocene-like?",
      line: "Limits are inherent to ecology. The Holocene is the only state we know for sure is favourable to humanity, so which limits must we not exceed?",
      points: ["Meadows (1972) already said we do not know the precise limits, but we know there is an upper limit.", "In 2009, a team linked to the Stockholm Resilience Centre set out to quantify them (Rockström et al., 2009)."] },
    { id: "b-pb", title: "Planetary boundaries",
      line: "Nine quantified boundaries linked to Earth-system processes. Below them, humanity stays in a \"safe operating space\"; the further a boundary is crossed, the higher the risk of lasting damage to living conditions.",
      points: ["1 Biodiversity loss (biosphere integrity).", "2 Global warming (climate change).", "3 Biogeochemical cycles disrupted by fertilizers (nitrogen, phosphorus).", "4 Ocean acidification.", "5 Ozone layer depletion.", "6 Freshwater cycle.", "7 Land-use change.", "8 Aerosols in the atmosphere.", "9 Release of novel entities (e.g. plastics, chemicals)."],
      trap: "The exact wording of the nine boundaries varies between reports. Learn the processes, not one exact phrasing." },
    { id: "b-upstream", title: "Boundaries are set before the tipping points",
      line: "A boundary is not the tipping point itself: it is placed upstream of it, leaving a buffer.",
      points: ["Green zone: the safe operating space. Yellow: a zone of uncertainty with increasing risk. Red: high risk of serious impacts.", "The buffer accounts for uncertainty about where the threshold lies, and gives society time to react to early warning signs (Steffen et al., 2015)."] },
    { id: "b-core", title: "Core boundaries",
      line: "The boundaries are linked, so crossing one can threaten the others. Two are connected to all the others: global warming and biodiversity loss.",
      points: ["Scientists call them \"core boundaries\" (Steffen et al., 2015)."] },
    { id: "b-status", title: "Seven of nine boundaries are crossed",
      line: "2009: three crossed (biodiversity, climate, nitrogen cycle). 2015: land-use change. 2022: novel entities. 2023: freshwater. 2025: ocean acidification.",
      points: ["Still within: ozone layer depletion and atmospheric aerosols.", "We are close to a \"high-risk line\".", "Living conditions will almost certainly change profoundly in the coming decades, but the scale depends on our pressures: \"every degree, even every tenth of a degree, counts\"."],
      exam: "Learn the order of the crossings with their years: it is typical of the empirical facts the exam asks for." }
  ] },
  { title: "Global warming", cards: [
    { id: "b-weather", title: "Weather and climate",
      line: "Weather is the state of the atmosphere at a given moment; climate is its average state over a long period (e.g. 30 years).",
      example: "A 5°C drop during the day is nothing. A 5°C drop in the average temperature would mean a very different world.",
      trap: "A cold winter does not disprove global warming: one moment of weather says nothing about the climate." },
    { id: "b-figures", title: "How much warmer",
      line: "Over 2018–2022, the global average temperature was 1.17 ± 0.13°C above the pre-industrial era (1850–1900), and it rises about +0.26°C per decade." },
    { id: "b-process", title: "Where warming comes from",
      line: "Human economic activity emits GHG (fossil fuels, industry, land use) → concentrations of CO₂, methane and nitrous oxide rise → the greenhouse effect strengthens → temperatures rise.",
      points: ["The consequences are many and depend on the extent of warming (IPCC, 6th report)."] }
  ] },
  { title: "Biodiversity loss", widget: "drivers", cards: [
    { id: "b-bio3", title: "Three types of biodiversity",
      line: "Genetic diversity (genes within a species), species diversity, and ecosystem diversity (living environments). All three are falling because of human activity." },
    { id: "b-sixth", title: "A sixth mass extinction",
      line: "The global extinction rate is at least tens to hundreds of times higher than the average of the last 10 million years, and it is accelerating.",
      points: ["Consequences: less resilient ecosystems, disrupted pollination, fewer food resources, spread of diseases."] },
    { id: "b-drivers", title: "The five direct drivers (IPBES)",
      line: "Land- and sea-use change, direct exploitation of organisms, climate change, pollution, invasive alien species.",
      points: ["Behind them, indirect drivers: demographic and sociocultural, economic and technological, institutions and governance, conflicts and epidemics.", "IPBES examples of decline: natural ecosystems down 47% on average; about 25% of species threatened with extinction; wild mammal biomass down 82%."] }
  ] },
  { title: "Warming and business: cocoa", widget: "cocoa", cards: [
    { id: "b-cocoa", title: "How warming hits the chocolate industry",
      line: "About 60% of the world's cocoa comes from Côte d'Ivoire and Ghana, where extreme weather spreads diseases and cuts harvests.",
      formula: "Global average temperature → (+) extreme weather (torrential rains, droughts) → (+) viral diseases and fungi → (−) cocoa production → (−) cocoa price → (+) chocolate price → (−) chocolate consumption",
      points: ["Age of cocoa trees → (−) cocoa production.", "Global average temperature → (+) summer temperatures in chocolate-consuming countries → (−) chocolate consumption."] },
    { id: "b-lindt", title: "What a company can do: Lindt & Sprüngli",
      line: "\"Climate change is a strategic risk that requires action across our business\" (Climate Transition Plan, 2025).",
      points: ["Reduce the company's carbon footprint.", "Hedge, where possible, against sudden rises in cocoa purchase prices.", "Develop agroforestry.", "Innovate in products."],
      exam: "For any company, split measures into mitigation (cut its own emissions) and adaptation (protect supply, prices, products)." }
  ] }
  ] },

{ id: "social", n: 5, title: "The Doughnut, poverty and inequality", short: "Social challenges", c: "var(--c3)",
  intro: "The Doughnut adds a social floor to the planetary boundaries. Then the two social challenges of the course: poverty, absolute and relative, and inequality, with the ways they are measured.",
  sections: [
  { title: "The Doughnut model", widget: "doughnut", cards: [
    { id: "o-doughnut", title: "The Doughnut (Kate Raworth, 2012)",
      line: "A framework that combines the planetary boundaries with social justice: an ecological ceiling not to exceed, and a social foundation not to fall below.",
      points: ["Between the two lies the ring-shaped \"safe and just space for humanity\".", "The social foundation had 11, then 12 dimensions, inspired by the social priorities of Rio+20.", "Published as an Oxfam paper: \"A safe and just space for humanity: can we live within the doughnut?\""] },
    { id: "o-dims", title: "The two boundaries of the Doughnut",
      line: "Social foundation (12): food, health, education, income and work, peace and justice, political voice, social equity, gender equality, housing, networks, energy, water.",
      points: ["Ecological ceiling (9): climate change, ocean acidification, chemical pollution, nitrogen and phosphorus loading, freshwater withdrawals, land conversion, biodiversity loss, air pollution, ozone layer depletion.", "Inside the ring: shortfall (below the foundation). Outside: overshoot (beyond the ceiling)."] },
    { id: "o-2025", title: "The Doughnut in 2025 (Doughnut 3.0)",
      line: "Seven of nine planetary boundaries crossed, and shortfalls, sometimes large, on every dimension of the social foundation. Progress exists but is \"modest\".",
      points: ["No country operates within the safe and just space.", "The richest 20% of countries (15% of the world population) cause over 40% of ecological overshoot.", "The poorest 40% of countries (42% of the population) bear over 60% of social shortfalls (Fanning and Raworth, 2025)."],
      exam: "Use these figures against the claim \"our economy has at least solved the main social problems\"." }
  ] },
  { title: "Poverty", widget: "living", cards: [
    { id: "o-poverty", title: "Poverty",
      line: "A state of deprivation in which a person lacks the resources needed to live adequately.",
      points: ["The two most common definitions: absolute monetary poverty (the World Bank's extreme poverty) and relative monetary poverty (France, EU).", "Others exist: multidimensional poverty (Amartya Sen), poverty as dependence on assistance (Georg Simmel), and indicators such as poverty intensity."] },
    { id: "o-absolute", title: "Absolute monetary poverty: extreme poverty",
      line: "Living on less than the international poverty line of US$3.00 a day in PPP terms (raised in May 2024 from $2.15): the estimated income needed for vital goods.",
      points: ["Two more thresholds: $4.20 and $8.30 a day.", "2025: 10.1% of the world, about 831 million people.", "Since 1950 it has fallen sharply almost everywhere, but it stays very high in Sub-Saharan Africa (about 44%)."],
      trap: "Absolute poverty ignores context: the same $3.00 line applies everywhere, whatever the cost of a decent life in that society." },
    { id: "o-relative", title: "Relative monetary poverty",
      line: "A person is poor if their standard of living is below the country's poverty line, usually 60% of the median standard of living.",
      points: ["It measures the inability to buy the goods needed for a normal life in that context.", "Used by Eurostat and most European countries.", "France, 2024: poverty line €1,337 a month; poverty rate 15.4%."],
      example: "Absolute = vital goods, regardless of context. Relative = essential goods for a decent life in a given society." },
    { id: "o-living", title: "Standard of living and consumption units",
      line: "Standard of living = household disposable income ÷ number of consumption units (CU). Everyone in the household has the same standard of living.",
      formula: "Disposable income = income − mandatory payments (income tax, CSG, CRDS…)\nCU: 1 for the first adult, 0.5 per other person aged 14+, 0.3 per child under 14\nStandard of living = disposable income ÷ CU",
      points: ["Income counts earnings, asset income (interest, dividends, rents), pensions and unemployment benefits, and social benefits."],
      example: "2 adults and a 9-year-old: €3,000 − €300 = €2,700; CU = 1 + 0.5 + 0.3 = 1.8; standard of living = €1,500 a month, above the €1,337 line." },
    { id: "o-line", title: "The poverty line",
      line: "60% of the median standard of living: the level that splits the population in two halves.",
      points: ["France: median €2,228 a month, so the line is about €1,337.", "Poverty in France is lower than in the early 1970s; it fell sharply in the 1970s, then stabilized (Insee changed its method in 1996)."] },
    { id: "o-drivers", title: "Who is poor? Drivers of poverty",
      line: "In Centre-Val de Loire (Insee, 2021), the drivers are largely the same in rural and urban areas.",
      points: ["Single-parent families are the most affected.", "The chart compares household types: single-parent families, people living alone, tenants and owners, large households, young and old households.", "Older people and homeowners are less affected."] }
  ] },
  { title: "Inequality", widget: "lorenz", cards: [
    { id: "o-ineq", title: "Poverty is not inequality",
      line: "Poverty is about the situation of the people at the bottom. Inequality is about the gaps across the whole distribution.",
      example: "Everyone can get richer while inequality rises; poverty can fall while the top captures most of the growth." },
    { id: "o-palma", title: "Palma index",
      line: "The income of the richest 10% divided by the income of the poorest 40%.",
      formula: "Palma = income share of the top decile ÷ income share of the bottom 40%",
      example: "France 1.08 (2019); United States 1.63 (2021)." },
    { id: "o-gini", title: "Gini coefficient",
      line: "From 0 (perfect equality) to 1 (perfect inequality).",
      points: ["It measures how far the Lorenz curve (cumulative share of income held by the cumulative share of people) is from the line of perfect equality."],
      example: "France 0.292 (2019); United States 0.375 (2021)." },
    { id: "o-paygap", title: "Gaps between groups: the gender pay gap",
      line: "In France's private sector (2022), women earn 24% less across all working hours, 15% less for the same working hours, and 4% less for comparable hours and jobs.",
      exam: "Read the three figures as a decomposition: working time explains part of the gap, differences in jobs another part, and about 4% remains at equal hours and jobs." },
    { id: "o-trend", title: "Inequality since 1980",
      line: "The income share of the top 10% has risen in most major regions since 1980.",
      points: ["Around 2018: India about 55%, United States and Russia about 46–48%, China about 41%, Europe about 34% (the lowest)."] },
    { id: "o-why", title: "Why care about inequality, not only poverty?",
      line: "Across rich countries, more unequal societies have worse health and social problems.",
      points: ["The index combines life expectancy, numeracy and literacy, infant mortality, homicides, imprisonment, teenage births, trust, obesity, mental health and addiction, and social mobility.", "The USA and Portugal are at the unequal, worse end; Japan and the Nordic countries at the equal, better end."],
      trap: "This is a correlation across countries. It corroborates a link, it does not prove that inequality causes every problem." }
  ] }
  ] },

{ id: "economy", n: 6, title: "Our economic model", short: "Economic model", c: "var(--c1)",
  intro: "The third pillar: what an economy, a market, capitalism and a market economy are, why growth divides sustainability thinkers, and four scenarios for France in 2050.",
  sections: [
  { title: "Four words not to confuse", widget: "words", cards: [
    { id: "c-economy", title: "Economy",
      line: "From the Greek oikos (house, property) and nomos (law, rule): household management. All human activities that produce, store and distribute goods and services.",
      points: ["Several economic models exist: traditional economy, feudal economy, capitalism… Capitalism is one model among others.", "By extension, \"economics\" studies how economies work (e.g. the law of supply and demand), with several schools of thought."] },
    { id: "c-market", title: "Market",
      line: "A place, physical or virtual, where actors exchange goods, capital or labour for money.",
      points: ["Different from the abstract \"Market\" (capital M): the idea that prices and quantities emerge from competitive supply and demand, the Market as an institution (Gomez, 2022).", "Market exchanges are older than capitalism.", "They are one way among others to obtain goods: production for one's own use, or the gift economy (give, receive, return)."] },
    { id: "c-capitalism", title: "Capitalism",
      line: "An economic system in which market exchanges coexist with the possibility of investing money in the hope of making more money (Fulcher, 2015).",
      points: ["Merchant capitalism from the 17th century: the English East India Company, joint-stock companies, stock exchanges.", "Industrial capitalism from the early 19th century, with cotton mills in England: a bourgeoisie owning the means of production, and a proletariat.", "Its rise goes with economic growth, measured by GDP. Some argue growth is inherent to it: a \"growth imperative\"."],
      trap: "Markets alone are not capitalism: the defining addition is investing money to make more money." },
    { id: "c-marketeco", title: "Market, mixed and planned economies",
      line: "In a market economy, the supply of goods and their prices are set by free market forces, not by the state.",
      points: ["Planned economy: the state decides what to produce, plans volumes and sets prices.", "Mixed economy: elements of both."] }
  ] },
  { title: "The growth debate", widget: "growth", cards: [
    { id: "c-gdp", title: "Growth and its pressure",
      line: "World GDP was almost flat for 2,000 years, then exploded, above all after 1950.",
      points: ["This growth went with the Great Acceleration: seven of nine boundaries crossed, while shortfalls remain on all social dimensions of the Doughnut.", "Some actors must already adapt (the chocolate industry), governments reform (decarbonizing energy), but changes must scale up a lot."] },
    { id: "c-meadowsvbrund", title: "Meadows versus Brundtland on growth",
      line: "Meadows (1972) proposed a non-growing state of constant population and capital, called \"equilibrium\". Brundtland (1987) called for a new era of growth, socially and environmentally sustainable, seen as essential to relieve poverty." },
    { id: "c-four", title: "Four positions on growth",
      line: "Brown growth, green growth, selective growth, degrowth.",
      points: ["Brown growth: growth continues as now, on fossil fuels and a linear economy. Foundations: climate scepticism, economic libertarianism, techno-solutionism (\"Drill, baby, drill\").", "Green growth: growth decoupled from environmental pressure enough to stay within the boundaries. Techno-optimism, economic liberalism, weak sustainability (OECD, 2011).", "Selective growth: growth differentiated by countries' wealth and by sectors. Techno-scepticism, reformist environmentalism, strong sustainability (Jackson, 2009).", "Degrowth: abandon growth as a primary goal, or deliberately reduce production and consumption where needed. Techno-criticism, anti-capitalism, strong sustainability (Latouche, 2024)."],
      exam: "Weak sustainability assumes natural capital can be replaced by produced capital; strong sustainability holds that critical natural capital cannot be replaced. (These two terms are named on the slides; this gloss is ours.)" }
  ] },
  { title: "Four scenarios for 2050 (ADEME)", widget: "ademe", cards: [
    { id: "c-ademe", title: "ADEME's Transition(s) 2050",
      line: "The French Agency for Ecological Transition built four contrasting paths to carbon neutrality, from sobriety to technology.",
      points: ["S1 Frugal generation: frugality chosen but also imposed, local, low-tech, meat ÷3, mobility −⅓, little international cooperation, new prosperity indicators.", "S2 Regional cooperation: sharing economy, fairness, meat halved, managed mobility (−17%), environmental taxation, qualitative growth.", "S3 Green technologies: new technologies rather than less consumption, meat −30%, demolition and rebuilding, data centres ×10, targeted carbon tax, green growth.", "S4 Restoration gamble: mass consumption kept, nature a resource, bet on repairing damage (carbon capture and storage), mobility +28%, carbon-based growth."],
      exam: "One way to use them in an answer (our reading, not the slides'): S1 is closest to degrowth, S2 to selective growth, S3 to green growth, and S4 bets on technology to keep a carbon-based growth." },
    { id: "c-friction", title: "Changing behaviours",
      line: "Even a good scenario needs people to change behaviour: find the barriers (cost, habits, no alternative) and reduce the friction (infrastructure, price signals, rules, norms)." }
  ] }
  ] },

{ id: "method", n: 7, title: "Building a cause tree (tutorial)", short: "Cause tree", c: "var(--c4)",
  intro: "The graded group exercise: explain a social fact (the gender pay gap) with a causal diagram, present it clearly, then corroborate or refute each link with reliable sources.",
  sections: [
  { title: "The gender pay gap", cards: [
    { id: "m-facts", title: "The facts",
      line: "Insee (2026): in 2024, women's average net wage income in the private sector was 21.8% lower than men's.",
      points: ["It is a gap between two averages: it does not mean every woman earns less than every man.", "It only covers people in employment. The gender overall earnings gap (GOEG), which includes those without a job, is higher: about 29.6% in France in 2023, over 40% in some countries."] },
    { id: "m-tree", title: "Cause tree",
      line: "A causal diagram that explains a social phenomenon or an empirical observation: it maps the causes, not the consequences.",
      points: ["Start from the phenomenon (on the right) and go back to the variables that influence it directly, then indirectly.", "Each arrow carries a sign; each variable is a quantity that can rise or fall."] },
    { id: "m-steps", title: "The three steps of the assignment",
      line: "Build (20 min), present (45 min), test with evidence (20 min).",
      points: ["Build: think alone (~5 min), share ideas (~5 min), turn them into a causal diagram (~10 min).", "Present: ~5 minutes per group, then questions.", "Evidence: revise, then corroborate or refute the hypotheses; share one finding and one uncertainty with the class."] }
  ] },
  { title: "An example: homicides in the United States", widget: "homicide", cards: [
    { id: "m-homicide", title: "Explaining the US homicide rate",
      line: "In 2021 the US homicide rate was 6.8 per 100,000, six times France's. The illustrative cause tree maps direct and indirect causes.",
      points: ["Unemployment → (+) poverty; share of low-paid jobs → (+) poverty; development of the welfare system → (−) poverty.", "Poverty → (+) organised crime, (+) drug addiction, (+) homicides directly.", "Drug addiction → (+) organised crime and (+) homicides; organised crime → (+) homicides.", "Permissiveness of gun legislation → (+) gun ownership → (+) homicides."] }
  ] },
  { title: "Presenting it well", cards: [
    { id: "m-present", title: "What makes a good presentation",
      line: "Summarize first, stay understandable without the visual, explain each link, refer to other groups, answer briefly.",
      points: ["Overview first: \"we think the gap depends on four main mechanisms…\".", "Independence from the visual: people at the back cannot read your sheet.", "For each link, say why it is plausible: naming the link is not enough.", "Refer to other presentations: \"like groups 2 and 4, but our reasoning differs…\".", "Answer questions clearly and concisely."] }
  ] },
  { title: "Corroborate or refute", cards: [
    { id: "m-corroborate", title: "Corroborating a causal link",
      line: "A causal link is rarely proved with certainty, but evidence can make it more or less plausible: corroborate (support) or refute it.",
      example: "Studies on the disinhibiting effects of some drugs, or a correlation between drug use and crime (Martel-Perron; Poullot et al., 2008), do not prove drug addiction causes homicides, but they corroborate it.",
      points: ["Mark each link: corroborated, refuted, or uncertain."] },
    { id: "m-sources", title: "Reliable sources",
      line: "Evidence must be credible: trace each piece of information back to its primary source and check that source.",
      points: ["Reliable: statistics and polling institutes (Insee, ONS, Gallup), academic articles (Google Scholar), books by recognized authors or publishers, established media (The New York Times, The Guardian, Le Monde), government websites (.gov, .gouv.fr).", "Unreliable: social media posts, personal blogs, conspiracy websites or channels, pseudoscientific books and magazines."] }
  ] }
  ] }
];

/* Exam-style multiple choice. The right answer is o[0] in the data; options are shuffled on screen. */
