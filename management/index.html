const OPEN = [
{ id: "q1", ch: "org", src: "slides", min: 8, q: "What distinguishes an organization from a crowd, a group or a team?",
  points: ["Crowd: mere co-presence", "Group: interactions and sense of belonging", "Team: common task or goal and interdependence", "Organization: the five criteria (common goals, coordination, roles, rules or norms, continuity)", "Key: stable, institutionalized coordination", "A concrete example for each level"],
  model: ["Each form adds something to the previous one. A crowd is only co-presence: people waiting at the same bus stop. A group adds interactions and a sense of belonging, like friends who meet every week. A team adds a common task or goal and interdependence: four students preparing one presentation need each other's work.", "An organization meets five criteria: common goals, coordination of the work, roles (who does what and who decides), rules or norms, and a minimum of continuity. A team becomes organizational when pursuing its goals requires relatively stable, institutionalized coordination, for example a student association with a board, statutes and events every year."] },
{ id: "q2", ch: "org", src: "slides", min: 10, q: "Why do we study different managerial approaches and theories? How does it help us become better managers? Give concrete examples.",
  points: ["Intuitions feel obvious but are often wrong", "Theory → hypothesis → evidence", "Theories organize ideas, explain, predict and help influence behavior", "Different theories give different diagnoses, hence different solutions", "Example: handwashing (TPB, values, social learning, reinforcement, memory)", "Example of a wrong intuition (\"a raise motivates\")"],
  model: ["Managers act on assumptions, and many feel obvious but are flawed: \"give them a raise and they will be motivated\" ignores that, for Herzberg, pay is a hygiene factor. Theories move us from intuition to evidence: a structured explanation produces testable hypotheses that data confirm or correct. They help us understand, predict and influence behavior.", "Studying several theories matters because each one points to a different cause. If employees do not wash their hands, the Theory of Planned Behavior asks whether they think it matters, whether it is expected and whether soap is available; values theory asks whether cleanliness matters to them; social learning asks whether it was modeled; reinforcement asks whether it was ever rewarded; memory theories ask whether they simply forget. Each diagnosis leads to a different fix (a poster, a dispenser, a reminder), so a manager who knows several theories chooses solutions that address the real cause."] },
{ id: "q3", ch: "org", src: "slides", min: 7, q: "Why do organizations need \"controlled performance\"? Give concrete examples.",
  points: ["Definition: social arrangement for controlled performance toward collective goals", "Individuals also pursue personal goals", "Personal goals can disturb the collective goal", "Coordination, roles and rules channel efforts", "Performance depends on the goal: financial, well-being, societal impact", "A concrete example"],
  model: ["An organization is a social arrangement for achieving controlled performance in pursuit of collective goals. Control is needed because, when people work together, each one is also driven by personal goals, which can work against the collective goal.", "In a sales team, each rep wants to maximize their own commission and might poach colleagues' clients; shared client lists, clear territories and team targets keep efforts aligned with the firm's goal. In an NGO, volunteers may prefer the visible activities; roles and planning ensure the less glamorous tasks that serve the mission are also done. What counts as performance also depends on the goal: profit, well-being or societal impact."] },
{ id: "q4", ch: "org", src: "slides", min: 6, q: "What do we mean when we say that organizational performance is contingency-dependent?",
  points: ["No single best way to manage", "Effectiveness depends on the fit with the situation", "Situational factors: task, people, technology, strategy, environment", "Authors: Woodward, Chandler, Lawrence & Lorsch, Mintzberg", "Example"],
  model: ["It means there is no single best way to manage: how well a management approach performs depends on how well it fits the situation. The contingency school (Woodward, Chandler, Lawrence & Lorsch, Mintzberg) names situational factors such as the nature of the task, the people, the technology, the strategy and the external environment.", "Example: tight procedures and a clear hierarchy fit a stable, high-risk activity like air traffic control, but would slow down a start-up whose market changes every month, where autonomy and flexible roles work better."] },
{ id: "q5", ch: "org", src: "slides", min: 8, q: "Why might a management approach that works well in one organization not work equally well in another? Use the contingency approach and give one situational factor as an example.",
  points: ["Contingency: effectiveness depends on fit", "Name one situational factor precisely", "Show how the same approach fits one context and not the other", "Link to a school (e.g. bureaucracy or efficiency vs a creative context)"],
  model: ["According to the contingency approach, an approach is effective only when it fits its situation, so copying it into a different context can fail. Take the external environment as the factor. A bureaucratic approach, with formal rules, specialization and a clear hierarchy, works well in a stable environment like a national tax administration, because predictability and impartiality are exactly what is needed.", "In a fast-changing environment, like a digital start-up, the same rules slow down decisions and stifle the initiative the firm needs to adapt. The approach did not become bad: it lost its fit."] },
{ id: "q6", ch: "org", src: "course", min: 10, q: "Compare the bureaucracy and the efficiency approaches. What do they leave out, and how does the humanistic approach answer?",
  points: ["Bureaucracy: stability, predictability; legal-rational authority; five features", "Efficiency: one best way, managers plan / workers execute, specialization, incentives", "Common point: work as a technical system", "Missing: the human, social side of work", "Hawthorne effect", "Humanistic: relationships, morale, supervision"],
  model: ["Weber's bureaucracy asks how to run an organization in a stable, predictable and continuous way. Its answer is legal-rational authority: a hierarchy of offices, a clear division of labor, formal rules, selection on merit and impersonal decisions. Taylor's scientific management, later applied by Ford, asks how to work as efficiently as possible: analyze tasks scientifically, select and train workers, let managers plan and workers execute, specialize tasks and pay for output.", "Both see the organization as a technical system and say little about how people feel and interact. The Hawthorne studies showed that productivity rose whatever the change in lighting, because workers knew they were observed: the social context mattered. The humanistic approach (Mayo, Herzberg, McGregor) concludes that performance depends on social relationships and peer norms, on attitudes and morale, and on the way managers supervise."] },
{ id: "q7", ch: "person", src: "slides", min: 10, q: "What are the Big Five personality traits? Briefly describe each. Are some traits always \"better\" than others? Why or why not?",
  points: ["The five traits named and described", "Continuum, not types", "Conscientiousness best predictor of performance", "Each end has strengths and risks (one example)", "Too much of a good thing: ambiverts in sales", "Depends on the job and the situation"],
  model: ["The Big Five describe personality on five continua. Extraversion: how much social interaction and stimulation one seeks. Emotional stability: how calm and resilient one is under stress (the opposite pole is neuroticism). Openness to experience: curiosity and openness to new ideas. Conscientiousness: organization, discipline and goal orientation. Agreeableness: cooperation and consideration for others.", "No trait is always better. Conscientiousness is the best general predictor of job performance (Barrick & Mount), but each end of each trait has strengths and risks: highly conscientious people can become rigid and perfectionistic; highly agreeable people may avoid tough decisions; introverts listen well but may seem less involved. Evidence also shows \"too much of a good thing\": in sales, moderate extraverts (ambiverts) outperformed both extremes (Grant, 2013). What is better depends on the job and the situation."] },
{ id: "q8", ch: "person", src: "slides", min: 8, q: "Why can personality predict behavior without determining it? Use Trait Activation Theory in your explanation.",
  points: ["Traits are relatively stable tendencies", "Trait Activation Theory: personality × situation → behavior", "Cues make some traits relevant", "Situation can facilitate, constrain or channel expression", "Situation strength: weak vs strong, the four Cs", "Example"],
  model: ["Personality traits are relatively stable tendencies, so they predict how someone is likely to behave on average. But according to Trait Activation Theory (Tett & Burnett, 2003), behavior results from personality times situation: situational cues make some traits relevant, and the situation can facilitate, constrain or channel how a trait is expressed.", "Situation strength matters too. In a weak situation (unclear rules, many acceptable behaviors, as in an open brainstorming) personality shows freely. In a strong situation, defined by clarity, consistency, constraints and consequences (as in a strict exam), people behave alike whatever their traits. An extravert may be quiet in a strictly scripted call and lively in a team workshop: the trait predicts, the situation decides."] },
{ id: "q9", ch: "person", src: "slides", min: 12, q: "How can managers use personality assessments at work? Compare the uses and limitations of the MBTI and the Big Five for predicting job behavior and selecting employees. What else should managers consider before deciding?",
  points: ["MBTI: 16 types, four either/or dimensions", "MBTI limits: not scientific, weak predictive power, not for selection", "MBTI uses: self-reflection, talking about preferences", "Big Five: continuum, good predictor, conscientiousness", "Big Five limits: social desirability, faking, tendencies not guarantees", "Complement with references, interviews, observation; never the sole basis"],
  model: ["The MBTI classifies people into 16 types from four either/or dimensions (E-I, S-N, T-F, J-P). It is easy to talk about, so it can support self-reflection and conversations about work and communication preferences. But it forces people into categories, is not rooted in a scientific approach and does not predict performance, so it should not be used to select employees.", "The Big Five measure five traits along a continuum and are a much better predictor of behavior and performance; conscientiousness is the best single predictor. They can be used for self-awareness, to understand how people may behave and to judge the fit between personality and job demands, as one source of evidence in selection.", "Both are self-reports, open to social desirability bias and faking, and traits are tendencies, not guarantees (the situation matters). So test scores should never be the sole basis for a decision: managers should add past references, interviews and observation."] },
{ id: "q10", ch: "person", src: "slides", min: 9, q: "Why do values matter in organizations? How can value congruence or conflict influence workplace behavior and decisions?",
  points: ["Definition of values", "They explain attitudes, motivation and behavior", "Schwartz: motivational goals on a circle", "Adjacent values complementary, opposite values incongruent", "Bonus example: achievement vs benevolence", "Congruence eases joint decisions; meaning at work"],
  model: ["Values are abstract ideals that guide thinking and behavior across situations. They help managers understand employees' attitudes, motivation and behavior, and employees find more meaning at work when their goals fit their values.", "Schwartz places ten motivational values on a circle: adjacent values are complementary and opposite values are incongruent. When two managers must give a single bonus, one who values achievement will reward the employee who closed the biggest deal, while one who values benevolence will reward the colleague who supported new hires. Because achievement and benevolence are opposite, they will find it hard to agree. Managers whose values are adjacent, such as achievement and power, find common ground more easily. Value congruence makes joint decisions easier; value conflict explains disagreements between people acting in good faith."] },
{ id: "q11", ch: "person", src: "slides", min: 9, q: "What are the main workplace attitudes discussed in class, and why should managers care about them?",
  points: ["Attitude: cognitive, affective, behavioral components; predicts behavior", "Job satisfaction and its outcomes", "Engagement and its outcomes", "Organizational commitment and retention", "Perceived organizational support", "Attitudes are malleable: managers can act on them"],
  model: ["An attitude is how we think, feel and intend to act toward something, and it helps predict behavior. Four workplace attitudes matter. Job satisfaction, how much people like their job, is linked to performance, citizenship behavior, motivation, lower turnover and stress. Engagement, giving one's all with urgency, focus and enthusiasm, is linked to customer loyalty, performance, well-being and financial results. Organizational commitment, identifying with the organization and its goals, is linked to retention. Perceived organizational support, the belief that the organization values you and cares about your well-being, is linked to commitment, satisfaction, performance and lower turnover.", "Managers should care because, unlike personality and values, attitudes are malleable: what managers do changes them, and they in turn drive results."] },
{ id: "q12", ch: "decide", src: "slides", min: 7, q: "Does intuition work? Yes or no? Why?",
  points: ["System 1: fast, automatic", "It depends: two conditions (Dane et al.)", "Non-decomposable task", "High domain expertise", "How expertise develops (experience, practice, feedback)", "Example of good vs bad intuition"],
  model: ["It depends. Intuition is System 1: fast, automatic and effortless. It can be very effective, but only when two conditions hold together (Dane et al., 2012): the task is non-decomposable, meaning it cannot easily be broken into steps and requires seeing a whole pattern, and the decision maker has high domain expertise built through experience, repeated exposure to patterns, deliberate practice and informative feedback.", "An experienced surgeon diagnosing a torn ligament in seconds, or a technician spotting a machine fault at a glance, can trust intuition. A novice manager judging a candidate on a first impression cannot: the expertise is missing, and the task (assessing skills) can be broken into steps, where System 2 does better."] },
{ id: "q13", ch: "decide", src: "slides", min: 10, q: "Give examples of the different cognitive biases seen in class.",
  points: ["Definition: systematic, often unconscious distortion", "Confirmation", "Overconfidence", "Anchoring", "Availability", "Loss aversion and framing", "Sunk cost / escalation, action bias", "A remedy"],
  model: ["A cognitive bias is a systematic, often unconscious tendency that distorts judgment. Confirmation bias: a manager who thinks a hire is weak notices only their mistakes. Overconfidence: 94% of professors believed they were better than average. Anchoring: estimates of the Mississippi's length followed the arbitrary 300 or 3,000 km river mentioned first. Availability: vivid or recent events seem more frequent than they are.", "Loss aversion: a loss feels about twice as bad as an equal gain, which drives the framing effect: 72% chose the sure option when it was framed as lives saved, 78% chose the gamble when framed as deaths. Sunk cost: continuing a failing project because of the money already spent, which leads to escalation of commitment. Action bias: preferring to do something rather than nothing. Because biases are systematic, managers can reduce them: be aware, get more eyes on the problem, use System 2 for important decisions."] },
{ id: "q14", ch: "decide", src: "slides", min: 9, q: "Give an example of a biased decision during an evaluation process. How would you correct it?",
  points: ["A concrete evaluation scene", "Name the bias (halo, contrast, stereotype, FAE...)", "Explain the mechanism", "Consequence for the employee or the firm", "Correction: structured criteria, several raters, System 2, evidence"],
  model: ["During annual reviews, a manager rates Léa excellent on every criterion, including report quality and deadlines, because she presents confidently in meetings. This is the halo effect: one overall impression colors judgments of specific aspects. Her colleague, rated just after a star performer, gets a lower mark than his solid work deserves: a contrast effect.", "To correct it: rate each criterion separately against written, observable standards; collect evidence (deadlines met, error rates) before the meeting; use several raters, which puts more eyes on the problem; and slow down into System 2 by rating one criterion for all employees before moving to the next, rather than one employee after another."] },
{ id: "q15", ch: "decide", src: "slides", min: 9, q: "In what ways can social influence be negative in group decision-making?",
  points: ["Teams have assets but also liabilities", "Conformity (Asch)", "Obedience to authority (Milgram)", "Groupthink: consensus over evaluation", "Consequences: overlooked information and alternatives, no dissent", "Prevention measures"],
  model: ["Groups can bring more information, ideas and creativity, but social influence can spoil the decision. Asch showed conformity: people gave an obviously wrong answer about line lengths because the rest of the group did. Milgram showed obedience: people kept giving what they believed were painful shocks because an authority told them to. In a meeting, members may follow the majority or the boss rather than their own judgment.", "The extreme case is groupthink: the pressure for consensus discourages dissent and critical evaluation, so relevant information and alternatives are overlooked. To prevent it: collect independent judgments before discussion, appoint a devil's advocate or outside expert, encourage dissent, keep the leader from signaling a preference too early and generate several alternatives."] },
{ id: "q16", ch: "decide", src: "slides", min: 8, q: "Is it possible to always use rational decision-making? Yes or no? Why?",
  points: ["The four stages of the rational model", "No: bounded rationality (Simon)", "Limited time, information, cognitive capacity", "Satisficing: a manageable set, stop when good enough", "System 1 under time pressure", "Use System 2 for important decisions"],
  model: ["The rational model has four stages: identify the problem or opportunity, generate alternatives, evaluate them and select one, then implement and evaluate the solution. It assumes we can know every option and its consequences.", "In practice we cannot. Simon's bounded rationality says decision makers have limited time, information and cognitive capacity, so they consider a manageable set of options and stop once one is good enough: they satisfice. Time pressure and depletion also push us toward System 1. The realistic goal is not full rationality but saving System 2 effort, and the rational steps, for important decisions."] },
{ id: "q17", ch: "motiv", src: "slides", min: 6, q: "What is the main criticism of Maslow's hierarchy of needs?",
  points: ["The five needs in order", "Confirmed: each need adds to well-being, across cultures", "Not confirmed: the fixed order", "People pursue higher goals with unmet basic needs", "Example"],
  model: ["Maslow ranks five needs that we are supposed to satisfy in order: physiological, safety, belonging, esteem, then self-actualization. Seventy years of research confirmed one part: fulfillment in each domain contributes independently to well-being across cultures.", "The hierarchy itself is not confirmed: cross-cultural and behavioral research shows that people often pursue higher-level goals while basic needs are unmet, like a student short of money and sleep who is still driven by a project they believe in."] },
{ id: "q18", ch: "motiv", src: "slides", min: 10, q: "According to Self-Determination Theory, which three psychological needs support motivation? How?",
  points: ["Competence", "Autonomy", "Relatedness", "Satisfied needs → motivation → performance and well-being", "Manager actions for each need", "Autonomy-supportive supervision, informational feedback", "Example (Gmail)"],
  model: ["Self-Determination Theory names three innate needs. Competence: feeling capable and effective. Autonomy: having freedom and discretion over what you do and how. Relatedness: feeling connected and part of a group. When the workplace satisfies them, motivation becomes more autonomous, which improves performance and well-being.", "Managers support competence with resources, time, contacts, coaching and informational feedback (\"I liked how you structured the argument\"). They support relatedness with camaraderie. They support autonomy, the critical bridge from guilt-driven to autonomous commitment, by delegating meaningful tasks and supervising in an autonomy-supportive way: offering meaningful choice, acknowledging the person's view and avoiding unnecessary control. Google's freedom to pursue side projects, which produced Gmail, combined all three."] },
{ id: "q19", ch: "motiv", src: "slides", min: 9, q: "What is the difference between intrinsic and extrinsic motivation? Can extrinsic motivation also be autonomous?",
  points: ["Definitions", "Properties of each (stability, shortcuts, persistence)", "Most motivation is a mix", "Internalization continuum", "Yes: identification and integration", "Call-center example"],
  model: ["Intrinsic motivation comes from the appeal of the activity itself; extrinsic motivation comes from outcomes separate from it, such as pay or grades. Intrinsic motivation is more self-sustaining and linked to deeper engagement, learning and persistence. Extrinsic motivation works for short-term compliance but can fade and shift attention to the reward, encouraging shortcuts. Most real motivation mixes both.", "Yes, extrinsic motivation can be autonomous. On the internalization continuum, external regulation (rewards, punishments) and introjection (guilt, approval) are controlled, but identification (\"I believe it is important\") and integration (\"it fits who I am\") are autonomous. Two agents answer the same calls: one because he is paid and monitored (controlled), the other because helping callers matters to her (autonomous)."] },
{ id: "q20", ch: "motiv", src: "slides", min: 7, q: "What do SMART goals mean? Why is goal setting important in organizations?",
  points: ["S, M, A, R, T spelled out", "Specific, difficult goals beat \"do your best\"", "Mediators: attention, effort, persistence, strategies", "Moderators: ability, resources, commitment, feedback", "Performance vs learning goals", "A goal rewritten SMART"],
  model: ["SMART goals are Specific, Measurable, Achievable, Relevant (results-oriented) and Timely. Goal setting matters because, according to Locke and Latham, specific and challenging goals lead to higher performance than vague goals or \"do your best\". They work by directing attention, mobilizing effort, increasing persistence and prompting better strategies, provided people have the ability and resources, are committed and get feedback.", "Managers should also choose between performance goals (an end result) and learning goals (a new skill), depending on task complexity and experience. \"I'll study very hard\" becomes \"by Sunday 6 pm I will answer every lecture 3 self-check question in writing and score at least 80% on the quiz\"."] },
{ id: "q21", ch: "motiv", src: "slides", min: 7, q: "According to Herzberg's two-factor theory, what is the difference between hygiene factors and motivators?",
  points: ["Hygiene factors listed", "Motivators listed", "Hygiene: removes dissatisfaction only", "Motivators: create motivation and satisfaction", "Salary is hygiene", "Managerial consequence"],
  model: ["Herzberg separates two sets of factors. Hygiene factors are relationships with peers, company policies, the physical workspace, working conditions, salary, status, security and supervision. Improving them reduces dissatisfaction but does not create motivation or satisfaction. Motivators are achievement, recognition, the work itself, advancement and growth: they are what actually motivates.", "So a manager who only raises pay or redecorates the office may stop complaints without increasing motivation; to motivate, they must act on the content of the job: recognition, interesting work, growth opportunities."] },
{ id: "q22", ch: "motiv", src: "slides", min: 9, q: "According to the Job Characteristics Model, what makes a job more motivating? Give one example of job enrichment.",
  points: ["Five core dimensions defined", "Three psychological states and their links", "Outcomes: intrinsic motivation, satisfaction, effectiveness", "Moderators", "A concrete enrichment example tied to dimensions"],
  model: ["Hackman and Oldham name five core dimensions: skill variety, task identity (a whole, identifiable piece of work), task significance (impact on others), autonomy, and feedback from the job. Variety, identity and significance make the work feel meaningful; autonomy creates a sense of responsibility for outcomes; feedback gives knowledge of the actual results. These states lead to high intrinsic motivation, growth and job satisfaction, and work effectiveness. The effect depends on moderators: knowledge and skill, growth need strength and context satisfactions.", "Example of enrichment: in a customer-service center, instead of each agent handling one step of a complaint, give each agent full ownership of a case from first call to resolution (task identity), the freedom to choose the remedy within a budget (autonomy), and the customer's satisfaction score at the end (feedback)."] },
{ id: "q23", ch: "motiv", src: "slides", min: 9, q: "According to equity theory, why can perceived unfairness reduce motivation? What can an employee do to restore equity?",
  points: ["Outcomes / inputs ratio vs a referent", "Perceived inequity → tension → motivation to reduce it", "The six ways listed", "Link to organizational justice (distributive, procedural, interactional)", "Example"],
  model: ["Equity theory says people compare the ratio of their outcomes (pay, promotion, recognition, flexibility) to their inputs (effort, skill, experience, time) with the same ratio for a referent. When the ratios differ, they feel inequity, which creates tension they are motivated to reduce, often at the expense of work motivation.", "There are six ways to restore equity: change inputs (work less when underpaid), change outcomes (ask for a raise), distort perceptions of oneself, distort perceptions of the other (\"Mike's job isn't that great\"), choose a different referent, or leave. Fairness also depends on the process and on how people are treated: procedural and interactional justice can soften a disappointing outcome."] },
{ id: "a1", ch: "decide", src: "apply", min: 12, q: "Case. A sales director wants to fire Inès, whose sales fell 30% this quarter. You learn that her client reports are still excellent, that the whole team's sales fell after a competitor cut prices, and that Inès had been top seller for four years. Analyze the director's reasoning and recommend what to do.",
  points: ["Kelley: high distinctiveness (good work elsewhere)", "High consensus (whole team down)", "Low consistency (top seller before)", "→ external attribution", "Director commits the fundamental attribution error", "Wrong attribution → wrong action (firing vs strategy)", "Recommendation: respond to the competitor (new strategy), keep and support Inès"],
  model: ["Apply Kelley's model. Distinctiveness is high: Inès still performs well in other parts of her job (excellent reports). Consensus is high: the whole team's sales fell. Consistency is low: she was top seller for four years, so the drop is unusual for her. High distinctiveness, high consensus and low consistency point to an external cause, here the competitor's price cut.", "The director is committing the fundamental attribution error: blaming a colleague's failure on internal causes (lack of effort or ability). The managerial action follows the attribution: firing makes sense only for an internal, stable cause. Here the right response to an external cause, increased competition, is a new commercial strategy (pricing, offer, targeting), while keeping and supporting Inès."] },
{ id: "a2", ch: "motiv", src: "apply", min: 12, q: "Case. In a call center, agents follow strict scripts, are monitored every minute and get a bonus per call handled. Turnover is high and customer satisfaction is falling. Diagnose the problem with two theories and make two recommendations.",
  points: ["Problem stated as a gap (satisfaction, turnover vs target)", "SDT: autonomy frustrated (scripts, monitoring) → controlled motivation", "External regulation; rewards encourage shortcuts (rushed calls)", "JCM: low variety, identity, autonomy", "Recommendation 1: autonomy within guidelines, informational feedback", "Recommendation 2: job enrichment (own the case end to end, see customer feedback)", "Expected outcomes and limits"],
  model: ["Problem: customer satisfaction and retention of agents are below target. Self-Determination Theory explains part of it: scripts and constant monitoring frustrate autonomy, so motivation stays controlled (external regulation). A bonus per call rewards speed, so attention shifts to the reward and agents take shortcuts that customers notice. The Job Characteristics Model adds that the job has little skill variety, little task identity (calls are cut into steps) and little autonomy, so it feels meaningless.", "Recommendations: first, give agents freedom to adapt the script within clear guidelines and replace minute-by-minute monitoring with informational feedback on real calls, which supports autonomy and competence. Second, enrich the job: let an agent own a customer's problem until it is solved and show them the customer's rating, which builds task identity and feedback. Possibly replace the per-call bonus with a reward tied to resolution quality. Limits: the effect depends on moderators such as growth need strength."] },
{ id: "a3", ch: "decide", src: "apply", min: 10, q: "Case. A board has invested €4 million in a product that every test now shows customers do not want. In the meeting, the CEO opens by saying \"we all believe in this product\", and nobody objects. Which biases and group processes are at work, and how would you redesign the meeting?",
  points: ["Sunk cost fallacy", "Escalation of commitment", "Groupthink: no dissent", "Leader signals preference early (and authority/obedience)", "Possibly confirmation bias", "Redesign: independent judgments first, devil's advocate, external expert, leader speaks last, several alternatives"],
  model: ["The €4 million already spent is a sunk cost: it cannot be recovered and should not drive the decision, yet it pushes the board toward escalation of commitment to a failing course of action. The meeting adds groupthink: the CEO signals the preferred option at the start, the pressure for consensus discourages dissent, and the negative test results are overlooked; deference to the CEO echoes obedience to authority. Members may also discount contrary evidence (confirmation bias).", "Redesign: ask each member to write an independent judgment on the test data before any discussion; appoint a devil's advocate or invite an external expert; have the CEO speak last; and require several alternatives (stop, pivot, relaunch) evaluated only on future costs and benefits."] },
{ id: "a4", ch: "person", src: "apply", min: 10, q: "Case. A start-up wants to hire only candidates with the ENTJ MBTI profile for its sales team, \"because leaders are ENTJs\". Advise the founder.",
  points: ["MBTI: either/or types, not scientific, weak prediction", "Not recommended for selection", "Big Five as a better predictor (conscientiousness; extraversion for social jobs)", "Too much of a good thing: ambiverts in sales", "Social desirability / faking", "Complement: references, interviews, observation; job–person fit and situation"],
  model: ["The MBTI is a poor basis for selection: it forces people into either/or types, is not rooted in a scientific approach and lacks predictive power for performance. Hiring on one profile also narrows diversity without evidence that it helps.", "If the founder wants to use personality, the Big Five are a better tool: conscientiousness predicts performance in most jobs, and extraversion helps in jobs with a social component. But more is not always better: in sales, moderate extraverts (ambiverts) outperformed the most extraverted. Self-reports can be faked (social desirability), and traits only show when the situation activates them. So use test results as one source of evidence, together with references, structured interviews and observation, such as a role-played sales call."] }
];

const MS = {
  get(k, d){ const s = store.get(); return s[k] ?? d; },
  set(k, v){ const s = store.get(); s[k] = v; store.set(s); }
};
const CH = Object.fromEntries(COURSE.map(c => [c.id, c]));
const allCards = () => COURSE.flatMap(c => c.sections.flatMap(s => s.cards.map(k => ({ ...k, ch: c.id }))));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ICO = {

  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',

};
function learnStats(chId){
  const known = MS.get("learn", {}), cards = allCards().filter(c => !chId || c.ch === chId);

}
function mhead(kicker, title, lede, extra = ""){

}
const chipCh = (c, on, act = "ch") => `<button class="mchip${on ? " on" : ""}" type="button" data-${act}="${c.id}" style="--c:${c.c}" aria-pressed="${on}">${c.n}. ${c.short}</button>`;

/* ---------------- LEARN: a chapter ---------------- */
function noteCard(k, known){
  return `<article class="note${known ? " known" : ""}" id="n-${k.id}" data-note="${k.id}">
    <div class="note-h"><h3>${k.title}</h3><button class="gotit" type="button" data-know="${k.id}" aria-pressed="${!!known}">${ICO.check}<span>${known ? "Known" : "I know this"}</span></button></div>
    <p class="nline">${k.line}</p>
    ${k.formula ? `<pre class="formula">${k.formula}</pre>` : ""}
    ${k.points ? `<ul class="npts">${k.points.map(p => `<li>${p}</li>`).join("")}</ul>` : ""}
    ${k.example ? `<div class="nbox ex"><span class="nb-h">${ICO.ex}Example</span><p>${k.example.replace(/\n/g, "<br>")}</p></div>` : ""}
    ${k.trap ? `<div class="nbox trap"><span class="nb-h">${ICO.warn}Trap</span><p>${k.trap}</p></div>` : ""}
    ${k.exam ? `<div class="nbox exam"><span class="nb-h">${ICO.pen}In the exam</span><p>${k.exam}</p></div>` : ""}
  </article>`;
}
function viewChapter(id){
  const c = CH[id] || COURSE[0], known = MS.get("learn", {});
  const idx = COURSE.indexOf(c), prev = COURSE[idx - 1], next = COURSE[idx + 1];
  const s = learnStats(c.id);
  const root = h("div", { class: "mod chapter", style: `--c:${c.c}`, html: `
  <div class="chlay">
    <aside class="toc" aria-label="Sections">
      <a class="tocback" href="#learn">${ICO.back}All lectures</a>
      <div class="toc-h"><span class="chn">${String(c.n).padStart(2, "0")}</span><b>${c.title}</b></div>
      <div class="mprog sm"><div class="mbar"><i data-chbar style="width:${s.known / s.total * 100}%"></i></div><span data-chcount>${s.known}/${s.total} known</span></div>
      <nav class="toc-l">${c.sections.map((sec, i) => `<button type="button" data-sec="${i}"><span>${sec.title}</span><em data-seccount="${i}"></em></button>`).join("")}</nav>
      <div class="toc-act"><a class="btn primary small" href="#quiz-${c.id}">Quiz this lecture</a><a class="btn glassy small" href="#cards-${c.id}">Flashcards</a></div>
    </aside>
    <div class="chbody">
      ${mhead(`Lecture ${c.n}`, c.title, c.intro)}
      ${c.sections.map((sec, i) => `<section class="nsec" data-seci="${i}"><h2>${sec.title}</h2>${sec.widget ? `<div class="widget" data-widget="${sec.widget}"></div>` : ""}${sec.cards.map(k => noteCard(k, known[k.id])).join("")}</section>`).join("")}
      <nav class="chnext">${prev ? `<a class="btn glassy" href="#learn-${prev.id}">${ICO.back}${prev.title}</a>` : "<span></span>"}<a class="btn primary" href="#quiz-${c.id}">Test this lecture</a>${next ? `<a class="btn glassy" href="#learn-${next.id}">${next.title}${ICO.arrow}</a>` : "<span></span>"}</nav>
    </div>
  </div>` });
  const counts = () => {
    const k = MS.get("learn", {});
    c.sections.forEach((sec, i) => { const n = sec.cards.filter(x => k[x.id]).length, el = root.querySelector(`[data-seccount="${i}"]`); el.textContent = sec.cards.length ? `${n}/${sec.cards.length}` : ""; el.classList.toggle("full", sec.cards.length && n === sec.cards.length); });
    const st = learnStats(c.id); root.querySelector("[data-chbar]").style.width = (st.known / st.total * 100) + "%"; root.querySelector("[data-chcount]").textContent = `${st.known}/${st.total} known`;
  };
  counts();
  root.addEventListener("click", e => {
    const kb = e.target.closest("[data-know]");
    if (kb){ const k = MS.get("learn", {}), id = kb.dataset.know; if (k[id]) delete k[id]; else k[id] = 1; MS.set("learn", k);
      const on = !!k[id]; kb.setAttribute("aria-pressed", String(on)); kb.querySelector("span").textContent = on ? "Known" : "I know this"; kb.closest(".note").classList.toggle("known", on); counts(); }
    const sb = e.target.closest("[data-sec]");
    if (sb){ const t = root.querySelector(`[data-seci="${sb.dataset.sec}"]`); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }
  });
  /* the section in view lights up in the table of contents */
  requestAnimationFrame(() => {
    const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) root.querySelectorAll("[data-sec]").forEach(b => b.classList.toggle("on", b.dataset.sec === en.target.dataset.seci)); }), { rootMargin: "-30% 0px -60% 0px" });
    root.querySelectorAll(".nsec").forEach(s => io.observe(s));
    root.querySelectorAll("[data-widget]").forEach(w => WIDGETS[w.dataset.widget] && WIDGETS[w.dataset.widget](w));
  });
  return root;
}


/* ---------------- QUIZ: exam-style multiple choice ---------------- */
function viewQuiz(pre){
  const sel = new Set(pre && CH[pre] ? [pre] : COURSE.map(c => c.id));
  const root = h("div", { class: "mod", html: `${mhead("Management and Organizations", "Quiz", "Exam-style multiple choice on the lectures. Every answer comes with its explanation.")}<div class="qzwrap"></div>` });
  const W = root.querySelector(".qzwrap");
  let len = 10, Qs = [], i = 0, score = 0, wrong = [];
  function setup(){
    const hist = MS.get("quiz", {});
    W.innerHTML = `<div class="qzsetup"><h2>Choose your quiz</h2>
      <div class="mchips">${COURSE.map(c => chipCh(c, sel.has(c.id))).join("")}</div>
      <div class="seg" role="group" aria-label="Length">${[10, 20, 0].map(n => `<button type="button" data-len="${n}" aria-pressed="${n === len}">${n || "All"} questions</button>`).join("")}</div>
      <p class="muted" data-avail></p>
      <button class="btn primary big" type="button" data-start>Start the quiz</button>
      ${hist.last ? `<p class="muted small">Last quiz: ${hist.last.score}/${hist.last.n} (${Math.round(hist.last.score / hist.last.n * 100)}%).</p>` : ""}</div>`;
    const avail = () => { W.querySelector("[data-avail]").textContent = `${QUIZ.filter(q => sel.has(q.ch)).length} questions available.`; };
    avail();
    W.onclick = e => {
      const cb = e.target.closest("[data-ch]"); if (cb){ const k = cb.dataset.ch; if (sel.has(k) && sel.size > 1) sel.delete(k); else sel.add(k); cb.classList.toggle("on", sel.has(k)); cb.setAttribute("aria-pressed", String(sel.has(k))); avail(); }
      const lb = e.target.closest("[data-len]"); if (lb){ len = +lb.dataset.len; W.querySelectorAll("[data-len]").forEach(b => b.setAttribute("aria-pressed", String(b === lb))); }
      if (e.target.closest("[data-start]")){ const pool = shuffle(QUIZ.filter(q => sel.has(q.ch))); start(len ? pool.slice(0, len) : pool); }
    };
  }
  function start(list){ Qs = list.map(q => { const order = shuffle(q.o.map((_, j) => j)); return { ...q, order }; }); i = 0; score = 0; wrong = []; show(); }
  function show(){
    const q = Qs[i], c = CH[q.ch], L = "ABCD";
    W.innerHTML = `<div class="qzq" style="--c:${c.c}"><div class="qzprog"><span>${i + 1} / ${Qs.length}</span><div class="mbar"><i style="width:${i / Qs.length * 100}%"></i></div><span class="tag">${c.short}</span></div>
      <p class="dqt">${q.q}</p><div class="opts">${q.order.map((j, k) => `<button class="opt" type="button" data-pick="${j}"><span class="k">${L[k]}</span><span>${q.o[j]}</span></button>`).join("")}</div><div class="dout"></div></div>`;
    W.onclick = e => {
      const pb = e.target.closest("[data-pick]");
      if (pb && !q.done){ q.done = true; const j = +pb.dataset.pick, good = j === q.a; if (good) score++; else wrong.push(q);
        W.querySelectorAll(".opt").forEach(b => { b.disabled = true; const v = +b.dataset.pick; if (v === q.a) b.classList.add("right"); else if (v === j) b.classList.add("wrong"); });
        const box = W.querySelector(".qzq"); box.classList.add(good ? "ok" : "bad");
        W.querySelector(".dout").innerHTML = `<div class="verdict ${good ? "ok" : "bad"}"><div class="vh"><b>${good ? "Correct" : "Not quite"}</b></div><p>${q.why}</p></div><button class="btn quiet small next" type="button" data-nx>${i + 1 < Qs.length ? "Next question" : "See my score"} ${ICO.arrow}<kbd>Enter</kbd></button>`;
        W.querySelector("[data-nx]").focus({ preventScroll: true }); }
      if (e.target.closest("[data-nx]")){ i++; if (i < Qs.length) show(); else end(); }
    };
  }
  function end(){
    const pct = Math.round(score / Qs.length * 100), hist = MS.get("quiz", {}); hist.last = { score, n: Qs.length }; hist.count = (hist.count || 0) + 1; MS.set("quiz", hist);
    const byCh = COURSE.map(c => { const qs = Qs.filter(q => q.ch === c.id); return qs.length ? `<div class="bs" style="--c:${c.c}"><b>${qs.filter(q => !wrong.includes(q)).length}/${qs.length}</b><span>${c.short}</span></div>` : ""; }).join("");
    W.innerHTML = `<div class="qzend"><span class="kicker">Quiz finished</span><h2>${pct}% · ${score} of ${Qs.length} right</h2><div class="blocks-sum">${byCh}</div>
      <div class="row">${wrong.length ? `<button class="btn primary" type="button" data-retry>Retry my ${wrong.length} mistake${wrong.length > 1 ? "s" : ""}</button>` : ""}<button class="btn glassy" type="button" data-new>New quiz</button><a class="btn glassy" href="#learn">Back to the course</a></div>
      ${wrong.length ? `<h3>Review</h3><ul class="review">${wrong.map(q => `<li><p class="rq">${q.q}</p><p class="ra">${ICO.check}<span>${q.o[q.a]}</span></p><p class="muted">${q.why}</p></li>`).join("")}</ul>` : ""}</div>`;
    W.onclick = e => { if (e.target.closest("[data-retry]")) start(shuffle(wrong.map(q => ({ ...q, done: false })))); if (e.target.closest("[data-new]")) setup(); };
  }
  root.addEventListener("keydown", e => {
    if (e.target.matches("input,textarea")) return;
    if (e.key === "Enter"){ const nx = W.querySelector("[data-nx]"); if (nx){ e.preventDefault(); nx.click(); } return; }
    const k = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 }[e.key.toLowerCase()];
    if (k != null){ const b = W.querySelectorAll(".opt:not([disabled])")[k]; if (b){ e.preventDefault(); b.click(); } }
  });
  setup();
  return root;
}

/* ---------------- FLASHCARDS ---------------- */
function viewCards(pre){
  const sel = new Set(pre && CH[pre] ? [pre] : COURSE.map(c => c.id));
  const root = h("div", { class: "mod", html: `${mhead("Management and Organizations", "Flashcards", "Say the answer out loud, then flip. Cards you know leave the pile; the others come back.")}
    <div class="drillbar"><div class="mchips">${COURSE.map(c => chipCh(c, sel.has(c.id))).join("")}</div><div class="seg"><button type="button" data-shuffle>Shuffle</button><button type="button" data-resetk>Reset known</button></div></div>
    <div class="mprog"><div class="mbar"><i data-fbar></i></div><span data-fcount></span></div>
    <div class="fstage"></div>` });
  const stage = root.querySelector(".fstage");
  let deck = [];
  const known = () => MS.get("cards", {});
  const build = (mix) => { const k = known(); deck = CARDS.map((c, i) => ({ i, ch: c[0], f: c[1], b: c[2] })).filter(c => sel.has(c.ch) && !k[c.i]); if (mix) deck = shuffle(deck); paint(); };
  function paint(){
    const k = known(), total = CARDS.filter(c => sel.has(c[0])).length, kn = CARDS.filter((c, i) => sel.has(c[0]) && k[i]).length;
    root.querySelector("[data-fbar]").style.width = (total ? kn / total * 100 : 0) + "%"; root.querySelector("[data-fcount]").textContent = `${kn} of ${total} known · ${deck.length} left in the pile`;
    if (!deck.length){ stage.innerHTML = `<div class="sprintend"><span class="kicker">Pile empty</span><h2>You know all ${total} cards</h2><div class="row"><button class="btn primary" type="button" data-resetk>Start over</button><a class="btn glassy" href="#quiz">Take a quiz</a></div></div>`; return; }
    const c = deck[0], C = CH[c.ch];
    stage.innerHTML = `<button class="flip" type="button" aria-label="Flip the card" style="--c:${C.c}"><span class="face front"><em>${C.short}</em><b>${c.f}</b><small>Click or press Space to flip</small></span><span class="face back"><em>${c.f}</em><b>${c.b}</b></span></button>
      <div class="fact"><button class="btn glassy big" type="button" data-again>Again <kbd>←</kbd></button><button class="btn primary big" type="button" data-know>I knew it <kbd>→</kbd></button></div>`;
  }
  const flip = () => { const f = stage.querySelector(".flip"); if (f) f.classList.toggle("on"); };
  const again = () => { if (!deck.length) return; deck.push(deck.shift()); paint(); };
  const got = () => { if (!deck.length) return; const k = known(); k[deck[0].i] = 1; MS.set("cards", k); deck.shift(); paint(); };
  root.addEventListener("click", e => {
    const cb = e.target.closest("[data-ch]"); if (cb){ const k = cb.dataset.ch; if (sel.has(k) && sel.size > 1) sel.delete(k); else sel.add(k); cb.classList.toggle("on", sel.has(k)); cb.setAttribute("aria-pressed", String(sel.has(k))); build(true); }
    if (e.target.closest(".flip")) flip();
    if (e.target.closest("[data-again]")) again();
    if (e.target.closest("[data-know]")) got();
    if (e.target.closest("[data-shuffle]")) build(true);
    if (e.target.closest("[data-resetk]")){ const k = known(); CARDS.forEach((c, i) => { if (sel.has(c[0])) delete k[i]; }); MS.set("cards", k); build(true); }
  });
  const onKey = e => { if (!root.isConnected){ document.removeEventListener("keydown", onKey); return; } if (e.target.matches && e.target.matches("input,textarea")) return;
    if (e.key === " "){ e.preventDefault(); flip(); } if (e.key === "ArrowLeft") again(); if (e.key === "ArrowRight") got(); };
  document.addEventListener("keydown", onKey);
  build(true);
  return root;
}

function schwartzRel(a, b){
  const d0 = Math.abs(a.s - b.s), d = Math.min(d0, 9 - d0);

}

/* ---------- the signature: a crowd that becomes an organization (3D points, canvas 2D, no library) ----------

   Team: one ring turning around a shared goal, each person linked to the next. Organization: a 3D hierarchy with
   roles (colours), reporting lines and a pulse that runs down the structure. The scene turns slowly in 3D, the
   pointer tilts it and pushes people aside; clicking the hero moves to the next formation. */

    col = { fg: hx(cs.getPropertyValue("--fg")), muted: hx(cs.getPropertyValue("--faint")), pri: hx(cs.getPropertyValue("--pri")), c1: hx(cs.getPropertyValue("--c1")), c3: hx(cs.getPropertyValue("--c3")), c4: hx(cs.getPropertyValue("--c4")) };
  }
  /* each person: 3D position, a home in the crowd, a cluster, a ring slot, a role in the hierarchy */

  const P = Array.from({ length: N }, (_, i) => {
    const u = [RND(-1, 1), RND(-1, 1), RND(-1, 1)], ul = Math.hypot(...u) || 1;
    const m = i - 5, dept = i < 5 ? -1 : m % DEPTS, j = i < 5 ? 0 : Math.floor(m / DEPTS);
    return { i, x: RND(-1.4, 1.4), y: RND(-.9, .9), z: RND(-1, 1), hx: RND(-1.45, 1.45), hy: RND(-.85, .85), hz: RND(-1.05, 1.05),
      ph: Math.random() * 6.283, sp: RND(.6, 1.4), r: RND(.75, 1.25), cl: i % K, off: u.map(v => v / ul * RND(.06, .3)), d: Math.random() * .45,
      dept, lvl: i === 0 ? 0 : i < 5 ? 1 : 2, j, c: [140, 140, 150], ox: 0, oy: 0, sx: 0, sy: 0, s: 1, zz: 0 };
  });

  /* the four formations */
  function target(p, t){
    const i = p.i;
    if (mode === 0){ return [p.hx + .16 * Math.sin(t * .33 * p.sp + p.ph), p.hy + .11 * Math.sin(t * .27 * p.sp + p.ph * 1.7), p.hz + .16 * Math.cos(t * .29 * p.sp + p.ph)]; }

      const a = p.cl * 2 * Math.PI / K + .35, cx = Math.cos(a) * .92, cz = Math.sin(a) * .92, cy = Math.sin(p.cl * 1.9) * .34;
      const r = t * .35 + p.ph * .05, cr = Math.cos(r), sr = Math.sin(r), o = p.off;

    if (p.lvl === 0) return col.fg;

    mouse.nx += (mouse.tx - mouse.nx) * .05; mouse.ny += (mouse.ty - mouse.ny) * .05;
    const k = 1 - Math.pow(1 - .055, dt * 60), kc = 1 - Math.pow(1 - .05, dt * 60), el = T - since;

  const onClick = e => { if (e.target.closest("a,button,input,textarea")) return; auto = false; setMode(mode + 1); };
  hero.addEventListener("pointermove", onMove, { passive: true }); hero.addEventListener("pointerleave", onLeave); hero.addEventListener("click", onClick);
  btns.forEach((b, i) => {
    b.addEventListener("click", () => { auto = false; setMode(i); });
    b.addEventListener("pointerenter", e => { if (e.pointerType !== "mouse") return; hoverLock = true; setMode(i); });
    b.addEventListener("pointerleave", () => { hoverLock = false; nextAuto = T + 5.4; });

  const onTheme = () => { readCols(); if (reduce){ P.forEach(p => p.c = tcol(p).slice()); draw(); } }; addEventListener("nexus-theme", onTheme);
  readCols(); size();
  P.forEach(p => { p.c = tcol(p).slice(); });
  if (reduce) setMode(3, true); else kick();
  return () => { dead = true; cancelAnimationFrame(raf); io.disconnect(); document.removeEventListener("visibilitychange", onVis); removeEventListener("resize", onResize); removeEventListener("nexus-theme", onTheme); };
}

function stepCard(C, s, i, P){

    card.addEventListener("keydown", e => { if (btns[0].disabled || e.target.matches("textarea,input")) return; const k = { a: 0, b: 1, c: 2, d: 3, e: 4, "1": 0, "2": 1, "3": 2, "4": 3, "5": 4 }[e.key.toLowerCase()]; if (k != null && btns[k]){ e.preventDefault(); btns[k].click(); } });

    const sc = () => { model.querySelector("[data-osc]").textContent = `${ticks.size}/${s.points.length}`; };

}

  let mode = "practice", streak = 0, ok = 0, tot = 0, cur = null, t0 = 0, tick = 0, sprintOn = false, deck = [];
  const dq = root.querySelector(".dq"), S = k => root.querySelector(`[data-s="${k}"]`), timer = root.querySelector(".timer");
  const stats = () => { const s = MS.get("spot", { best: 0, sprint: 0 }); S("streak").textContent = streak; S("score").textContent = `${ok}/${tot}`; S("best").textContent = s.best; S("sprint").textContent = s.sprint; };
  const refill = () => { deck = shuffle(SPOT.filter(it => sel.has(FAMILIES[it[0]].ch))); };

function makeKelley(prevKey){
  let t, n, ext, key;
  do { t = Math.floor(Math.random() * KEL.length); n = PICK(KEL_NAMES); ext = Math.random() < .5; key = t + (ext ? "e" : "i"); } while (key === prevKey);

  return { key, ev: f(T.ev), cues, v, ext, name: n };

const EQ_PAIRS = [["Lina", "Tom"], ["Sami", "Emma"], ["Jade", "Noah"], ["Rayan", "Clara"], ["Maëlle", "Enzo"], ["Ilyes", "Manon"]];
const EQ_UNDER = [["I'll just do the minimum from now on.", "Change inputs"], ["I'm going to ask for a raise.", "Change outcomes"], ["Maybe I'm not as fast as I thought; my pay is fair after all.", "Distort perceptions of self"], ["Their job looks easy, but it's more stressful than mine.", "Distort perceptions of others"], ["At least I earn more than my friends from school.", "Choose a different referent"], ["I've started applying elsewhere.", "Leave the field"]];
const EQ_OVER = [["I'll put in extra hours to deserve this.", "Change inputs"], ["My experience must be worth more than I thought.", "Distort perceptions of self"], ["Their job must be easier than it looks.", "Distort perceptions of others"]];
const EQ_ACTS = ["Change inputs", "Change outcomes", "Distort perceptions of self", "Distort perceptions of others", "Choose a different referent", "Leave the field"];
function makeEquity(){
  const [me, ref] = PICK(EQ_PAIRS), HRS = [32, 35, 37, 39, 40, 42, 45];
  const h1 = PICK(HRS), h2 = PICK(HRS), pay2 = RI(48, 84) * 50, r2x = pay2 / h2;
  const d = PICK([-.24, -.16, -.11, -.07, 0, 0, 0, .07, .12, .2]);
  const pay1 = Math.round(r2x * (1 + d) * h1 / 10) * 10;
  const r1 = pay1 / h1, r2 = pay2 / h2, diff = (r1 - r2) / r2;
  const state = Math.abs(diff) < .02 ? "eq" : diff < 0 ? "under" : "over";
  const quote = state === "under" ? PICK(EQ_UNDER) : state === "over" ? PICK(EQ_OVER) : null;
  return { me, ref, h1, h2, pay1, pay2, r1, r2, diff, state, quote };
}

  root.addEventListener("click", e => {
    if (e.target.closest("[data-start]")){ E.start = Date.now(); save(); paint(); }
    if (e.target.closest("[data-new]")){ E = newExam(); save(); render(); }
    const f = e.target.closest("[data-finish]");
    if (f){ if (!f.dataset.armed){ f.dataset.armed = "1"; f.textContent = "Tap again to finish"; setTimeout(() => { if (f.isConnected){ delete f.dataset.armed; f.textContent = "Finish and mark"; } }, 3500); return; } finish(); }
  });
  root.addEventListener("change", e => { const cb = e.target.closest("[data-xt]"); if (!cb) return; const id = cb.dataset.xt, k = +cb.dataset.k, t = new Set(E.ticks[id] || []); if (cb.checked) t.add(k); else t.delete(k); E.ticks[id] = [...t]; cb.closest(".ochk").querySelector("h3 span").textContent = `${t.size}/${OPEN.find(o => o.id === id).points.length}`; rescore(); });
  paint();
  return root;
}

function focusCard(card, instant){
  if (!card) return;
  if (card.classList.contains("card")) card.dispatchEvent(new CustomEvent("focuscard", { bubbles: true, detail: card }));
  card.scrollIntoView({ block: "center", behavior: instant || matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  const target = card.querySelector("input:not([disabled]), .opt:not([disabled]), textarea") || card.querySelector("[data-act='next']");
  if (target) setTimeout(() => target.focus({ preventScroll: true }), instant ? 0 : 380);
}

/* ---------- render ---------- */
const MODVIEWS = { learn: viewLearn, chapter: viewChapter, cases: viewCases, spot: viewSpot, labs: viewLabs, lab: viewLab, quiz: viewQuiz, cards: viewCards, open: viewOpen, openq: viewOpenQ, exam: viewExam };
const TITLES = { learn: "Learn", chapter: "Learn", cases: "Cases", spot: "Spot it", labs: "Labs", lab: "Labs", quiz: "Quiz", cards: "Flashcards", open: "Exam questions", openq: "Exam questions", exam: "Mock exam" };
new ResizeObserver(() => document.documentElement.style.setProperty("--hdr", document.querySelector(".hdr").offsetHeight + "px")).observe(document.querySelector(".hdr"));
const STAGE = { stop: null, view: null };
function render(){
  const r = route();
  if (STAGE.stop){ STAGE.stop(); STAGE.stop = null; }
  STAGE.view = r.view; AURA.set(r.view !== "case"); TINT();
  document.body.dataset.view = r.view;
  const NAVOF = { case: "cases", chapter: "learn", openq: "open", exam: "open", lab: "labs" };
  document.querySelectorAll(".nav a").forEach(a => { const on = a.dataset.route === (NAVOF[r.view] || r.view); a.setAttribute("aria-current", on ? "page" : "false"); if (on) a.scrollIntoView({ block: "nearest", inline: "nearest" }); });
  const app = $("#app");
  if (r.view === "case"){
    app.replaceChildren(viewCase(r.id));
    const c = CASES.find(x => x.id === r.id) || CASES[0];
    document.title = `Case ${c.n}: ${c.title} · Management`;
  } else if (MODVIEWS[r.view]){
    app.replaceChildren(MODVIEWS[r.view](r.id));
    document.title = (TITLES[r.view] || "Management") + " · Management and Organizations";
    window.scrollTo(0, 0);
    if (r.view === "chapter") STAGE.stop = mountReveal(app);
  } else {
    app.replaceChildren(viewHome());
    const fh = app.querySelector(".fhero"); if (fh) STAGE.stop = mountSwarm(fh);
    const rs = app.querySelector("#reviews"); if (rs) mountReviewSection(rs);
    document.title = "Fundamentals of Management and Organizations · Nexus";
    if (location.hash === "#reviews") setTimeout(() => { const s = $("#reviews"); if (s) s.scrollIntoView(); }, 60); else window.scrollTo(0, 0);
  }
}
/* note cards ease in as they enter the view (once) */
function mountReveal(app){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return null;
  const els = [...app.querySelectorAll(".note,.widget")]; els.forEach(e => e.classList.add("rv-in"));
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add("rv-on"); io.unobserve(en.target); } }), { rootMargin: "0px 0px -8% 0px" });
  els.forEach(e => io.observe(e));
  return () => io.disconnect();
}
FS.bind($("#fsBtn"));
if (route().view !== "case") FS.invite($("#fsBtn"));
/* aubergine ink → indigo night → ember, which stays (dark); blush paper → lavender → apricot, which stays (light) */
const TINT = scrollTint(dark => STAGE.view === "case" ? null : dark ? ["#120D14", "#14112A", "#2A140C"] : ["#FAF5F7", "#F0EDFB", "#FCEADB"], () => innerHeight * 0.55, 0.9);
render();
</script>
