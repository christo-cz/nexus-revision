<script>var t="dark";try{if(localStorage.getItem("nexus-theme")==="light")t="light";}catch(e){}document.documentElement.dataset.theme=t;</script>
<style>
/* Management and Organizations lab: people, groups and structures.
   Colour carries the course: berry --pri = the individual (and the lab), violet --c1 = organizations and structure,
   orange --c3 = decisions and groups, sky --c4 = motivation. Dark is the default; light only on request. */
:root{
  color-scheme:dark;
  --bg:#120D14; --surface:#1B141E; --sunk:#251C29; --line:#33283A; --line-2:#47394F; --fg:#F4EDF2; --muted:#B7A9B6; --faint:#85778A;
  --pri:#FF7FB2; --pri-2:#FF9DC5; --pri-soft:#3A1729; --on-pri:#1C0812;
  --c1:#A99BFF; --c1-soft:#221D45; --c2:#FF7FB2; --c2-soft:#3A1729; --c3:#FFA45E; --c3-soft:#3A2311; --c4:#6EC1FF; --c4-soft:#112C42;
  --ok:#6FD39C; --ok-soft:#12301F; --bad:#FF8A80; --bad-soft:#3A1B1A;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .28);
  --glass:rgb(255 255 255 / .045); --glass-line:rgb(255 255 255 / .1);
  --f-display:"Familjen Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hdr:56px; --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#FAF5F7; --surface:#FFFFFF; --sunk:#F2E9EF; --line:#E7DAE2; --line-2:#D5C3CE; --fg:#1E1420; --muted:#685666; --faint:#998797;
  --pri:#B5386F; --pri-2:#992B5C; --pri-soft:#F9E1EC; --on-pri:#FFFFFF;
  --c1:#5B4BC4; --c1-soft:#ECE9FB; --c2:#B5386F; --c2-soft:#F9E1EC; --c3:#B85614; --c3-soft:#FBEADB; --c4:#1D6FB8; --c4-soft:#E1EEFA;
  --ok:#23794E; --ok-soft:#DFF2E6; --bad:#B4372E; --bad-soft:#F9E3E0;
  --shadow:0 1px 2px rgb(30 20 32 / .05),0 6px 20px rgb(30 20 32 / .07);
  --glass:rgb(255 255 255 / .62); --glass-line:rgb(30 20 32 / .1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 76%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--glass-line)}
.hdr-in{min-height:56px;display:flex;align-items:center;gap:16px;padding-left:var(--gut);padding-right:var(--gut-r)}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.12rem;white-space:nowrap;text-decoration:none}
.crumb .hub{color:var(--muted);font-weight:600;text-decoration:none}
.crumb .hub:hover{color:var(--fg)}
.crumb .sl{color:var(--line-2);font-weight:400}
.crumb b{color:var(--pri)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.92rem;text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--fg);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--sunk)}
.grow{flex:1}
.theme{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:.84rem;font-weight:600;color:var(--muted)}
.theme:hover{color:var(--fg);border-color:var(--line-2)}
.theme svg{width:16px;height:16px}
.crumb .here{text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crumb{min-width:0}
@media (max-width:480px){.nav a[data-route="home"]{display:none}.crumb{font-size:1.02rem}}
.hdr-in{gap:10px}
.hdr .theme{background:transparent}
@media (max-width:980px){#fsBtn .tl{display:none}}
@media (max-width:620px){.nav{margin-left:0}.nav a{padding:7px 9px}.theme .tl{display:none}.crumb .hub,.crumb .sl{display:none}}

/* ---------- shared page frame ---------- */
.page{max-width:1040px;margin:0 auto;padding-block:36px 72px;padding-left:var(--gut);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:48px}
@media (max-width:620px){.page{padding-block:24px 56px;gap:40px}}
.sec{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.35rem}
.sec-h p{color:var(--muted);font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:11px 18px;font-weight:700;font-size:.96rem;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pri);color:var(--on-pri)}
.btn.primary:hover{background:var(--pri-2)}
.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.quiet:hover{border-color:var(--line-2)}
.btn.small{padding:7px 12px;font-size:.86rem;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- overview ---------- */
.hero{display:flex;flex-direction:column;gap:18px}
.eq{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,7vw,4rem);line-height:1.02;letter-spacing:-.03em}
.eq .i{color:var(--c3)} .eq .l{color:var(--c1)} .eq .y{color:var(--pri)}
.hero .lede{max-width:52ch;color:var(--muted);font-size:1.06rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat span{font-size:.84rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat b{font-size:1.3rem}}
.cases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.cases{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
.casecard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.casecard:hover{border-color:var(--pri);box-shadow:var(--shadow)}
.casecard .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.casecard b{font-family:var(--f-display);font-size:1.05rem}
.casecard .country{font-size:.84rem;color:var(--muted)}
.casecard .state{font-size:.78rem;font-weight:600;color:var(--muted)}
.casecard .state.done{color:var(--ok)}
.casecard .state.go{color:var(--pri)}
.mini{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.mini i{display:block;height:100%;background:var(--pri);border-radius:99px}
.exam{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
@media (max-width:760px){.exam{grid-template-columns:1fr;gap:18px}}
.exam h2{font-size:1.25rem}
.exam p{color:var(--muted);font-size:.95rem;margin-top:6px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.split i{display:block}
.legend{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.legend li{display:flex;gap:10px;align-items:baseline}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none;transform:translateY(1px)}
.legend b{font-family:var(--f-mono);font-size:.86rem;min-width:3ch}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{font-size:.86rem;padding:6px 12px;border-radius:99px;border:1px dashed var(--line-2);color:var(--muted)}
.pagetitle{font-size:clamp(1.05rem,2.4vw,1.25rem);font-weight:700;color:var(--pri);margin:-6px 0 -4px}
.credit{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px 20px}
.credit .who{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.credit .who b{font-family:var(--f-display);font-size:1.05rem}
.credit .who span{font-size:.86rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:.88rem;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,transform .15s}
.links a:hover,.links button:hover{border-color:var(--pri);transform:translateY(-1px)}
.links svg{width:17px;height:17px;flex:none}
.foot{border-top:1px solid var(--line);padding-top:18px;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ---------- case workbook ---------- */
.book{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px))}
.sheet{overflow-y:auto;overscroll-behavior:contain;background:color-mix(in srgb,var(--surface) 45%,var(--bg));border-right:1px solid var(--line);padding-block:22px 48px;padding-left:var(--gut);padding-right:22px;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;flex-direction:column;gap:4px}
.sheet-h h1{font-size:1.55rem}
.sheet-h p{font-size:.88rem;color:var(--muted)}
.blk{position:relative;border:1px solid transparent;background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 0 var(--line);transition:border-color .25s,background-color .25s,opacity .25s,transform .2s}
.blk:hover{border-color:var(--line-2)}
.blk .go{position:absolute;top:12px;right:14px;font-size:.74rem;font-weight:700;color:var(--pri);opacity:0;transition:opacity .2s}
.blk:hover .go,.blk:focus-visible .go{opacity:1}
.blk h2{font-size:.98rem;display:flex;gap:10px;align-items:center}
.blk h2 .tg{font-family:var(--f-mono);font-size:.74rem;font-weight:700;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk);color:var(--muted)}
.blk p{font-size:.92rem;line-height:1.55}
.blk.on{border-color:var(--pri);background:var(--pri-soft)}
.blk.on h2 .tg{background:var(--pri);color:var(--on-pri)}
.sheet.focus .blk:not(.on){opacity:.72}
.sheet.focus .blk:not(.on):hover{opacity:1}
.qmap{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.qmap-h{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.qrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.qrow .lt{font-family:var(--f-mono);font-size:.72rem;font-weight:700;color:var(--faint);width:16px}
.qsq{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line-2);background:transparent;font-family:var(--f-mono);font-size:.74rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,background-color .2s,border-color .2s}
.qsq:hover{transform:translateY(-2px);border-color:var(--fg);color:var(--fg)}
.qsq.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.qsq.bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.qsq.cur{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--pri)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.k-inj{color:var(--c3);font-weight:700} .k-leak{color:var(--c1);font-weight:700}
.qs{overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scroll-padding-top:120px;scroll-padding-bottom:24px;padding-left:28px;padding-right:var(--gut-r);padding-bottom:42vh;display:flex;flex-direction:column;gap:20px;position:relative}
.bar{position:sticky;top:0;z-index:6;background:var(--bg);padding-block:14px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .chips{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px 5px 6px;font-size:.84rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip .tg{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk)}
.chip[aria-current="true"]{border-color:var(--pri);color:var(--fg)}
.chip[aria-current="true"] .tg{background:var(--pri);color:var(--on-pri)}
.chip .cnt{font-family:var(--f-mono);font-size:.74rem;color:var(--faint)}
.chip.full .cnt{color:var(--ok)}
.score{margin-left:auto;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.score b{font-family:var(--f-display);font-size:1.15rem}
.score span{font-size:.84rem;color:var(--muted)}
.prog{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.prog i{display:block;height:100%;transition:width .3s}
.prog .r{background:var(--ok)} .prog .w{background:var(--bad)}
.card{scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,box-shadow .2s,opacity .2s}
.qs.has-cur .card:not(.cur){opacity:.72}
.card.cur{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft),var(--shadow);opacity:1}
.qhead{display:flex;align-items:center;gap:10px}
.qn{font-family:var(--f-mono);font-size:.8rem;font-weight:700;min-width:30px;height:30px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;background:var(--sunk);color:var(--muted)}
.card.ok .qn{background:var(--ok);color:var(--bg)} .card.bad .qn{background:var(--bad);color:var(--bg)}
.card.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.card.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.card.ok.cur{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 28%,transparent),var(--shadow)}
.card.bad.cur{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 28%,transparent),var(--shadow)}
.card:is(.ok,.bad) .verdict{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.card:is(.ok,.bad) .field{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.restart{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.restart:hover{color:var(--fg);border-color:var(--line-2)}
.restart[data-armed]{color:var(--bad);border-color:var(--bad)}
.restart svg{width:14px;height:14px}
@media (max-width:620px){.restart .tl{display:none}}
.qtag{font-size:.8rem;font-weight:600;color:var(--muted)}
.qtext{font-size:1.06rem;font-weight:500;line-height:1.5;max-width:60ch}
.snip{display:none;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:9px;padding:8px 11px;line-height:1.5}
.ans{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.field{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:11px;background:var(--bg);overflow:hidden;flex:1 1 180px;max-width:320px;transition:border-color .15s}
.field:focus-within{border-color:var(--pri)}
.field input{border:0;background:transparent;padding:11px 13px;font-family:var(--f-mono);font-size:1.02rem;width:100%;min-width:0;outline:none}
.field input:disabled{opacity:.8}
.field .unit{padding:0 13px 0 4px;font-size:.86rem;color:var(--muted);white-space:nowrap}
.card.ok .field{border-color:var(--ok)} .card.bad .field{border-color:var(--bad)}
.check{border:0;border-radius:11px;padding:11px 18px;font-weight:700;background:var(--fg);color:var(--bg)}
.hintbtn{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;padding:8px 6px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.hintbtn:hover{color:var(--fg)}
.hint{font-size:.92rem;color:var(--muted);border-left:3px solid var(--c3);padding:2px 0 2px 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 13px;font-size:.96rem;line-height:1.45;transition:border-color .15s,background-color .15s}
.opt .k{font-family:var(--f-mono);font-weight:700;font-size:.82rem;color:var(--muted);min-width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk);flex:none;margin-top:1px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:var(--bg)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.6}
.verdict{display:flex;flex-direction:column;gap:10px;border-radius:12px;padding:14px 16px;font-size:.95rem;line-height:1.55}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict .vh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.verdict .vh b{font-family:var(--f-display);font-size:1.05rem}
.verdict.ok .vh b{color:var(--ok)} .verdict.bad .vh b{color:var(--bad)}
.verdict .exp{font-family:var(--f-mono);font-weight:700}

kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.6;font-weight:500}

function parseNum(s){

/* ---------- full screen that survives page changes ----------
   Browsers always leave full screen when the page changes. So while in full screen, links to another Nexus page
   open inside a full-screen frame of the current page. Leaving full screen reloads the page you were on, normally. */
const FS = (() => {
  const framed = (() => { try { return window.top !== window && window.top.location.origin === location.origin; } catch (e) { return false; } })();
  const T = framed ? window.top : window, d = T.document, el = d.documentElement;
  const can = !!(d.fullscreenEnabled || d.webkitFullscreenEnabled);
  const isOn = () => !!(d.fullscreenElement || d.webkitFullscreenElement);
  const enter = () => { try { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: "hide" }); if (r && r.catch) r.catch(() => {}); } catch (e) {} };
  const exit = () => { try { (d.exitFullscreen || d.webkitExitFullscreen).call(d); } catch (e) {} };
  const toggle = () => isOn() ? exit() : enter();
  const ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  function openShell(url){
    let f = document.getElementById("nxShell");
    if (!f){
      const st = document.createElement("style");
      st.textContent = "html.shelled,html.shelled body{overflow:hidden!important}html.shelled body>:not(#nxShell){display:none!important}#nxShell{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483647;background:transparent}";
      document.head.append(st);
      f = document.createElement("iframe"); f.id = "nxShell"; f.title = "Nexus"; f.allow = "fullscreen";
      f.addEventListener("load", () => { try { document.title = f.contentDocument.title; } catch (e) {} });
      document.body.append(f); document.documentElement.classList.add("shelled");
    }
    f.src = url;
  }
  if (!framed){
    document.addEventListener("click", e => {
      if (!isOn() || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest && e.target.closest("a[href]"); if (!a || (a.target && a.target !== "_self") || a.hasAttribute("download")) return;
      const u = new URL(a.href, location.href);
      if (u.origin !== location.origin || (u.pathname === location.pathname && u.search === location.search)) return;
      e.preventDefault(); openShell(u.href);
    });
    const back = () => { if (isOn()) return; const f = document.getElementById("nxShell"); if (!f) return; let u = null; try { u = f.contentWindow.location.href; } catch (e) {} location.href = u || location.href; };
    d.addEventListener("fullscreenchange", back); d.addEventListener("webkitfullscreenchange", back);
  }
  function bind(btn){
    if (!can){ btn.hidden = true; return; }
    const paint = () => { const on = isOn(); btn.innerHTML = (on ? EXIT : ENTER) + `<span class="tl">${on ? "Exit full screen" : "Full screen"}</span>`; btn.setAttribute("aria-label", on ? "Exit full screen" : "Full screen (F)"); btn.title = on ? "Exit full screen (F or Esc)" : "Full screen (F)"; btn.setAttribute("aria-pressed", String(on)); };
    btn.addEventListener("click", toggle);
    d.addEventListener("fullscreenchange", paint); d.addEventListener("webkitfullscreenchange", paint);
    addEventListener("pagehide", () => { d.removeEventListener("fullscreenchange", paint); d.removeEventListener("webkitfullscreenchange", paint); });
    document.addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey && !(e.target.closest && e.target.closest("input,textarea,select,[contenteditable]"))){ e.preventDefault(); toggle(); } });
    paint();
  }

  /* a small invitation, once per session, on devices that allow full screen */
  function invite(btn, delay = 1400){
    if (!can || framed || isOn()) return;
    try { if (sessionStorage.getItem("nexus-fs-inv")) return; } catch (e) {}
    const done = () => { try { sessionStorage.setItem("nexus-fs-inv", "1"); } catch (e) {} };
    setTimeout(() => {
      if (isOn() || !btn.isConnected) return;
      const el = document.createElement("div"); el.className = "fsinv"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Full screen");
      el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><p><b>Revise better in full screen.</b> <span>No tabs, no distractions.</span></p><button class="go" type="button">Full screen<kbd>F</kbd></button><button class="x" type="button" aria-label="Close">×</button>`;
      document.body.append(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
      btn.classList.add("fs-pulse");
      const close = () => { done(); el.classList.remove("show"); btn.classList.remove("fs-pulse"); setTimeout(() => el.remove(), 600); };
      el.querySelector(".go").addEventListener("click", () => { close(); enter(); });
      el.querySelector(".x").addEventListener("click", close);
      d.addEventListener("fullscreenchange", () => { if (isOn() && el.isConnected) close(); });
      setTimeout(() => { if (el.isConnected) close(); }, 14000);
    }, delay);
  }
  return { bind, invite };
})();


/* ---------- background colour that follows the scroll ----------
   Two or three colours, blended in OKLab so the fade looks even. The last colour is reached at `end` of the scroll
   and then stays. */
function scrollTint(getStops, getStart, end = 0.85, onTint = null){
  const root = document.documentElement;
  const dark = () => { const t = root.dataset.theme; return t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches); };
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const gam = c => { c = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.round(Math.min(1, Math.max(0, c)) * 255); };
  const toLab = h => { const [r, g, b] = [1, 3, 5].map(i => lin(parseInt(h.slice(i, i + 2), 16)));
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s]; };
  const toRGB = ([L, A, B]) => { const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3, m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3, s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
    return [gam(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s), gam(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s), gam(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)]; };
  let raf = 0;
  function upd(){
    raf = 0;
    const stops = getStops(dark());
    if (!stops){ root.style.removeProperty("--bg"); root.style.removeProperty("--scrim"); if (onTint) onTint([0, 0, 0]); return; }
    const start = getStart(), span = Math.max(1, (root.scrollHeight - innerHeight) * end - start);
    const p = Math.min(1, Math.max(0, (scrollY - start) / span)), e = p * p * (3 - 2 * p);
    const x = e * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
    const a = toLab(stops[i]), b = toLab(stops[i + 1]), c = toRGB(a.map((v, k) => v + (b[k] - v) * f));
    root.style.setProperty("--bg", `rgb(${c.join(" ")})`); root.style.setProperty("--scrim", c.join(" "));
    if (onTint) onTint(c);
  }
  const q = () => { if (!raf) raf = requestAnimationFrame(upd); };
  addEventListener("scroll", q, { passive: true }); addEventListener("resize", q); addEventListener("nexus-theme", q);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", q);
  q(); return q;
}


/* ---------- colour aura that follows the pointer (berry → violet → orange across the screen) ---------- */
const AURA = (() => {
  const el = document.createElement("div"); el.className = "aura"; el.setAttribute("aria-hidden", "true"); document.body.prepend(el);
  const st = { x: innerWidth * .7, y: innerHeight * .4, tx: innerWidth * .7, ty: innerHeight * .4 }; let raf = 0, on = false;
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const hx = h => [1, 3, 5].map(i => parseInt(h.trim().slice(i, i + 2), 16));
  function tick(){
    raf = 0; st.x += (st.tx - st.x) * .09; st.y += (st.ty - st.y) * .09;
    const cs = getComputedStyle(document.documentElement), f = Math.min(1, Math.max(0, st.x / innerWidth));
    const c = f < .5 ? mix(hx(cs.getPropertyValue("--pri")), hx(cs.getPropertyValue("--c3")), f * 2) : mix(hx(cs.getPropertyValue("--c3")), hx(cs.getPropertyValue("--c1")), f * 2 - 1);
    el.style.setProperty("--ax", st.x + "px"); el.style.setProperty("--ay", st.y + "px"); el.style.setProperty("--ac", `rgb(${c.join(" ")})`);
    if (on && (Math.abs(st.tx - st.x) > .5 || Math.abs(st.ty - st.y) > .5)) raf = requestAnimationFrame(tick);
  }
  addEventListener("pointermove", e => { if (!on || e.pointerType !== "mouse") return; st.tx = e.clientX; st.ty = e.clientY; if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });
  addEventListener("scroll", () => { if (!on || matchMedia("(hover: hover)").matches) return; const p = scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight); st.tx = innerWidth * (.15 + .7 * p); st.ty = innerHeight * (.3 + .4 * p); if (!raf) raf = requestAnimationFrame(tick); }, { passive: true });
  return { set(v){ on = v; el.hidden = !v; if (v && !raf) raf = requestAnimationFrame(tick); } };
})();


const RI = (a, b, s = 1) => a + s * Math.floor(Math.random() * ((b - a) / s + 1));
const PICK = a => a[Math.floor(Math.random() * a.length)];

{ id: "decide", n: 3, title: "Decision-making and biases", short: "Decisions", c: "var(--c3)",
  intro: "How individuals process information, when intuition can be trusted, the biases that distort judgment, how we perceive and explain other people, how groups bend our judgment, and the rational and bounded models of decision.",
  sections: [
  { title: "What a decision is", cards: [
    { id: "d-def", title: "Decision-making",
      line: "The process of choosing a course of action to deal with a problem or an opportunity. It is one truly distinctive part of a manager's job.",
      points: ["Drucker: a decision is a judgment, rarely between right and wrong, at best between \"almost right\" and \"probably wrong\".", "Decisions get more complex when they are multidimensional (tasty, healthy and cheap, not just tasty) and when there are many choices."] }
  ]},
  { title: "System 1 and System 2", widget: "puzzles", cards: [
    { id: "d-sys", title: "Two ways of thinking",
      line: "System 1 is automatic, fast, effortless and feels involuntary. System 2 is attentional, slow, effortful and feels like a choice.",
      example: "A bat and a ball cost $1.10; the bat costs $1.00 more than the ball. System 1 says 10 cents. System 2 checks: 0.10 + 1.10 = 1.20. The ball costs 5 cents (0.05 + 1.05 = 1.10)." },
    { id: "d-when1", title: "When System 1 takes over",
      line: "Under time pressure and cognitive depletion, System 2 is harder to activate.",
      points: ["Depletion comes from suppressing emotions, trying to impress people, acting against your personality, stress, multitasking.", "Why we rely on System 1: evolution (fast thinking helped survival), efficiency (the brain saves energy), socialization (we absorb norms and habits from family, school, culture, media)."] },
    { id: "d-intuition", title: "When intuition works (Dane et al., 2012)",
      line: "Intuition works best when BOTH conditions hold: the task is non-decomposable, and the decision maker has high domain expertise.",
      points: ["Non-decomposable: hard to break into separate steps; you need to see the whole pattern.", "High expertise: long experience has built meaningful patterns.", "Expert intuition develops through extensive domain experience, repeated exposure to patterns, deliberate practice and frequent, informative feedback."],
      example: "An experienced surgeon who diagnoses a torn ligament after ten seconds of bending a knee: expertise plus a pattern-recognition task.",
      trap: "\"Does intuition work? Yes or no?\" The expected answer is: it depends on the two conditions. A novice's gut feeling on a task that can be broken into steps is not reliable." }
  ]},
  { title: "Decision biases", widget: "framing", cards: [
    { id: "d-bias", title: "What a cognitive bias is",
      line: "A systematic, often unconscious, tendency in thinking that distorts judgments and decisions.",
      points: ["Good news: because biases are systematic, they create predictable errors, so managers can design processes that reduce them."] },
    { id: "d-confirm", title: "Confirmation bias",
      line: "Seeking, interpreting and remembering information so that it confirms what we already believe, while discounting contrary evidence.",
      example: "A manager convinced that a new hire is weak notices every mistake and forgets every success." },
    { id: "d-over", title: "Overconfidence bias",
      line: "Overestimating the accuracy of our judgments, predictions, knowledge or abilities.",
      points: ["Fewer than 5% of MBA students expect to be below the median in most classes.", "94% of professors at a large university thought they were better than the average professor.", "Small-business owners put the success rate of small businesses at 50%, and their own at 90%."] },
    { id: "d-anchor", title: "Anchoring bias",
      line: "Relying too heavily on a first piece of information (the anchor) and adjusting too little from it, even when the anchor is arbitrary.",

    { id: "d-avail", title: "Availability bias",
      line: "Judging how likely or important something is by how easily examples come to mind.",

      line: "A loss weighs more than an equal gain: roughly twice as much." },
    { id: "d-frame", title: "Framing bias",
      line: "The same information leads to different decisions depending on how it is presented.",
      points: ["Gain frame (\"saves 200 lives\"): the sure option feels attractive, people are risk-averse. 72% chose the sure treatment.", "Loss frame (\"400 people will die\"): the gamble feels like a chance to avoid the sure loss, people are risk-seeking. 78% chose the gamble.", "Same outcomes, different frame, different risk preference. Loss aversion is at work."],
      exam: "Remember the rule: people take more risk when information is framed as losses." },
    { id: "d-sunk", title: "Sunk cost fallacy and escalation of commitment",
      line: "Letting past, unrecoverable investments (time, money, effort) drive a current decision. It can lead to escalation of commitment: sticking with, or increasing support for, a failing course of action.",
      example: "\"We've already spent €2 million on this software, we can't stop now\", even though every new test shows it will not work." },
    { id: "d-action", title: "Action bias",
      line: "Favoring action over inaction, even when doing nothing would be better." },
    { id: "d-fix", title: "Reducing biases",
      line: "Be aware of your potential biases, get more eyes on the problem, and use System 2 for important decisions.",
      exam: "For any biased decision in a case, name the bias, explain the mechanism, then give one of these remedies applied to the case." }
  ]},
  { title: "Social perception", cards: [
    { id: "d-perc", title: "Perception and social perception",
      line: "Perception is the process by which we interpret our surroundings. Social perception is how we form impressions and judge other people from what we observe.",
      points: ["Perception drives judgments, decisions and behavior.", "It is sometimes wrong and sometimes just different between people: same facts, different stories.", "Perception differs from reality, which creates biases."] },
    { id: "d-person", title: "Biased person perception at work",
      line: "Impressions distort hiring, appraisals and judgments of leaders.",
      points: ["Hiring: first impressions and stereotypes (\"we have a similar background, they must be a good fit\").", "Halo effect: one overall impression colors ratings of specific aspects (\"she communicates confidently, so her work must be excellent\").", "Contrast effect: after rating an outstanding employee, a solid one looks poor.", "Leadership stereotypes: the same firm instructions called \"decisive\" from a man and \"bossy\" from a woman."] }
  ]},
  { title: "Attribution theory", widget: "kelley", cards: [
    { id: "d-attr", title: "Three causal dimensions",
      line: "When we explain behavior, we judge whether its cause is internal or external, stable or unstable, controllable or not.",
      points: ["Internal (about the person, dispositional) vs external (about the situation).", "Stable (enduring across episodes) vs unstable (varies).", "Controllable (can be willfully influenced) vs uncontrollable."] },
    { id: "d-ssb", title: "Self-serving bias",
      line: "Judging ourselves, we attribute success to internal factors and failure to external ones.",
      example: "\"I passed because I'm smart and worked hard.\" \"I failed because the test was hard and I had bad luck.\"" },
    { id: "d-fae", title: "Fundamental attribution error",
      line: "Judging others, we overestimate internal causes of their failures (and tend to put their successes down to external factors).",
      points: ["Others' failure: \"they are lazy\", \"they are not very smart\". Others' success: \"they were lucky\", \"the test was easy\".", "Managerial risk: wrong attribution, wrong action. Underperformance read as lack of effort leads to punishment, as lack of ability to demotion; read as task difficulty it leads to training, as new competitors to a new strategy."] },
    { id: "d-kelley", title: "Kelley's model: person or situation?",
      line: "Three questions decide between an internal and an external attribution: distinctiveness, consensus, consistency.",
      formula: "Distinctiveness: does the person behave differently in other situations?\nConsensus:       do other people behave the same way in this situation?\nConsistency:     does the person always act this way in this situation?\n\nHigh distinctiveness + high consensus + low consistency  →  EXTERNAL\nLow distinctiveness  + low consensus  + high consistency →  INTERNAL",
      example: "Peter, a top sales rep for three years, has a bad quarter. His reports are still on time and excellent (high distinctiveness), most other reps' sales also fell (high consensus), and his past performance was high (low consistency). Attribution: external.",
      trap: "Distinctiveness asks about the same person in other situations; consensus asks about other people in the same situation. Students often swap them." }
  ]},
  { title: "Groups and social influence", cards: [
    { id: "d-teams", title: "Assets and liabilities of team decisions",
      line: "Teams do better on complex tasks and bring more ideas, information and creativity; they do worse on simple tasks and cost time.",
      points: ["Assets: better performance on complex tasks, divergent ideas, creativity, more information.", "Liabilities: worse on simple tasks, time, conflict, and social influence that can hinder the decision.", "Diverse groups can bring more information, perspectives and alternatives."] },
    { id: "d-asch", title: "Asch: conformity",
      line: "Shown three lines and asked which matches a reference line, many people gave the obviously wrong answer when a unanimous group did so first.",
      points: ["Conformity: adjusting your judgment to match the group, even against clear evidence."] },
    { id: "d-milgram", title: "Milgram: obedience to authority",
      line: "Participants told by an experimenter to keep going gave what they believed were painful electric shocks to another person (an actor pretending to suffer).",
      points: ["Beyond conformity: people follow orders from an authority figure against their own conscience."],
      trap: "Asch is about pressure from peers (conformity); Milgram is about pressure from an authority (obedience)." },
    { id: "d-groupthink", title: "Groupthink",
      line: "The pressure for consensus discourages dissent and critical evaluation: keeping agreement becomes more important than evaluating alternatives.",
      points: ["Result: relevant information and alternatives are overlooked, and members find it hard to disagree."] },
    { id: "d-prevent", title: "Protecting group decisions",
      line: "Make social influence visible and build dissent into the process.",
      points: ["Be aware of social influence.", "Collect independent judgments before discussion.", "Assign a devil's advocate, critical evaluator or external expert.", "Encourage dissent.", "Leaders should not signal a preferred option too early.", "Generate multiple alternatives."] }
  ]},
  { title: "Decision models", cards: [
    { id: "d-rational", title: "The rational decision-making model",
      line: "Four stages: identify the problem or opportunity, generate alternative solutions, evaluate them and select one, implement and evaluate the chosen solution." },
    { id: "d-simon", title: "Simon: bounded rationality and satisficing",
      line: "Decision makers have limited time, information and cognitive capacity, so they cannot list every option and consequence. They consider a manageable set of options and stop once a solution is good enough.",
      exam: "\"Can we always use rational decision-making?\" No: bounded rationality. The answer is to satisfice, and to reserve System 2 effort for important decisions." }
  ]}
]},
{ id: "motiv", n: 4, title: "Motivation and engagement", short: "Motivation", c: "var(--c4)",
  intro: "What motivation is, the theories that explain it (needs, self-determination, two factors, job design, goals, fairness) and what managers can do with each.",
  sections: [
  { title: "What motivation is", cards: [
    { id: "m-def", title: "Three dimensions",
      line: "Motivation has a direction (what the person is trying to achieve), an intensity (how hard they try) and a persistence (how long they keep trying)." }
  ]},
  { title: "Maslow", cards: [
    { id: "m-maslow", title: "Maslow's hierarchy of needs (1954)",
      line: "Five needs, satisfied in a set order: physiological, safety, belonging and love, esteem, self-actualization.",
      points: ["Basic needs: physiological (food, water, warmth, rest), safety (security, resources).", "Psychological needs: belonging (relationships, friends), esteem (prestige, accomplishment).", "Self-fulfillment: self-actualization (reaching your full potential, including creative activities)."] },
    { id: "m-maslow2", title: "After 70 years of research",
      line: "Confirmed: fulfilling each need contributes independently to well-being, across cultures. Not confirmed: the hierarchy itself.",
      points: ["People often pursue higher-level goals even when basic needs are unmet."],
      example: "A student short of money and sleep who still pours energy into a project they believe in.",
      exam: "Main criticism of Maslow: the order. The needs matter; the strict hierarchy does not hold." }
  ]},
  { title: "Intrinsic and extrinsic", cards: [
    { id: "m-ie", title: "Two kinds of reasons",
      line: "Extrinsic motivation is driven by outcomes separate from the activity. Intrinsic motivation is driven by the appeal of the activity itself.",
      points: ["Extrinsic: effort less stable, rewards can lose their power, attention shifts to the reward (and to shortcuts). Effective for short-term compliance.", "Intrinsic: self-sustaining effort, deeper engagement, learning and well-being, attention on the task, more persistence.", "Most real motivation is a mix of both."],
      example: "Going to class for the grade (extrinsic) or out of curiosity (intrinsic). Volunteering for your CV or because it is fun and meaningful." }
  ]},
  { title: "Self-Determination Theory", widget: "continuum", cards: [
    { id: "m-sdt", title: "Three basic psychological needs",
      line: "Competence, autonomy and relatedness. When work satisfies them, motivation, performance and well-being follow (Deci, Olafsen & Ryan, 2017).",
      points: ["Competence: feeling capable and effective at a task.", "Autonomy: freedom and discretion over what you do and how.", "Relatedness: feeling connected to others and part of a group."] },
    { id: "m-cont", title: "The internalization continuum (Ryan & Deci, 2000)",
      line: "Extrinsic motivation is not all the same: it runs from controlled to autonomous.",
      points: ["Amotivation: no driver. \"I don't see why I'm doing this.\"", "External regulation: rewards, punishments, being forced. Locus: external.", "Introjection: guilt, shame, ego, seeking approval. Locus: somewhat external.", "Identification: personal value and usefulness. \"I believe it is important.\" Locus: somewhat internal.", "Integration: full fit with your values and identity. Locus: internal.", "Intrinsic motivation: the activity itself is interesting or enjoyable. Locus: internal."],
      example: "Two call-center agents. \"I answer calls because I'm paid and monitored\": controlled (external regulation). \"I answer calls because helping callers matters to me\": autonomous (identified or integrated).",
      exam: "Can extrinsic motivation be autonomous? Yes: identification and integration are extrinsic but autonomous." },
    { id: "m-sdt-mgr", title: "What managers can do",
      line: "Build a context that supports each need. Autonomy is the critical bridge from guilt-driven to autonomous commitment.",
      points: ["Competence: confidence to take on goals; resources, time, contacts, coaching.", "Relatedness: the social willingness to take on goals; fun and camaraderie.", "Autonomy: empower people, delegate meaningful tasks.", "Autonomy-supportive supervision: meaningful choice, acknowledging the person's view, minimal unnecessary control. Controlling supervision undermines autonomy.", "Informational feedback (\"I liked how you structured the argument\") supports competence and keeps autonomy. No feedback gives little to competence; controlling feedback (\"keep doing it exactly this way\") undermines autonomy."],
      example: "Gmail came out of Google's freedom to pursue side projects: progress in mastering skills (competence), choosing how to work (autonomy), working with people you like (relatedness), hence intrinsic or integrated motivation, creativity and persistence." }
  ]},
  { title: "Designing motivating jobs", widget: "jcm", cards: [
    { id: "m-herz", title: "Herzberg's two-factor theory",
      line: "Improving hygiene factors reduces dissatisfaction but does not create motivation or satisfaction. Motivators do.",
      points: ["Motivators: achievement, recognition, the work itself, advancement, growth.", "Hygiene factors: relationships with peers, company policies, physical workspace, working conditions, salary, status, security, supervision."],
      trap: "Salary is a hygiene factor here. A raise can remove dissatisfaction without making anyone more motivated." },
    { id: "m-jcm", title: "The Job Characteristics Model (Hackman & Oldham)",
      line: "Five core job dimensions create three psychological states, which lead to motivation, satisfaction and effectiveness.",
      points: ["Skill variety: the job uses many different skills.", "Task identity: you complete a whole, identifiable piece of work.", "Task significance: the job affects other people's lives or work.", "Autonomy: freedom to decide how the work is done.", "Feedback: the work itself tells you clearly how well you are doing.", "Variety, identity and significance → experienced meaningfulness. Autonomy → experienced responsibility for outcomes. Feedback → knowledge of actual results.", "Outcomes: high intrinsic motivation, growth satisfaction, job satisfaction, work effectiveness."],
      exam: "Example of job enrichment: let a warehouse picker handle a client's whole order from receipt to dispatch (task identity) and see the client's rating (feedback)." },
    { id: "m-mod", title: "JCM moderators",
      line: "Not everyone wants a job with all five characteristics.",
      points: ["Knowledge and skill.", "Growth need strength.", "Context satisfactions (pay, colleagues, supervision...).", "They moderate both the psychological states and the outcomes."] }
  ]},
  { title: "Goal setting", cards: [
    { id: "m-goal", title: "Goal-setting theory (Locke & Latham)",
      line: "Specific, difficult goals lead to higher performance than vague or easy goals, or \"do your best\". When asked to do their best, people do not.",
      points: ["Mediators (why it works): direction of attention, effort, persistence, strategies.", "Moderators (when it works): ability, resources, goal commitment, feedback."] },
    { id: "m-goal2", title: "Performance goals and learning goals",
      line: "Performance goals target an end result; learning goals target new skills or knowledge. The right choice depends on task complexity and the person's experience.",
      example: "Performance: secure 3 new clients this month. Learning: learn to handle client objections confidently in sales calls." },
    { id: "m-smart", title: "SMART goals",
      line: "Specific, Measurable, Achievable, Relevant (results-oriented), Timely.",
      example: "\"I'll study very hard for the exam\" becomes: \"By Sunday 6 pm, I will answer all the lecture 3 self-check questions in writing and score at least 80% on the decisions quiz.\"" }
  ]},
  { title: "Fairness", widget: "equity", cards: [
    { id: "m-equity", title: "Equity theory",
      line: "People compare their own outcomes-to-inputs ratio with a referent's. A gap creates tension that they are motivated to reduce.",
      formula: "My outcomes / My inputs   vs   Other's outcomes / Other's inputs\nOutcomes: pay, promotion, recognition, flexibility\nInputs:   effort, skill, experience, time",
      points: ["Six ways to reduce inequity: change inputs (less effort if underpaid), change outcomes (ask for a raise), distort perceptions of self, distort perceptions of others, choose a different referent, leave the field (quit)."],
      example: "Hiring a financial analyst when the team earns $62 to 65k: offering the favorite candidate $70k may be fair to them and still trigger inequity among current analysts doing the same job." },
    { id: "m-justice", title: "Organizational justice",
      line: "The overall perception of fairness at work has three parts.",
      points: ["Distributive: are the outcomes fair? Pay, promotion, recognition, workload. \"I got the raise I deserved.\"", "Procedural: was the process fair? Voice, consistency, unbiased decisions, accurate information. \"I had input and got a good explanation.\"", "Interactional: was I treated with respect and dignity, and given adequate explanations? \"My supervisor was kind when telling me.\""] }
  ]}
]}
];
